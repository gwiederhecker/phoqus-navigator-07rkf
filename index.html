<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PHOQUS · Reviewer navigator · FAPESP CEPID 2026/09698-0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FA; --surface:#FFFFFF; --sunk:#EEF2F6; --ink:#16202E; --muted:#596476; --faint:#8A94A4; --line:#DCE2EA;
  --A:#0B7A75; --B:#5B4BA8; --C:#B23A48; --X:#56657A; --beam:#E9A400; --beam-soft:#FFF4D6;
  --A-soft:#E3F3F2; --B-soft:#ECE9F7; --C-soft:#F8E6E8; --X-soft:#E9EDF2;
  --focus:#2F6FEB; --mark:#FFE58A;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --r-s:6px; --r-m:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F141B; --surface:#161D27; --sunk:#1C2531; --ink:#E7EBF1; --muted:#A3AEBE; --faint:#748094; --line:#2A3443;
    --A:#3CC2B9; --B:#9F92EA; --C:#EC7C8A; --X:#9AAABE; --beam:#F5C33B; --beam-soft:#3A3115;
    --A-soft:#123230; --B-soft:#221F3A; --C-soft:#3A1D23; --X-soft:#222B37; --mark:#7A6312; --focus:#7AA7FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141B; --surface:#161D27; --sunk:#1C2531; --ink:#E7EBF1; --muted:#A3AEBE; --faint:#748094; --line:#2A3443;
  --A:#3CC2B9; --B:#9F92EA; --C:#EC7C8A; --X:#9AAABE; --beam:#F5C33B; --beam-soft:#3A3115;
  --A-soft:#123230; --B-soft:#221F3A; --C-soft:#3A1D23; --X-soft:#222B37; --mark:#7A6312; --focus:#7AA7FF;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
#nav{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:22px 16px 16px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;margin:0 6px 18px}
.brand svg{flex:none}
.brand b{display:block;font-size:19px;letter-spacing:.02em}
.brand span{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.searchbtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-s);color:var(--muted);cursor:pointer;text-align:left;margin-bottom:14px}
.searchbtn kbd{margin-left:auto;font:12px var(--sans);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--faint)}
#nav ol{list-style:none;margin:0;padding:0}
#nav li a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r-s);text-decoration:none;color:var(--muted);font-weight:500}
#nav li a:hover{background:var(--sunk);color:var(--ink)}
#nav li a[aria-current="page"]{background:var(--sunk);color:var(--ink);box-shadow:inset 3px 0 0 var(--beam)}
#nav li a .ix{width:18px;height:18px;flex:none;opacity:.8}
.navfoot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);font-size:12px;color:var(--faint);line-height:1.45}
.navfoot button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
#main{min-width:0;padding:34px 44px 80px}
.page{max-width:1120px;margin:0 auto}
.menubtn{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #nav{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  body.navopen #nav{transform:none;box-shadow:0 0 0 100vmax rgba(10,15,25,.45)}
  #main{padding:64px 18px 60px}
  .menubtn{display:flex;position:fixed;top:12px;left:12px;z-index:30;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;gap:6px;align-items:center;cursor:pointer}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--sans);line-height:1.2;margin:0}
.ptitle{font-size:30px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.lede{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--muted);max-width:68ch;margin:0 0 26px}
h2.sec{font-size:20px;font-weight:600;margin:40px 0 14px;display:flex;align-items:baseline;gap:12px}
h2.sec small{font-size:13px;font-weight:500;color:var(--faint)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.serif{font-family:var(--serif)}
p{margin:0 0 12px}

/* ---------- generic pieces ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:20px;text-decoration:none;border:1px solid transparent;white-space:nowrap;cursor:pointer;background:var(--sunk);color:var(--ink)}
.chip.A{background:var(--A-soft);color:var(--A)} .chip.B{background:var(--B-soft);color:var(--B)}
.chip.C{background:var(--C-soft);color:var(--C)} .chip.X{background:var(--X-soft);color:var(--X)}
.chip.L{background:var(--beam-soft);color:var(--ink);border-color:color-mix(in srgb,var(--beam) 55%,transparent)}
.chip.ghost{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{max-width:280px}
input[type=search],select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px}
input[type=search]{min-width:220px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-weight:600;text-align:left;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th button{all:unset;cursor:pointer}
table.t th button:focus-visible{outline:2px solid var(--focus)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:var(--sunk)}
table.t tr.detail td{background:var(--paper);font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--ink)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- overview ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:end;padding-bottom:30px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(40px,6vw,74px);font-weight:500;letter-spacing:-.035em;line-height:.95;margin:6px 0 16px}
.hero h1 .ac{font-weight:700}
.hero .proc{font-size:14px;color:var(--muted)}
.hero .mission{font-family:var(--serif);font-size:20px;line-height:1.5;margin:0}
.hero .who{font-size:13.5px;color:var(--muted);margin-top:16px;line-height:1.6}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:18px}}
.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:26px 0 8px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.facts a{padding:14px 16px;text-decoration:none;border-right:1px solid var(--line)}
.facts a:last-child{border-right:0}
.facts a:hover{background:var(--sunk)}
.facts b{display:block;font-size:24px;font-weight:600;letter-spacing:-.01em}
.facts span{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.facts{grid-template-columns:repeat(2,1fr)}.facts a{border-bottom:1px solid var(--line)}}
.lhrow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1000px){.lhrow{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.lhrow{grid-template-columns:1fr}}
.lhcard{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 16px 14px;position:relative;overflow:hidden}
.lhcard:hover{border-color:var(--beam)}
.lhcard .lid{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.lhcard h3{font-size:16px;font-weight:600;margin:8px 0 8px;line-height:1.3}
.lhcard .yrs{font-size:12.5px;color:var(--muted)}
.lhcard::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--beam-soft),transparent 70%)}
.qlist{counter-reset:none;margin:0;padding:0;list-style:none}
.qlist li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist .k{font-weight:700;font-size:15px;color:var(--muted)}
.qlist p{font-family:var(--serif);font-size:16.5px;line-height:1.5;margin:0}
.qlist .tags{margin-top:6px}
.startlist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.startlist a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-decoration:none}
.startlist a:hover{border-color:var(--muted)}
.startlist b{display:block;margin-bottom:2px}
.startlist span{font-size:13.5px;color:var(--muted)}
@media (max-width:700px){.startlist{grid-template-columns:1fr}}

/* ---------- roadmap ---------- */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 8px 6px}
.diagram svg{width:100%;height:auto;display:block}
.dg-wp rect{fill:var(--surface);stroke:var(--line)}
.dg-wp text{font:600 13px var(--sans);fill:var(--ink)}
.dg-wp text.sub{font:400 11.5px var(--sans);fill:var(--muted)}
.dg-wp,.dg-lh{cursor:pointer}
.dg-path{fill:none;stroke-width:2;opacity:.55;transition:opacity .15s,stroke-width .15s}
.dg-path.alt{stroke-dasharray:5 5}
.diagram.focus .dg-path{opacity:.08}
.diagram.focus .dg-path.on{opacity:1;stroke-width:3}
.diagram.focus .dg-wp{opacity:.35}
.diagram.focus .dg-wp.on{opacity:1}
.diagram.focus .dg-lh{opacity:.4}
.diagram.focus .dg-lh.on{opacity:1}
.dg-lh circle.halo{fill:var(--beam-soft)}
.dg-lh circle.core{fill:var(--beam)}
.dg-lh text{font:600 13.5px var(--sans);fill:var(--ink)}
.dg-lh text.sub{font:400 11.5px var(--sans);fill:var(--muted)}
.dg-branch{font:600 12px var(--sans)}
.dg-legend{font:400 11.5px var(--sans);fill:var(--muted)}
.lhdetail{margin-top:18px}
.lhdetail .head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:12px}
.lhdetail h3{font-size:21px;font-weight:600}
.tgt{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-top:6px}
.tgt>div{padding:14px 16px;border-right:1px solid var(--line);background:var(--surface)}
.tgt>div:last-child{border-right:0;background:var(--paper)}
.tgt h4{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.tgt p{font-family:var(--serif);font-size:15.5px;line-height:1.5;margin:0}
@media (max-width:900px){.tgt{grid-template-columns:1fr}.tgt>div{border-right:0;border-bottom:1px solid var(--line)}}
.yearaxis{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.yearaxis svg{width:100%;height:auto;display:block}
.ya-grid{stroke:var(--line)} .ya-lbl{font:500 11.5px var(--sans);fill:var(--muted)}
.ya-row{font:600 12.5px var(--sans);fill:var(--ink)}
.ya-bar{fill:var(--beam-soft);stroke:color-mix(in srgb,var(--beam) 60%,transparent)}
.ya-thr{fill:var(--ink)} .ya-goal{fill:var(--beam);stroke:var(--ink);stroke-width:.8}
.ya-eval{fill:var(--C);font:600 11px var(--sans)}
.ms{display:grid;gap:0}
.msrow{display:grid;grid-template-columns:64px 78px 1fr 1fr;gap:12px;padding:10px 4px;border-top:1px solid var(--line);align-items:start}
.msrow:first-child{border-top:0}
.msrow .code{font-weight:700}
.msrow .m{color:var(--muted)}
.msrow .d{font-family:var(--serif);font-size:15.5px}
.msrow .v{font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.msrow{grid-template-columns:56px 1fr}.msrow .d,.msrow .v{grid-column:2}}
.mstrack{position:relative;height:40px;margin:8px 4px 18px;border-bottom:2px solid var(--line)}
.mstrack .tick{position:absolute;bottom:-20px;font-size:11.5px;color:var(--faint);transform:translateX(-50%)}
.mstrack .pin{position:absolute;bottom:0;white-space:nowrap;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700}
.mstrack .pin i{width:10px;height:10px;transform:rotate(45deg);background:var(--ink);display:block;margin-bottom:-6px}
.mstrack .pin.S i{border-radius:50%;transform:none;background:var(--A)}
.mstrack .pin.D i{background:var(--C)}
.mstrack .pin.L i{background:var(--beam)}

/* ---------- work packages ---------- */
.branchhead{display:flex;align-items:center;gap:12px;margin:34px 0 12px}
.branchhead .sw{width:12px;height:28px;border-radius:3px}
.branchhead h2{font-size:20px;font-weight:600}
.wpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:1000px){.wpgrid{grid-template-columns:1fr}}
.wpcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;border-top:3px solid var(--bc)}
.wpcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wpcard .top .chips{flex-wrap:nowrap;flex:none}
.wpcard .code{font-weight:700;color:var(--bc);font-size:14px}
.wpcard h3{font-size:17px;font-weight:600;margin:4px 0 10px;line-height:1.3}
.wpcard .team{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.wpcard .team b{color:var(--ink);font-weight:600}
.wpcard .q{font-family:var(--serif);font-size:15.5px;line-height:1.5;margin:10px 0}
.wpcard details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.wpcard summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.wpcard .rows{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:13.5px;margin-top:10px;align-items:start}
.wpcard .rows>span{color:var(--muted)}
.wpcard.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--beam) 45%,transparent)}100%{box-shadow:none}}

/* ---------- people ---------- */
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:900px){.people{grid-template-columns:1fr}}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;display:grid;grid-template-columns:44px 1fr;gap:14px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--sunk);color:var(--muted)}
.person h3{font-size:16px;font-weight:600}
.person .aff{font-size:13px;color:var(--muted);margin:1px 0 6px}
.person .role{font-size:13px;font-weight:600;margin-bottom:6px}
.person p{font-family:var(--serif);font-size:15px;line-height:1.5;margin:0 0 8px}
.assoc{columns:2;column-gap:28px}
@media (max-width:800px){.assoc{columns:1}}
.assoc .a{break-inside:avoid;padding:10px 0;border-top:1px solid var(--line)}
.assoc .a b{font-weight:600}
.assoc .a p{font-family:var(--serif);font-size:15px;margin:3px 0 0;line-height:1.45}

/* ---------- budget ---------- */
.bhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:22px}
.bigmoney{font-size:clamp(34px,4.6vw,52px);font-weight:600;letter-spacing:-.02em;line-height:1}
.bigmoney small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px}
.donutwrap{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
@media (max-width:800px){.donutwrap{grid-template-columns:1fr}}
.donut path{cursor:pointer;transition:opacity .15s}
.donut.focus path{opacity:.3}.donut.focus path.on{opacity:1}
.legend{display:grid;gap:2px}
.legend button{all:unset;display:grid;grid-template-columns:14px 1fr auto 58px;gap:12px;align-items:center;padding:7px 8px;border-radius:var(--r-s);cursor:pointer}
.legend button:hover,.legend button.on{background:var(--sunk)}
.legend button:focus-visible{outline:2px solid var(--focus)}
.legend .sw{width:14px;height:14px;border-radius:3px}
.legend .v{font-weight:600;text-align:right}
.legend .p{text-align:right;color:var(--muted)}
.legend .hint{grid-column:2/5;font-size:12.5px;color:var(--muted);margin-top:-2px}
.stack{display:flex;height:34px;border-radius:var(--r-s);overflow:hidden;margin:10px 0 8px}
.stack div{display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) 110px;gap:12px;align-items:center;font-size:13.5px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--A);border-radius:6px}
.bar .val{text-align:right;font-weight:600}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px}
.gloss div{font-size:13.5px;color:var(--muted);line-height:1.5}
.gloss b{color:var(--ink);display:block}
@media (max-width:800px){.gloss{grid-template-columns:1fr}}
.adminbox{border:1px dashed var(--C);background:var(--C-soft);border-radius:var(--r-m);padding:16px 18px;margin-bottom:24px}
.adminbox h3{font-size:15px;margin-bottom:8px;color:var(--C)}
.adminbox ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}

/* ---------- documents / reader ---------- */
.doclist{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:800px){.doclist{grid-template-columns:1fr}}
.doclist a{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-decoration:none}
.doclist a:hover{border-color:var(--muted)}

@media (max-width:1100px){.reader{grid-template-columns:1fr}.toc{display:none}}

<script id="proposal-data" type="application/json">{"generated":"2026-11-04T10:20:53","docs":[{"id":"research_plan","group":"documents","title":"Research Plan and Scientific Relevance","pages":20,"file":"documents/research_plan.pdf","blocks":[{"t":"h1","x":"1. Vision, mission and transformative questions","id":"s1"},{"t":"p","x":"Vision. Integrated photonics has become a hardware layer on which quantum technologies will be deployed, and the scientific frontier of the field has moved from the performance of isolated devices to the generation, control and preservation of non-classical states in heterogeneous circuits: across sources, nonlinear and electro-optic elements, packaging, fiber interfaces, measurement systems and the boundary with other quantum platforms. PHOQUS will use integrated devices to uncover the mechanisms and limits of quantum-state engineering in such systems, and will structure in São Paulo the platform on which those discoveries are validated at the system level. Our center will develop photonic chips that generate, manipulate, transmit and detect quantum light, designed, fabricated on silicon nitride (SiN), thin-film lithium niobate (TFLN) and III–V semiconductors, packaged and tested along one pathway by groups that already hold the component expertise (nonlinear integrated photonics, semiconductor quantum dots (QDs), continuous-variable (CV) quantum optics, two-dimensional (2D) materials, optomechanics, nanofabrication). The center has a single program: a place where a quantum-photonic system goes from design to field operation, where new physics of integrated quantum light is produced, and where a workforce that moves between cleanroom, integrated optics and quantum measurement is trained."},{"t":"p","x":"Mission. To establish in the State of São Paulo an internationally competitive center for research, innovation and training in integrated quantum photonics, delivering photonic chips that generate, manipulate, transmit and detect quantum states of light, and demonstrating that those states survive every interface of a deployed system. Three transformative questions. The program is organized around three questions whose answers are not known today, each tied to one of the four lighthouse experiments (L1–L4) of Section 4, the flagship system demonstrations that serve as the center’s integration checkpoints. Q1. Can quantum states generated on a chip survive every interface of a deployed system, from the chip facet to a metropolitan fiber link and back to on-chip detection, with performance limited by the channel rather than by the chip? (L1, L2.) Q2. Does a quantum measurement advantage persist through a realistic multi-component measurement chain, in which sources, combs, squeezer, sample and detectors each add loss and noise? (L3.) Q3. Can a photonic chip connect coherently to microwave quantum processors, so that integrated photonics becomes the interconnect of quantum networks rather than a stand-alone technology? (L4.) The questions are ordered by the number of interfaces a quantum state must cross, and the center’s internal metric is a shared loss and noise budget (Section 3). Three discovery hypotheses. The lighthouses are system tests; the new physics is organized in three hypotheses that the work packages of Section 5 test with their own observables. H-A, engineered quantum dynamics in coupled nonlinear resonators: independently tunable mode hybridization, dispersion and parametric pathways in photonic molecules give forms of multimode quantum-state control, fluctuation-spectrum engineering and correlation redistribution that are inaccessible, under equivalent pump, loss, linewidth and detection constraints, to a single resonator; the evidence is quadrature covariance matrices and mode-resolved noise spectra measured as coupling and detuning are varied independently, against a quantum coupled-mode model and matched single-resonator reference devices (NIP-1 with QPC-2). H-B, physical limits of quantum-enhanced integrated measurement: a non-classical resource gives a net estimation advantage in a broadband, multimode, non-ideal measurement chain only within a region of loss, mode mismatch, phase drift, comb technical noise and detection efficiency that can be predicted and tested; the evidence is a Fisher-information or sensitivity gain over a resource-matched optimized classical reference, with its loss budget (QPC-2, QEPS-1, NIP-1, NIP-3, QPC-3). H-C, coherent photonic–phononic–solid-state interfaces: engineered acoustic and mechanical modes create regimes of coherent control and correlation between photons and microwave or solid-state systems; the evidence is a calibrated non-classicality or coherence observable beyond classical transduction performance (NIP-2, QEPS-2, XC-1, with NIP-4 and QEPS-3 where relevant)."},{"t":"p","x":"Expected discoveries and benefit. Scientifically, the center expects to establish which combinations of platform, emitter and readout preserve quantum coherence end to end, to develop new quantum emitters (epitaxial, colloidal and 2D) and determine how far each can be integrated without losing coherence, to demonstrate quantum-enhanced spectroscopy on a chip-based instrument for the first time, and to bring microwave–optical transduction to the regime in which a superconducting processor can be read optically; along the way it will produce the process modules (ultralow-loss SiN, periodically poled TFLN, waveguide-coupled QDs and 2D materials, cryogenic packaging) that make these results reproducible by others. For society, the deliverables are concrete: quantum random-number generation (QRNG) and quantum key distribution (QKD) modules evaluated on real fiber for the secure-communication sector; gas-sensing spectrometers with a quantum advantage for environmental and agri-food monitoring, in the state that hosts Brazil’s largest agricultural research base; a national capability in microwave–optical interfaces for the coming quantum-network infrastructure; and, through the fellowships and the open facilities of Section 6, a generation of engineers and physicists trained across the full chain. The Innovation and Knowledge Diffusion plans (Section 7) provide detailed schedules for these actions. Abbreviations."},{"t":"fig","x":["BHD","balanced homodyne detection","PPLN","periodically poled lithium niobate","CAR","coincidence-to-accidental ratio","QD","semiconductor quantum dot","CV","continuous-variable (quantum optics)","QKD, QRNG","quantum key distribution, quantum random-number generator","DCS","dual-comb spectroscopy","SAW","surface acoustic wave","(D)OPO","(degenerate) optical parametric oscillator","SFWM, SPDC spontaneous four-wave mixing, parametric down-conversion","EO","electro-optic","SHG","second-harmonic generation"]},{"t":"p","x":"H-A..C, S1, S2 discovery hypotheses, discovery-track results SiN, TFLN silicon nitride, thin-film lithium niobate IAC International Advisory Committee SNSPD superconducting-nanowire single-photon detector L1–L4 lighthouse experiments (Section 4)"},{"t":"fig","x":["SOTA","state of the art","MBE","molecular-beam epitaxy","TMD, WP","transition-metal dichalcogenide, work package"]},{"t":"h1","x":"2. International state of the art and positioning","id":"s2"},{"t":"h2","x":"2.1 Where the frontier is, lighthouse by lighthouse","id":"s3"},{"t":"p","x":"Integrated quantum photonics has moved, in the last five years, from component demonstrations to system questions: not whether a chip can generate quantum light, but whether that light survives the interfaces of a deployed or heterogeneous system [1]. The four lighthouses are defined against this frontier, and Table 1 lists the best reported value for each metric. Here we summarize what is open."},{"t":"p","x":"Sources (L1). Pair generation on chip is a solved component problem: SiN microrings reach 3×107 pairs/s/mW2 with heralded g(2)(0) below 0.004 [2], periodically poled TFLN microrings reach tens of MHz of pairs with microwatts of pump through χ(2) [3, 4], and independent TFLN sources now interfere on the same chip [5]. The open problems are at the system level: fiber-coupled rather than on-chip rates, pump rejection and stabilization on CMOS electronics [6], and operation over deployed fiber, where a silicon chip has distributed entanglement over 155 km of metropolitan fiber [7]. On the deterministic side, QD sources have crossed the efficiency threshold for loss-tolerant linear-optical computing [8] and reached high indistinguishability directly in the telecom C-band [9], but their integration on low-loss waveguides with QKD-grade purity remains limited to a few groups [10], and colloidal and 2D-material emitters, the most integrable, still lack the purity and coherence of epitaxial QDs; 2D materials also give a χ(2) response on SiN for on-chip frequency conversion and pair generation [11]. The open scientific question is which source, multiplexing, coupling, filtering and drift factors jointly set the useful rate and fidelity of entanglement distribution from an integrated source under field conditions; a chip source fabricated and field-tested in Brazil would establish that capability nationally."},{"t":"p","x":"Integrated squeezing (L2). Squeezing from nanophotonic sources has reached 3.7 dB in SiN Kerr resonators [12] and 1.4 dB in PPLN-TFLN waveguides [13], with multimode CV entanglement generated in a microcomb [14]. The bottleneck is readout: the only TFLN demonstration with on-chip pump generation and homodyne beamsplitter measured 0.55 dB [15], and a heterogeneously integrated SiN chip with on-chip balanced homodyne detection reached about 3 dB in a 2026 preprint [16], with Bi-CMOS quantum detectors as an alternative route [17]. What remains open, and defines the L2 goal, is squeezing measured on chip from a χ(2) source with on-chip pump generation, local oscillator and detection on one platform, and its use as a resource for a measurement or a multimode state rather than as a figure of merit."},{"t":"p","x":"Quantum-enhanced spectroscopy (L3). Squeezed dual-comb spectroscopy was demonstrated in 2025 with fiber-based combs and squeezers, giving a two-fold speed-up in concentration retrieval [18], and a twin-comb variant reached 2 dB [19]. Microcomb dual-comb spectroscopy is established in the near and mid-infrared [20, 21]. The two lines have not been joined: there is no chip-based squeezed dual-comb spectrometer, and no quantum-enhanced measurement in which sources, combs and squeezer share a fabrication platform. This is the gap L3 targets, and it is the reason PHOQUS treats sensing as an integration test rather than an application add-on."},{"t":"p","x":"Microwave–optical interfaces (L4). Piezo-optomechanical transducers have reached 0.9–5% efficiency [22, 23], non-classical microwave–optical photon pairs [24], microwave–optical entanglement with electro-optic devices [25], and optical readout and control of superconducting qubits [26, 27]. Quantum-enabled operation (nadd < 1) at few-percent efficiency has now been shown under continuous drive [28]; combining it with MHz bandwidth, high repetition rate and qubit integration, in a device that can be fabricated and operated repeatedly, remains the open target that separates laboratory demonstrations from network nodes. The team holds the capability to run such a program in Brazil for the first time: superconducting-circuit fabrication and the Cryogenics Facility at IFGW, and the new dilution-refrigerator laboratory of Benevides at USP."},{"t":"h2","x":"2.2 Positioning among the quantum centers being created worldwide","id":"s4"},{"t":"p","x":"Dedicated centers for quantum technologies are being created on every continent as national programs (the EU Quantum Flagship, the US National Quantum Initiative, Quantum Delta NL, the UK program and their counterparts in Asia and Oceania) convert into institutes. Those closest to PHOQUS in subject are QuTech (Delft), where quantum-internet nodes and optomechanical transducers are developed and where Gröblacher is a PI; Hy-Q (Copenhagen), built on deterministic QD–photon interfaces and optomechanics; PhoQS (Paderborn), built on TFLN integrated quantum optics; the NSF Center for Quantum Networks (Arizona, with Harvard, MIT and Yale), where Lončar is a PI; and the Flagship projects EPIQUE and QU-PIC, which pursue photonic quantum computing and a universal quantum PIC platform. Photonic quantum computing has meanwhile moved to commercial foundries at PsiQuantum and Xanadu [29, 30], and TFLN and transducer technology is sold by spin-offs of the associate groups (HyperLight, QPhox). In budget, PHOQUS is comparable to a single consortium project of the Quantum Flagship and an order of magnitude below QuTech or the industrial players, so competing on photonic quantum computing would not be credible."},{"t":"p","x":"PHOQUS competes instead by focus. Each of the centers above is organized around one platform or one application; PHOQUS is organized around the interface problem, and this choice defines its niche: (i) three platforms (SiN, TFLN, III–V) and 2D materials under a single fabrication and packaging pathway, including in-house MBE growth of droplet-etched QDs, a combination that only a handful of European groups have alongside integrated photonics and that is key to L1; (ii) a CV quantum-optics group with twenty years of tomography and squeezing expertise (USP) tied to an academic nanofabrication facility (CCSNano), which is what the L2 goal requires and which, among the reference programs above, none combines in one program; (iii) an application-driven lighthouse (L3) in quantum-enhanced spectroscopy, which none of those programs pursues; and (iv) mK optomechanics and superconducting-circuit fabrication on the same campus as the nanofabrication facility, which is what L4 needs. The lighthouses are chosen so that each is new at the system level even where its components are not, and the associates of Section 2.3 place PHOQUS alongside two of the ecosystems above (Delft and the NSF network) rather than in competition with them."},{"t":"h2","x":"2.3 Team track record and international cooperation strategy","id":"s5"},{"t":"p","x":"The team enters the program with results at or near the state of the art in each lighthouse area. Led from São Paulo: cross-polarized Brillouin scattering in TFLN [31], dissipative and GHz optomechanics [32], tunable and hybridized-band parametric oscillation in photonic molecules [33, 34], CV entanglement in atomic-vapour OPOs [35] and tomography of an integrated χ(3) OPO [36], magnetometry [37], mid-infrared comb spectroscopy [38, 39], χ(2) conversion in 2D materials on SiN [11], linewidth and emission engineering of colloidal nanocrystals [40, 41] and droplet-etched GaAs nanostructures [42, 43]. In collaboration with the associates, with the measurements led abroad and Brazil-based co-authors: ultraviolet generation in poled TFLN with Harvard [44], optomechanical teleportation and low-noise phonon–photon conversion with Delft [45, 46], color symmetry breaking with MPL [47]; and, from the Linz period of Covre da Silva, droplet-etched QDs in entanglement-based QKD and teleportation [48–50]. The distinction matters for what the center promises: its Brazil-led output is today about one Physical Review Letters or Nature Communications level paper per year from two groups, and success will be measured by the growth of results led from São Paulo institutions, by joint results across groups and by the reproducibility of its platforms, not by publication volume or by the associates’ output (indicators in Section 10). The groups are in dialogue but not yet in full collaboration: the USP quantum-optics group already works with integrated oscillators and combs, so the merge with the Unicamp integrated-photonics and comb groups is natural, and the Year-1 convergence milestones of Section 8 turn it into joint science from the first year."},{"t":"p","x":"International cooperation is organized around five associates who each supply a capability that São Paulo does not yet have and that a lighthouse needs: Lončar (Harvard; TFLN design and poling, HyperLight), Del’Haye (MPL Erlangen; ultralow-loss sputtered SiN), Schmidt (Leibniz IPHT Jena; 3D nanoprinted fiber–chip interfaces), Soavi (FSU Jena; ultrafast nonlinear optics of 2D materials) and Gröblacher (TU Delft; quantum optomechanics and transducers, QPhox). These are working collaborations with joint publications [44, 46, 47, 51, 52] and students in residence12. The strategy for the CEPID period has three instruments: (i) a standing BEPE and postdoc exchange, within the current BEPE rules, with each lighthouse assigning at least one student per year to an associate laboratory and hosting return visits for joint measurement campaigns in Campinas and São Paulo; each exchange names the knowledge or process to be transferred, the validation experiment to be performed in São Paulo on return and the research question then pursued jointly, so that the associates’ processes become local capability and part of the science is led from the home institutions, with authorship following contributions; (ii) reciprocal process access, in which PHOQUS obtains TFLN poling, sputtered SiN and nanoprinted couplers from the associates during Years 1–3 and transfers those modules to CCSNano by Year 5, so that the dependence is transitional rather than structural; and (iii) an International Advisory Committee, drawn from outside the associate groups, that reviews lighthouse progress annually and advises the Year-5 re-planning (Section 10). Participation in the Quantum Flagship and NSF ecosystems is pursued through the associates, with the aim of positioning São Paulo as the South American node of at least one international quantum-network testbed by Phase 2."},{"t":"h2","x":"2.4 Relation to existing centers and FAPESP grants","id":"s6"},{"t":"p","x":"PHOQUS is not the continuation of any existing center: the former FAPESP research center in optics and photonics (CePOF, São Carlos) ended in 2024 and had no quantum-photonics or integrated-platform program, and none of the research, applied-research or national-institute centers currently funded in Brazil (the FAPESP CEPID, CPA and NPOP programs and the CNPq/FAPESP INCT national institutes) covers integrated quantum photonics. The two national institutes in the area are complementary: INCT-DQ (quantum devices, CNPEM, where Frateschi is Innovation Coordinator [53]) and INCT-IQ (quantum information) fund networks of groups around physics questions, while PHOQUS funds a fabrication-to-field program in one state with one process pathway, and will use both as its national network for dissemination and for user access to its modules. The FAPESP QuTIa initiative in quantum technologies is the closest instrument: four of its Young Investigator grants are held by Associate Researchers of the center and fund individual lines (structured light, modular transduction, an atomic magnetometer with squeezed light, telecom QD sources) that PHOQUS integrates into its platform and lighthouses rather than duplicates, and its QuaDRA training network is the pool from which the MS and DR fellowships of Section 5.5 will recruit. The active grants of the team (a Thematic project in quantum optics, Regular grants in microresonators and 2D materials, Young Investigator and multi-user equipment grants) fund component-level science; none funds the integration program of the center, and the grant-by-grant delimitation is given in the document Details of other current and expected support."},{"t":"h1","x":"3. Scientific architecture: platforms, branches and the integration loop","id":"s7"},{"t":"p","x":"PHOQUS is built on three photonic platforms that are physically complementary. Silicon nitride (SiN) provides the low-loss backbone for passive routing and Kerr (χ(3)) nonlinear processes; thin-film lithium niobate (TFLN) adds the χ(2) nonlinearity, GHz electro-optic control and piezoelectric coupling that SiN lacks; and III–V semiconductors contribute optical gain and deterministic quantum emitters; 2D materials add χ(2) and saturableabsorber functions to SiN, and piezoelectric and superconducting circuits extend the chips to microwave frequencies for sensing and transduction (Branch C). The international community has converged on this combination for heterogeneous quantum photonic integration [54–56]."},{"t":"p","x":"The architecture has two outputs that reinforce each other. The first is knowledge: the physics of engineered nonlinear quantum dynamics, multimode correlations and coherent photonic–phononic interfaces (hypotheses H-A to H-C of Section 1). The second is capability: reproducible devices, packaging and measurement chains in which that physics is tested under increasingly realistic conditions. Shared process modules and a common loss and noise budget connect the two; the lighthouses are integration checkpoints and scientific testbeds, not the only source of the program’s discoveries."},{"t":"p","x":"1 The 2D-materials line is also supported by the FAPESP–DFG project 2025/17579-9 (de Matos, Cadore, Soavi). 2 Two Unicamp students hold FAPESP BEPE fellowships in the Del’Haye group (25/20846-9, 25/04049-1); three worked with Gröblacher (24/16573-4, 19/01402-1) and one with Lončar (22/11486-0); N. Tomázio (USP) holds a Marie Skłodowska-Curie fellowship in the Schmidt group. Branch A, NIP (Nonlinear Integrated Photonics & Materials), builds the photonic building blocks: Kerr and electro-optic combs and degenerate parametric oscillators in coupled microresonators (NIP-1), Brillouin and optomechanical interactions in TFLN (NIP-2), 2D materials as χ(2) media and hybrid nonlinear devices (NIP-3), and quantum emitters spanning epitaxial, colloidal and 2D quantum dots along an integrability–coherence axis (NIP-4). Branch B, QPC (Quantum Photonic Communication), turns these blocks into communication primitives: chip QKD transmitters and QRNG (QPC-1), CV quantum photonics on SiN and PPLN-TFLN (QPC-2), and low-loss fiber–chip quantum interfaces (QPC-3). Branch C, QEPS (Quantum-Enhanced Photonic Sensing), stress-tests the platform under realistic sensing conditions: squeezed dual-comb spectroscopy (QEPS-1), piezo-optomechanical microwave–optical transduction (QEPS-2) and chip-integrated magnetometry with color centers and atomic vapours (QEPS-3); transduction sits in Branch C because a transducer is first a quantum-limited sensor of microwave fields that shares the cryogenic and acoustic platform of QEPS-3 and XC-1, while its network role is the L4 lighthouse and the H1 horizon of Branch B. A cross-cutting platform (XC-1) supplies acoustic control and cryogenic operation to all three branches."},{"t":"p","x":"All three branches are organized around one bottleneck: quantum states are fragile, and every interface (fiber to chip, device to device, photonic to microwave) degrades them. The branches therefore form a closed loop rather than a portfolio. Branch A supplies sources and nonlinear and electro-optic building blocks; Branch B defines the system constraints (loss budgets, stability, interface tolerances) that feed back into device design; Branch C applies the integrated platform to tasks in which a quantum advantage exists only if coherence is preserved end to end; the lighthouse experiments of Section 4 are the checkpoints at which the loop is closed. The loop is held together by a shared loss and noise budget, tracked as a center-level metric. For quantum light, every element is an efficiency η that moves a squeezed variance toward vacuum as ηV + (1 −η) and a pair rate toward zero as η2. The allocations per element (facet, routing, detection, sensing path, microwave chain) are given with the feasibility budgets of Section 4 and are what turn the lighthouse targets into work-package metrics: a branch that overspends its allocation is visible in the annual review before the lighthouse experiment fails."},{"t":"h1","x":"4. Lighthouse roadmap and staged targets","id":"s8"},{"t":"p","x":"PHOQUS commits to four complementary lighthouse experiments (L1–L4). We use lighthouse for a flagship experiment that is visible beyond the field and that serves as a center-level integration checkpoint. Each tests quantum functionality across a distinct class of interface: deployed optical fiber (L1), integrated state generation and measurement (L2), a multi-component quantum-enhanced measurement (L3) and the boundary with microwave quantum hardware (L4), ordered by the number of interfaces a quantum state must cross. The lighthouses share fabrication processes, characterization protocols, packaging and the loss and noise budget of Section 3, but they advance on partially independent experimental paths: the only hard prerequisite between them is that L3 needs a chip squeezer, which the L2 Year-3 threshold supplies with off-chip characterization, well before the L2 on-chip readout goal; L1 and L4 are independent of the others and share with them only the fiber–chip interfaces of QPC-3 and the cryogenic platform of XC-1. This modular architecture (Fig. 1) limits critical-path risk and lets discoveries and proof-of-principle quantum advantages be demonstrated before the fully integrated systems exist; the strongest cross-lighthouse dependencies are placed in the Phase-2 horizons. Fig. 2 shows the hardware chain of each lighthouse with the work package that delivers each block: every work package in Section 5 names the lighthouse it enables and the figure of merit it moves."},{"t":"p","x":"Staged targets."},{"t":"p","x":"Each lighthouse carries two values (Table 1), and the thresholds are placed so that they are assessed at the FAPESP comprehensive evaluations of Years 3 and 5 (Section 10, Table 5). The threshold is a commitment: it is what the center will report as achieved in the corresponding annual report, and it is set so that a missed threshold signals a genuine scientific or technical obstacle rather than ordinary schedule slip. The goal is the internationally leading value we aim for, benchmarked against the best published results. Relative to the pre-proposal, the targets were recalibrated against results published up to 2026 (fiber-coupled L1 rate, staged L2 threshold and goal, L3 as a quantum speed-up and a path-normalized sensitivity, L4 efficiencies raised by one to two orders of magnitude)."},{"t":"fig","x":["A · NIP","B · QPC","C · QEPS","Lighthouses","XC","S","Y1","Y2","Y3","Y4","Y5","Y6","Y7","Y8","Y9","Y10","Y11","Phase 1 (Years 1–5): lighthouse integration checkpoints","Phase 2 (Years 6–11): systems","NIP-1 Kerr & EO combs, DOPO in coupled microresonators","→L1, L3","NIP-2 Brillouin & optomechanics in TFLN","→L4","NIP-3 2D materials: χ(2) media and hybrid nonlinear devices","→L1, L2","NIP-4 quantum emitters: integrability ↔coherence","→L1 (alt.)","QPC-1a QRNG chip","QPC-1b chip QKD transmitters","→L1","QPC-2 CV squeezing: SiN (χ(3)) and PPLN-TFLN (χ(2))","→L2, L3","QPC-3 low-loss fiber–chip quantum interfaces","→L1–L4","QEPS-1 squeezed dual-comb spectroscopy","→L3","QEPS-2 piezo-optomechanical MW↔optical transduction","→L4","QEPS-3 chip magnetometry","→H2","XC-1 acoustic (SAW) and cryogenic platform","→L1, L4","shared quantum-interface platform","Unicamp–USP joint paper S1","S2 combs × integrated chips","discovery track continues","qualified heterogeneous","process modules (SiN/TFLN/III–V)","multi-node QKD and","CV entanglement networks","transduction for networked qubits;","deployable quantum sensors","L1 field entanglement source","L3 squeezed dual-comb spectrometer","L2 squeezing, on-chip readout","L4 MW↔optical quantum transducer","H1 metropolitan","quantum-network node","H2 field quantum","sensors","H3 CV processing","primitives","threshold (committed)","goal (internationally leading)","discovery result (S1, S2)","technical prerequisite","feeds Phase 2 horizon"]},{"t":"cap","x":"Figure 1: Lighthouse roadmap. Work packages (bars) in the three branches and the cross-cutting acoustic and cryogenic platform (XC) feed four lighthouse experiments on partially independent paths, each with a committed threshold target (diamond) and a stretch goal (star). The solid arrow is the only hard prerequisite (the L2 chip squeezer feeds L3); dashed arrows show how the lighthouse goals seed the indicative Phase 2 horizons H1–H3 (Section 10). Circles mark the early physics results of the discovery track (Section 8); the QRNG chip (end of Year 2) is the first near-term deliverable."},{"t":"h3","x":"L1: Chip entangled-pair source on deployed fiber (Years 3–4)","id":"s9"},{"t":"p","x":"Question. Can a photon-pair source fabricated in São Paulo deliver QKD-grade entanglement through a deployed metropolitan link, with performance limited by the channel rather than by the chip? Brightness records for microring sources already exceed our threshold [2, 58]; the scientific content of L1 is to establish how source statistics, frequency multiplexing, coupling loss, spectral filtering and field drift jointly determine the useful rate and fidelity of entanglement distribution from an integrated source, measured as a decomposed loss and error budget against a finite-key security analysis; the goal favors reconfigurable multi-user distribution and heterogeneous source compatibility over distance alone. Rate, CAR, g(2)(0) and visibility are specified at one pump operating point, with the pair rate counted in the two output fibers before the receivers. Primary approach. Spontaneous four-wave mixing in high-Q SiN microrings (NIP-1) packaged with QPC-3 couplers, driving the QPC-1 receiver chain. Parallel approaches. (i) SPDC in PPLN-TFLN, shared with L2; (ii) deterministic epitaxial QD sources (NIP-4), which trade rate for on-demand emission; (iii) colloidal and 2D-material emitters on SiN resonators (NIP-4) and SPDC in 2D materials on SiN (NIP-3), retained as exploratory lines given that reported purities and pair rates remain below QKD requirements [11, 59]. Scientific result. Beyond the field demonstration, L1 yields the first measured trade-off between source statistics, multiplexing and field drift for an integrated source, and the first entanglement between photons from heterogeneous sources (SFWM and QD) on one platform. Decision point. At month 24 the source with the best measured fiber-coupled rate at CAR ≥100 is selected for the field test. The intended link is the open quantum-communication testbed operated by CPqD in Campinas (about 200 km of deployed fiber, open to universities and companies), with spooled fiber as the development fallback."},{"t":"h3","x":"L2: Integrated squeezing with on-chip readout (Years 3–5)","id":"s10"},{"t":"p","x":"Question. Does squeezing survive on-chip pump generation, filtering, local-oscillator interference and detection? Squeezing measured after an integrated circuit, not inferred at its source, is the first direct test of the platform’s quantum transparency. The most complete TFLN demonstration of this architecture reached 0.55 dB [15], while SiN microresonators now exceed 3.5 dB with off-chip detection [12]. Primary approach. Degenerate χ(2) OPO on PPLN-TFLN with on-chip SHG pump and balanced-homodyne beamsplitter (QPC-2). Parallel ap-Lighthouse Threshold (committed)"},{"t":"fig","x":["Goal (internationally leading)","Best reported (state-of-the-art","anchor)","L1","Year 3 / 4","Y3: SiN microring source, ≥1 MHz","fiber-coupled pair rate at CAR ≥100;","heralded g(2)(0) ≤0.05; entanglement","visibility ≥95% after ≥25 km of","deployed fiber; BBM92 key with","finite-key analysis.","Y4: ≥10 MHz fiber-coupled;","multi-user WDM entanglement","distribution (≥4 users) on the","metropolitan testbed; QD track:","waveguide-coupled source with","g(2)(0) ≤0.02 and two-photon","interference visibility ≥0.9.","SiN: 3 × 107 pairs/s/mW2,","heralded g(2)(0) = 0.0037 [2];","155 km deployed link with a Si","chip [7]; QD QKD over 18 km","deployed fiber [57]; waveguide","QD VTPI = 0.94 [10].","L2","Year 3 / 5","Y3: ≥1.5 dB directly measured","quadrature squeezing from a","PPLN-TFLN OPO (off-chip detection),","or ≥1.0 dB with on-chip SHG pump","and on-chip balanced-homodyne","beamsplitter; parallel SiN Kerr track","≥3 dB measured.","Y5: ≥3 dB measured at on-chip","photodiodes from a χ(2) (PPLN-TFLN)","source with pump generation, LO","interference and detection on one chip","(heterogeneous photodiodes allowed),","and the squeezed output port used by","L3; calibrated multi-angle quadrature","acquisition for numerical state","reconstruction of one mode or selected","supermodes.","TFLN, same architecture:","0.55 dB [15]; TFLN waveguide:","1.4 dB [13]; SiN: 3.7 dB off","chip [12], ∼3 dB with on-chip","BHD (preprint) [16]; SiN Kerr","OPO (team): 2.3 dB [36].","L3","Year 4 / 6","Y4: dual-comb spectroscopy with","chip-generated squeezed light (fiber or","EO combs): ≥1 dB reduction of the","detected noise variance below a","calibrated shot-noise reference on","mode-resolved CO2 (1.57 µm) or CH4","(1.65 µm) lines, and ≥1.25×","improvement of the","concentration-estimation rate against an","optimized classical dual-comb","reference at matched resources.","Y6: ≥3 dB with chip-based combs","(Kerr or EO-TFLN) and chip squeezer;","≥2× speed-up; ppm·m","noise-equivalent sensitivity in a","multipass cell; mid-IR extension.","Squeezed DCS in fiber: ∼3 dB,","2× speed-up [18]; twin-comb","DCS: 2 dB, 2.6× [19];","microcomb mid-IR DCS [21]. No","chip-based squeezed DCS","reported to date.","L4","Year 5 / 7","Y5: piezo-optomechanical transducer","at mK in the sideband-resolved regime;","external bidirectional efficiency","η ≥10−3 with input-referred added","noise nadd ≤5, measured in the same","pulsed operating regime.","Y7: η ≥3 × 10−2 with nadd < 0.5 in","pulsed operation at MHz bandwidth,","and a non-classicality witness of the","transferred state (heralded","microwave–optical correlations or","state-transfer fidelity), or heralded","entanglement between a","superconducting qubit and a telecom","photon; value re-benchmarked yearly.","LN-on-Si: η = 5% [22]; 0.9%,","few added photons [23];","electrostatic Si: 2.2% at","nadd = 0.94 and 0.47% at 0.58,","CW [28]; qubit optical","readout [26]."]},{"t":"cap","x":"Table 1: Staged lighthouse targets. Years refer to the CEPID calendar (Year 1 starts June 2027). CAR: coincidence-to-accidental ratio; BBM92: entanglement-based QKD protocol; LO: local oscillator; DCS: dual-comb spectroscopy; nadd: added noise referred to the input."},{"t":"p","x":"proach. Kerr squeezing in SiN microresonators, building on the USP tomography of integrated χ(3) OPOs [36] and on the coupled-resonator dispersion control of NIP-1, which suppresses competing parametric processes. Either track satisfies the Year-3 threshold; the Year-5 goal requires on-chip detection and is pursued on whichever track leads at month 30, chosen on scientific distinctiveness and readiness rather than on the decibel value alone. The chip has two optical paths: a characterization path (on-chip homodyne and, at the goal, on-chip photodiodes; state reconstruction is numerical, from calibrated quadrature data on one mode or on selected supermodes) and an output path that delivers the squeezed light to L3. Scientific result. The distinctive physics of L2 is the coupled-resonator control of quantum-noise redistribution and multimode correlations (H-A), measured on chip, not only the squeezing value. Periodic poling of TFLN is obtained through the Lončar collaboration in Years 1–2 and transferred to CCSNano by Year 3 (Section 2.3); the risk table of Section 9 keeps a partner-foundry route in parallel."},{"t":"h3","x":"L3: Squeezed dual-comb spectrometer (Years 4–6)","id":"s11"},{"t":"p","x":"Question. What is the largest demonstrable quantum enhancement of broadband spectroscopic estimation under a realistic photon budget, bandwidth, technical noise, loss and detector performance? The target application L1 Chip entangled-pair source on deployed fiber PPLN-TFLN SPDC (parallel route)"},{"t":"fig","x":["epitaxial QD source","(deterministic route)","SiN microring pair source","Qi ≥5 × 106, 1 MHz fiber-coupled","fiber-chip coupler","≤1.5 dB / facet","pump rejection + WDM demux","CAR ≥ 100","25 km deployed fiber","local receiver","(analyzer + SNSPDs)","remote receiver","BBM92 key, V ≥95%","QPC-2","NIP-4","NIP-1","QPC-3","QPC-1","QPC-1","QPC-1","L2  Integrated squeezing with on-chip readout","SiN Kerr squeezer","(parallel route)","off-chip tomography","(USP, Year-3 threshold)","on-chip SHG pump","(periodically poled)","χ(2) OPO ring","6 dB generated","balanced homodyne","+ local oscillator","on-chip photodiodes","ηQE ≥0.9","≥3 dB below shot noise","(Year-5 goal)","NIP-1","QPC-2","QPC-2","QPC-2","QPC-2","QPC-2","L3  Squeezed dual-comb spectrometer","squeezer chip (from L2)","≥3 dB after chip","signal comb (SiN microcomb;","EO/fiber comb at Year 4)","local-oscillator comb","squeezed vacuum","injected","multipass gas cell","CO2 / CH4","DFG mid-IR","(goal)","balanced detection,","shot-noise limited","RF analysis: ppm⋅m,","speed-up 1.25x / 2x","QPC-2","NIP-1","NIP-1","QEPS-1","QEPS-1","QEPS-1","QEPS-1","QEPS-1","L4  Microwave-optical quantum transducer","pump / probe laser","optical readout","η ≥10−3, nadd ≤5","cryogenic fiber attach","≤1 dB","LN-on-Si optomechanical crystal","Com ≈2, IDT Cem ≈0.5","superconducting circuit","(Unicamp fabrication)","dilution refrigerator","10-20 mK, pulsed","diamond OMC (parallel)","microwave control","and readout","QPC-2","QPC-3","QEPS-2","QEPS-2","XC-1","QEPS-3","QEPS-2"]},{"t":"cap","x":"Figure 2: The four lighthouse experiments as hardware chains. Each block is tagged with the work package that delivers it (colors of Fig. 1); lighter blocks are the parallel routes kept until the decision points D1 and D2 (the NIP-3 2D-material SPDC source, an exploratory alternative to the NIP-4 block of L1, is not drawn). Key metrics from Table 1 are repeated next to the block that sets them. L3 uses the chip squeezer of L2/QPC-2 and, initially, fiber or EO combs, with chip combs supplied by NIP-1 for the Year-6 goal; neither L3 nor L4 depends on completion of the L1 field experiment. L4 reuses the cryogenic fiber attach of QPC-3 and the cryogenics of XC-1."},{"t":"p","x":"is greenhouse-gas sensing for agri-environmental and industrial monitoring: the concentrations of CO2, CH4 and N2O in air, the gases that dominate Brazil’s emissions inventory, retrieved from broadband near- and mid-infrared absorption spectra. Squeezed dual-comb spectroscopy has been demonstrated with fiber sources, giving a two-fold speed-up in concentration retrieval [18]; to our knowledge no chip-based implementation has been reported. L3 injects the chip-generated squeezed light of L2 into a dual-comb architecture (QEPS-1) and is the center’s defining test of hypothesis H-B, because it couples the loss budget of QPC-3, the noise of the comb sources of NIP-1 and the squeezing of QPC-2 in a single task-level figure of merit. Approach. Scientific result. A proof-of-principle injection of chip-generated squeezed light into the fiber-comb spectrometer is scheduled for Years 2–3 (S2), carried out by the QEPS-1 postdoc co-supervised from Year 1 by the comb and CV groups (Unicamp–USP); the Year-4 threshold uses the chip squeezer with fiber or EO combs and is a standalone scientific result, the first chip-based squeezed DCS and the first estimator-level test of a multimode quantum advantage in spectroscopy, not an intermediate step; it does not wait for the L2 on-chip readout nor for the L1 field test. The classical reference is an optimized unsqueezed dual-comb measurement with the same bandwidth, resolution, probe photons, sample and time, and three quantities are reported separately: the detected noise reduction, the spectroscopic SNR and the improvement in retrieved concentration precision. The Year-6 goal moves both combs and squeezer on chip and extends coverage to the mid-infrared using difference-frequency generation, building on established mid-IR comb spectroscopy in the team [39]. Sensitivity is reported as the noise-equivalent concentration–length product (ppm·m, at 1 s averaging, for the stated transition and gas conditions) and as quantum speed-up."},{"t":"h3","x":"L4: MW↔optical quantum transducer (Years 5–7)","id":"s12"},{"t":"p","x":"Question. Can the PHOQUS photonic platform connect coherently to microwave quantum hardware? This reframes transduction as a quantum-network connectivity problem: a transducer is the interface that lets superconducting processors share entanglement over optical fiber. Integrated piezo-optomechanical devices have reached efficiencies of 1–5% [22, 23] and optical readout of a superconducting qubit [26]. Efficiency and added noise are necessary metrics but do not by themselves prove a quantum interface, so L4 progresses through four stages: classical conversion, calibrated low-noise conversion, evidence of non-classicality or coherence of the transferred state (heralded microwave–optical correlations or a state-transfer fidelity), and the connection to superconducting hardware. The Year-5 threshold establishes the second stage in Brazil; the goal is the third and fourth stages, and its numerical value is re-benchmarked yearly with the IAC against the moving state of the art. External bidirectional efficiency and input-referred added noise are reported at defined chip/fiber and microwave reference planes for the same calibrated temporal and spectral mode; the third stage requires a pre-selected non-classicality witness or state-transfer fidelity above the corresponding classical bound, with uncertainty, duty cycle, bandwidth and, if heralded, success probability stated, and the qubit-readout alternative carries its own criterion (readout contrast and back-action); the witness is fixed by QEPS-2 before the Year-3 evaluation. Primary approach. Lithium-niobate-on-silicon piezo-optomechanical crystals (QEPS-2), building on joint work with TU Delft [46] and on the Brillouin and optomechanics expertise of NIP-2 [31]. Parallel approach. Diamond optomechanical resonators [60–62], which add color-center spin interfaces relevant to QEPS-3. Operation relies on the mK platforms of the center (the dilution-refrigerator laboratory of Benevides at USP and the IFGW Cryogenics Facility) and on the superconducting-circuit fabrication available at IFGW and USP. Scientific result. The third stage, a certified non-classicality witness for a microwave–optical interface built in Brazil, is the scientific output of L4 independently of the efficiency reached. The diamond and acoustic (XC-1) routes are kept as scientific alternatives with their own observables (color-center spin interfaces, SAW-mediated coupling), not only as fabrication fallbacks."},{"t":"h3","x":"Feasibility of the staged targets","id":"s13"},{"t":"p","x":"The numbers in Table 1 are derived from loss and noise budgets rather than chosen as round figures; the chains below are the ones an evaluator can check, and each work package tracks its own link in the chain as a metric."},{"t":"p","x":"L1: rate, CAR and visibility. A microring source generates pairs at a rate Rchip = BP 2. We assume a brightness B = 107 pairs s−1 mW−2, three times below the best reported value for SiN [2], which our target Qi ≥5 × 106 supports since B scales as Q3. With 1.5 dB per facet (QPC-3) and 1.5 dB of demultiplexing and pump filtering per arm, each photon loses 3 dB and the fiber-coupled rate is Rchip/4; the 1 MHz threshold therefore needs Rchip = 4 MHz, i.e. P ≈0.6 mW on chip. At this rate the accidental-limited CAR is 1/(Rchipτc) ≈500 for a 0.5 ns coincidence window set by SNSPD jitter, so CAR ≥100 requires only that noise counts in each arm (pump leakage, Raman scattering in the fiber pigtails) stay below the detected singles rate, i.e. more than 100 dB of pump rejection for 0.6 mW of pump, which cascaded telecom filters provide. The visibility of an entangled source is bounded by accidentals as V ≤(CAR−1)/(CAR+1), so CAR = 100 leaves a 3% margin between the 98% accidental bound and the 95% threshold for polarization drift and distinguishability over 25 km of deployed fiber. With one photon detected locally and the other after 25 km (5 dB) at 80% detector efficiency, the coincidence rate is about 2 × 105 s−1; at QBER = (1 −V)/2 = 2.5% the asymptotic BBM92 key fraction is 1 −2h(0.025) ≈0.66, a secure key above 10 kbit/s with margin for finite-key corrections at 109 sifted bits. The CAR of 5–10 of low-Q (∼105) SiN rings [63] shows the Q dependence that makes the NIP-1 process baseline (M1.1) the critical link."},{"t":"p","x":"L2: squeezing budget. A squeezed quadrature of variance Vgen (relative to vacuum) measured through total efficiency η gives Vmeas = ηVgen + (1 −η). The Year-3 TFLN threshold is the net squeezing measured directly on the off-chip characterization path, after all corrections. It assumes 6 dB generated (Vgen = 0.25), which an overcoupled χ(2) OPO reaches at half its threshold power, escape efficiency 0.9, homodyne visibility 0.98 (entering squared, 0.96), photodiode efficiency 0.9 and a 0.1 dB penalty for electronic-noise clearance and detector imbalance. With the QPC-3 facet-coupling metric of 1.5 dB (0.71), η = 0.9 × 0.71 × 0.96 × 0.9 = 0.55 and Vmeas = 0.59, i.e. 2.3 dB gross and 2.2 dB net, a 0.7 dB margin over the threshold; the threshold is still met with facet loss up to 2.8 dB (1.5 dB net), whereas an unoptimised 3 dB facet gives 1.4 dB net, which is why facet coupling is the Year-2 metric of QPC-3 and why the TFLN track is assessed from calibrated loss and shot-noise measurements before the Year-3 evaluation. The SiN Kerr track needs 8 dB generated and η ≥0.6 to reach 3 dB, consistent with the 3.7 dB measured off chip in a foundry-fabricated SiN ring [12]. The Year-5 goal removes the facet loss but adds on-chip routing (0.95) and an integrated balanced detector (0.9 quantum efficiency, 0.9 from beamsplitter balance), so η ≈0.9 × 0.95 × 0.9 × 0.9 = 0.69 and 6 dB generated gives 3.2 dB measured (3.1 dB net); the per-element efficiencies are the metrics of QPC-2 and QPC-3."},{"t":"p","x":"L3: sub-shot-noise dual-comb signal-to-noise ratio. If the dual-comb detection is shot-noise limited, injecting squeezed light reduces the noise floor by the squeezing that survives the spectrometer path, and the time to reach a given concentration uncertainty shrinks by the same factor: 10S/10, i.e. 1.26× for S = 1 dB and 2× for 3 dB, which are the threshold and goal speed-ups [18]. The squeezing available at the output port of the L2 chip is larger than the value measured on its characterization path: with 6 dB generated and escape and routing efficiency 0.85, the output-port variance is 0.85 × 0.25 + 0.15 = 0.36, i.e. 4.4 dB delivered. Through a spectrometer path efficiency of 0.7 (gas cell, comb combination, detection) this gives Vmeas = 0.7 × 0.36 + 0.3 = 0.55, i.e. 2.6 dB, which meets the 1 dB threshold with margin even if only 3 dB is delivered (1.9 dB); the 3 dB goal requires ≥4 dB delivered and a path efficiency of 0.85 (0.85 × 0.4 + 0.15 = 0.49, 3.1 dB), which is why the goal is tied to the Year-5 chip of L2. The speed-up is the reduction in acquisition time for equal estimator uncertainty and assumes a shot-noise-limited classical reference with the same sample, spectral coverage, resolution, incident probe-photon budget (the resource convention adopted) and estimator. The squeezing is multimode, so the experiment characterizes the frequency-dependent covariance of the squeezed field and its projection onto the detected dual-comb radio-frequency channels (mode overlap, phase and frequency stabilization, technical noise) and reports separately the noise reduction per measured mode, the spectroscopic signal-to-noise ratio and the uncertainty of a pre-specified concentration estimator; a task-level advantage is claimed only when that estimator improves on the optimized unsqueezed reference with calibrated uncertainty and a decomposed loss budget. The condition that the comb relative intensity noise lies below shot noise in the detection band is why the Year-4 threshold uses low-noise fiber or electro-optic combs and the chip combs of NIP-1 are reserved for the goal."},{"t":"p","x":"L4: transduction efficiency and added noise. For a piezo-optomechanical transducer the internal efficiency is ηint = 4ComCem/(1+Com+Cem)2, where Com and Cem are the optomechanical and electromechanical cooperativities (coupling rate squared over the product of the optical or microwave and mechanical linewidths). With g0/2π ≈0.7 MHz, κ/2π ≈ 1 GHz, 103 intracavity photons in pulsed operation and a mechanical linewidth of 2π×1 MHz at 5 GHz, the optomechanical cooperativity is Com ≈2; with Cem ≈0.5 from the piezoelectric coupling of LN on Si, ηint ≈0.3. Optical extraction (0.5), fiber coupling (0.5) and microwave extraction (0.5) bring the external efficiency to about 4 × 10−2, more than an order of magnitude above the 10−3 threshold; this is the margin we assign to the fabrication yield and the lower Qm of a first device generation; the goal requires the values above with a coupling loss at or below 1 dB (QPC-3). The added noise is set by the effective thermal occupation of the mechanical mode during the optical pulse (not by the refrigerator base temperature: optical absorption heating, pulse duration and thermal relaxation set it), nadd ≈nth/Com, so nadd ≤5 tolerates nth ≈10; occupation and input-referred noise are measured directly, by sideband thermometry and a calibrated microwave noise chain, in the same temporal mode and operating regime as the efficiency, and nadd < 0.5 requires the lower duty cycle and higher Com of the goal [23, 28]."},{"t":"h1","x":"5. Research program: work packages","id":"s14"},{"t":"p","x":"Every work package pursues one independently testable physics question (tied to the hypotheses H-A to H-C of Section 1) while developing the capability that one or more lighthouses need, and is assessed on both: the scientific evidence it produces and the reproducible device or system metric it moves. Every work package also starts from lines of research that the team has published in the last five years, so that Year 1 produces results from ongoing work while students and postdocs are recruited, and the transition to lighthouse-specific objectives is gradual (Section 8); the integration schedule therefore does not postpone the scientific output of the groups. The starting points cited below are the team’s own results. Where the team has no track record yet (for example, chip-based QRNG), this is stated explicitly and the work package is built on an adjacent capability inside the center."},{"t":"h2","x":"5.1 Branch A: Nonlinear Integrated Photonics & Materials (NIP)","id":"s15"},{"t":"wp","x":"NIP-1 Kerr and electro-optic combs, DOPO in coupled microresonators (Wiederhecker, Alegre, Cruz; Del’Haye (MPL))","wp":"NIP-1","id":"s16"},{"t":"p","x":"Coupled SiN microresonators (photonic molecules) give independent control of dispersion and mode hybridization, which we use to select degenerate parametric oscillation and suppress competing processes [64, 65]. NIP-1 delivers (i) high-Q SiN rings for SFWM pair generation (L1), (ii) dispersion-engineered resonators for Kerr squeezing (L2, SiN track), and (iii) Kerr and EO combs for dual-comb spectroscopy (L3), including spectral extension to the blue and UV [51]."},{"t":"p","x":"Physics question. To what extent do engineered coupling and hybridization in photonic molecules give independent control of parametric pathways and multimode quantum correlations beyond a matched single-resonator baseline (H-A)? Observable: squeezing spectra, quadrature covariances and mode correlations versus coupling and detuning, against quantitative coupled-mode predictions and control devices. Starting point. Tunable DOPO, mapping of nonlinear mode interactions and hybridized-band oscillation in coupled SiN resonators [33, 34, 66]; color symmetry breaking with MPL [47]; dispersion engineering of high-Q resonators [67]; visible-to-telecom parametric oscillation in CMOS-compatible OPOs [68, 69] and tunable squeezing in coupled SiN rings [70]; 20 GHz resonant EO comb across the S/C/L bands and mid-IR χ(2) combs [38, 71]."},{"t":"p","x":"Enables / metric: L1, L2, L3; intrinsic Q, pair brightness, comb noise."},{"t":"p","x":"Y1–3: SiN process with Qi ≥5 × 106 ; DOPO-based squeezing design; first SiN dual-comb pair."},{"t":"wp","x":"NIP-2 Brillouin scattering and optomechanics in TFLN (Wiederhecker, Alegre; Lončar (Harvard))","wp":"NIP-2","id":"s17"},{"t":"p","x":"NIP-2 develops phonon-mediated devices on TFLN: narrow-linewidth Brillouin sources and GHz acoustic resonators whose design rules (piezoelectric coupling, phonon confinement, mechanical Q at low temperature) are transferred to the transducers of QEPS-2."},{"t":"p","x":"Physics question. Which phonon-mediated mechanisms (Brillouin gain and noise, piezoelectric coupling, phonon dissipation at low temperature) set the coherence limits of acousto-optic interactions in TFLN (H-C)? Observable: Brillouin gain and noise spectra and optomechanical rates versus temperature. Starting point. Cross-polarized SBS in LiNbO3 waveguides [31] and SBS mediated by surface acoustic waves in LN [72]; milliwatt UV generation in sidewall-poled LN with Harvard, which also gives access to TFLN poling [44]; intermodal Brillouin scattering in fibers [73]; Brillouin optomechanics in the quantum ground state (Benevides) [74]."},{"t":"p","x":"Enables / metric: L4; optomechanical coupling g0, mechanical Q, piezo coupling."},{"t":"p","x":"Y1–3: Brillouin laser on TFLN; GHz phononic resonator characterized at 4 K."},{"t":"wp","x":"NIP-3 2D materials: χ(2) media and hybrid nonlinear devices (de Matos, Cadore, Rosa, Barea; Soavi (Jena))","wp":"NIP-3","id":"s18"},{"t":"p","x":"Transition-metal dichalcogenides integrated on SiN provide a χ(2) response on a centrosymmetric platform [11]. NIP-3 pursues waveguide-coupled SHG and SPDC with modal phase matching and quasi-phase-matching by patterned 2D layers, and 2D saturable absorbers and non-reciprocal elements for on-chip pump control. Physics question. How do interface, crystal symmetry and optical confinement determine integrated χ(2) conversion in 2D materials on waveguides? Observable: calibrated conversion efficiency and phase matching versus layer geometry and orientation. Starting point. On-chip SHG in SiN waveguides integrated with MoS2 monolayers [11]; SHG enhancement in TMD monolayers on epsilon-near-zero substrates and nonlinear dynamics of layered TMDs [75, 76]; low-loss integrated circuits with layered semiconductors [52]; nonlinear frequency conversion in franckeite heterostructures [77]; hybrid 2D saturable absorbers in photonic integrated circuits [78, 79]; an all-photonic isolator from atomically thin Bi2Te3 [80]. Enables / metric: L1 (alt., SPDC), L2 (pump control); SHG efficiency per unit length, SPDC photon-pair rate. Y1–3: Waveguide SHG with patterned TMD on SiN; first 2D-assisted pump filter."},{"t":"wp","x":"NIP-4 Quantum emitters: from integrability to coherence (Deneke, Covre da Silva, Padilha, Couto, Louis, Gobato)","wp":"NIP-4","id":"s19"},{"t":"p","x":"NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols. Physics question. What sets the trade-off between integrability and coherence across epitaxial, colloidal and 2D emitters coupled to the same resonator, and which material strategy (exciton band alignment, strain, shell engineering) gives high-purity, indistinguishable emission from colloidal nanomaterials? Observable: purity, linewidth, indistinguishability and extraction versus coupling and temperature, on one protocol. Starting point. Epitaxial QDs: entanglement-based QKD with QD sources [48, 81], urban-network and teleportation experiments [49, 82], waveguide-integrated and cavity-enhanced sources [10, 83], and droplet-etched InGaAs QDs with Unicamp participation [50, 84]. Colloidal emitters: bright/dark exciton inversion in strain-graded QDs and lattice-distortion engineering of emission [40], optical gain by biexciton engineering and linewidth control in nanocrystals [41, 85, 86]; droplet-etched GaAs nanostructures grown at LNNano [42, 43]. 2D emitters: strain-engineered confinement and single-photon emitters in WSe2 [87–89]."},{"t":"p","x":"Enables / metric: L1 (alt.); g(2)(0), indistinguishability, extraction efficiency, linewidth / radiative limit. Y1–3: Reproducible MBE growth of droplet-etched QDs at Unicamp (in-situ thickness control); waveguide-coupled QD with g(2)(0) < 0.05; colloidal QDs on SiN rings."},{"t":"h2","x":"5.2 Branch B: Quantum Photonic Communication (QPC)","id":"s20"},{"t":"wp","x":"QPC-1 Chip QKD transmitters and QRNG (Frateschi, Barea, Marques, Covre da Silva)","wp":"QPC-1","id":"s21"},{"t":"p","x":"QPC-1 develops the QRNG chip (Year-2 deliverable) and then the chip QKD transmitter and receiver chain, including time-bin analyzers, for the L1 field test [90, 91]. Published chip QRNGs already reach 18.8–100 Gbit/s [92, 93], so QPC-1 does not compete on bit rate: its target is a certifiable entropy source fabricated and packaged in Brazil and validated on a national testbed. The QRNG is based on integrated balanced-homodyne detection of vacuum fluctuations [94], the same receiver used for key reception, with the binary phase states of the NIP-1 degenerate OPO as an alternative entropy source [95, 96]; the receiver chain also develops single-photon detection for the discrete-variable protocols of L1."},{"t":"p","x":"Physics question. How do source and receiver imperfections propagate into certified randomness and finite-key security? Observable: entropy certification and finite-key rate as functions of measured imperfections. Starting point. First chip-QRNG result of the team [97]; the route builds on its integrated homodyne receivers and, as an alternative, on the in-house tunable DOPO [33]. QKD: entanglement-based QKD with QD sources, including daylight operation [48, 98]; device-independent tests and randomness-relevant protocols (Marques) [99, 100]; transfer-matrix modeling of multiport integrated beam splitters and photonic molecules [78, 101]."},{"t":"p","x":"Enables / metric: L1; secret-key rate, QBER, entropy rate."},{"t":"p","x":"Y1–3: Packaged QRNG module with NIST SP 800-22/90B validation (M1.2); BBM92 receiver."},{"t":"wp","x":"QPC-2 Continuous-variable quantum photonics on SiN and PPLN-TFLN (Martinelli, Nussenzveig, Barbosa, Florez, Barros)","wp":"QPC-2","id":"s22"},{"t":"p","x":"QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tr
