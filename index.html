e-frequency generation in GaP/GaAs and TFLN [1]. Its primary scientific output is a controlled test of whether frequency-dependent squeezing and multimode correlations give a statistically significant concentration-estimation advantage once mode matching, comb technical noise, transmission and detection losses are included: mode-resolved covariance data, a resource-matched classical control and estimator-level precision."},{"t":"p","x":"Starting point. Under which resource constraints does a non-classical optical resource yield a net task-level estimation advantage in broadband multimode spectroscopy (H-B)? Observable: Fisher information or concentration precision against a resource-matched optimized classical reference."},{"t":"p","x":"Metric moved by this fellowship. Mid-IR comb generation and spectroscopy with χ(2) optics and suspended-Si waveguides [2, 3]; free-running 1 GHz dual-comb laser and 20 GHz EO comb [4, 5]; methane and CO sensing in hollow-core fiber [6]; near-infrared dual-comb spectroscopy with multipass cells targeting N2O, starting at USP in early 2027."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Operate two microcombs with offset repetition rates and record interferograms."},{"t":"p","x":"2. Retrieve CO2 and CH4 concentrations and quantify the noise floor."},{"t":"p","x":"3. Deliver the noise budget to QEPS-1 DD1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Microcomb generation, dual-comb detection, RF analysis, line fitting."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Comb pair operating","Chip DCS of CO2/CH4","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 PD1."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"fig","x":["One publication; candidate for a DR in QEPS-1.","References","[1]","Daniel I. Herman et al. Science 387 (6734 2025), pp. 653–658.","[2]","Alexander J. Lind et al. Phys. Rev. Lett. 124 (13 2020).","[3]","Nima Nader et al. Optica, 6 (10 2019), pp. 1269–1276.","[4]","Marlon M Correia et al. (2026).","[5]","Marlon M. Correia et al. APL Photon. 11.6 (2026).","[6]"]},{"t":"p","x":"Artur de Araujo Silva et al. J. Opt. Soc. Am. B 40.4 (2023), pp. C21 –C27."}],"refs":{}},{"id":"f-QEPS-2_MS1","group":"MS","title":"QEPS-2 MS1: Optomechanical crystal design and 4 K characterization of mechanical Q and g0","pages":2,"file":"MS/QEPS-2_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow designs optomechanical crystals (LN-on-Si and diamond) and characterizes mechanical Q and g0 at 4 K, feeding the first device generation of L4."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-2, Piezo-optomechanical microwave–optical transduction, of the PHOQUS Research Plan, and serves L4 (microwave–optical transducer). The work package is defined as follows. QEPS-2 owns the L4 lighthouse. It develops lithium-niobate-on-silicon and diamond optomechanical crystals operated in the sideband-resolved regime at millikelvin temperatures, and couples them to superconducting circuits fabricated at Unicamp."},{"t":"p","x":"Starting point. How do piezo-optomechanical coupling, cryogenic dissipation and optically induced heating constrain coherent transfer of quantum information between microwave and optical fields (H-C)? Observable: non-classical correlations or state-transfer fidelity beyond η and nadd."},{"t":"p","x":"Metric moved by this fellowship. Optomechanical quantum teleportation and low-noise single phonon–photon conversion with Delft [1, 2]; dissipative optomechanics at GHz [3]; high-rate photon–phonon pairs in 2D optomechanical crystals [4]; diamond optomechanical crystal design [5]; quasiparticle dynamics of optically irradiated qubits and loss in mechanical resonators coupled to superconducting circuits (Benevides) [6, 7]; reproducible Josephson-junction fabrication by e-beam lithography (Rouxinol) [8]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Finite-element design of OMC unit cells and IDT coupling."},{"t":"p","x":"2. Fabrication at CCSNano and 4 K characterization."},{"t":"p","x":"3. Deliver measured parameters to QEPS-2 DR1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"FEM simulation, nanofabrication, 4 K optomechanical spectroscopy."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Designs","4 K characterization of generation 1","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-2 and XC-1."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"One publication; candidate for a DR in QEPS-2."}],"refs":{"1":"Niccolò Fiaschi et al. Nat. Photon. 15.11 (2021), pp. 817 –821.","2":"Liu Chen et al. Nat. Commun. 17 (1 2026), pp. 1187–.","3":"André G Primo et al. Nat. Commun. 14 (1 2023), p. 5793.","4":"Felix M. Mayor et al. Nat. Commun. 16 (1 2025), pp. 2576–.","5":"Flávio Moraes et al. J. Opt. Soc. Am. B 39.10 (2022), pp. 2735–2741.","6":"R. Benevides et al. Phys. Rev. Lett. 133.6 (2024).","7":"Raquel Garcia-Belles et al. PRX Quantum 7.3 (2026).","8":"Arthur M. Rebello et al. Nanomaterials 14.9 (2024)."}},{"id":"f-QEPS-3_MS1","group":"MS","title":"QEPS-3 MS1: Benchmark vapour-cell magnetometer coupled to a photonic chip","pages":2,"file":"MS/QEPS-3_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow builds the benchmark vapour-cell magnetometer coupled to a photonic chip and measures its sensitivity and bandwidth."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-3, Chip-integrated magnetometry, of the PHOQUS Research Plan, and serves the Phase-2 horizon H2 (field quantum sensors). The work package is defined as follows. QEPS-3 combines color-center defects in diamond with atomic-vapour interfaces for chip-integrated magnetometry, using the diamond platform of QEPS-2 and the squeezed-light resources of QPC-2. It seeds the Phase 2 field-sensor horizon (H2)."},{"t":"p","x":"Starting point. When does a quantum optical resource give a real magnetic-field estimation advantage on a chip at matched sensing resources? Observable: sensitivity versus an optimized classical reference under identical conditions."},{"t":"p","x":"Metric moved by this fellowship. Floquet and stroboscopic microwave spectroscopy of optically pumped magnetometers [1, 2]; ultrafast dynamics of NV-center ensembles [3]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Assemble the magnetometer with chip-delivered pump and probe."},{"t":"p","x":"2. Characterize sensitivity and noise sources."},{"t":"p","x":"3. Deliver the benchmark to QEPS-3 DD1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Optically pumped magnetometry, lock-in detection, fiber coupling."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Setup operating","Sensitivity characterized","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QPC-3 (coupling)."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"One publication; candidate for a DR in QEPS-3."}],"refs":{"1":"Hans Marin Florez et al. Phys. Rev. A 103 (3 2021), p. 033113.","2":"Hans Marin Florez et al. Phys. Rev. A 110 (4 2024), p. 043102.","3":"Albert Liu et al. Mater. Quantum Technol. 1.2 (2021)."}},{"id":"f-QPC-1_MS1","group":"MS","title":"QPC-1 MS1: Pump rejection and WDM demultiplexing module for fiber-coupled photon pairs","pages":2,"file":"MS/QPC-1_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow builds and characterizes the pump-rejection and WDM demultiplexing module that sits between the NIP-1 source and the L1 receivers, reaching >100 dB pump rejection with ≤1.5 dB insertion loss per arm."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-1, Chip QKD transmitters and QRNG, of the PHOQUS Research Plan, and serves L1 (receiver chain and field test) and the QRNG module M1.2. The work package is defined as follows. QPC-1 develops the QRNG chip (Year-2 deliverable) and then the chip QKD transmitter and receiver chain, including time-bin analyzers, for the L1 field test [1, 2]. Published chip QRNGs already reach 18.8–100 Gbit/s [3, 4], so QPC-1 does not compete on bit rate: its target is a certifiable entropy source fabricated and packaged in Brazil and validated on a national testbed. The QRNG is based on integrated balanced-homodyne detection of vacuum fluctuations [5], the same receiver used for key reception, with the binary phase states of the NIP-1 degenerate OPO as an alternative entropy source [6, 7]; the receiver chain also develops single-photon detection for the discrete-variable protocols of L1."},{"t":"p","x":"Starting point. How do source and receiver imperfections propagate into certified randomness and finite-key security? Observable: entropy certification and finite-key rate as functions of measured imperfections. Metric moved by this fellowship. First chip-QRNG result of the team [8]; the route builds on its integrated homodyne receivers and, as an alternative, on the in-house tunable DOPO [9]. QKD: entanglement-based QKD with QD sources, including daylight operation [10, 11]; device-independent tests and randomness-relevant protocols (Marques) [12, 13]; transfer-matrix modeling of multiport integrated beam splitters and photonic molecules [14, 15]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Assemble cascaded filters and demultiplexers and measure rejection, insertion loss and polarization dependence."},{"t":"p","x":"2. Characterize the noise floor (pump leakage, Raman in pigtails) with the NIP-1 protocol."},{"t":"p","x":"3. Deliver the module to QPC-1 DD1 for the spooled-fiber test."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Fiber-optic filter characterization, SNSPD noise measurements, loss-budget protocol of QPC-3. Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Filter chain assembled","Noise floor characterized with a source","D1 input","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 MS1 (source protocol) and QPC-3 (loss budget)."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"fig","x":["Conference paper; the demux module; candidate for a DR in QPC-1.","References","[1]","Chen-Xi Zhu et al. Phys. Rev. Appl. 17 (2022), p. 064034.","[2]","Hao Yu et al. Nat. Commun. 16 (2025), p. 171.","[3]","Bing Bai et al. Appl. Phys. Lett. 118 (2021), p. 264001.","[4]","Cédric Bruynsteen et al. PRX Quantum 4 (2023), p. 010330.","[5]","Y Liu et al. Nature 562 (2018), pp. 548–551.","[6]","Yoshitomo Okawachi et al. Opt. Lett. 41 (2016), pp. 4194–4197.","[7]","Liam Quinn et al. Opt. Lett. 48 (2023), pp. 3741–3744.","[8]"]},{"t":"p","x":"A. Dantas et al. Anais do Congresso Brasileiro de Ciência e Tecnologia Quântica (CBCTQ 2026). 2026. [9] Nathalia B Tomazio et al. ACS Photon. 12 (1 2025), 227 – 235."},{"t":"fig","x":["[10]","Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","[11]","F. Basso Basset et al. Quantum Sci. Technol. 8.2 (2023).","[12]","Alley Hameedi et al. Phys. Rev. A 102.3 (2020).","[13]","Rafael A. Da Silva et al. Phys. Rev. A 107.4 (2023).","[14]"]},{"t":"p","x":"Diego G. Barreto et al. J. Opt. Soc. Am. B 43.2 (2026), pp. 300 –308."},{"t":"p","x":"[15] Maria Carolina Volpato et al. J. Opt. Soc. Am. B 43.3 (2026), A200 –A205."}],"refs":{}},{"id":"f-QPC-2_MS1","group":"MS","title":"QPC-2 MS1: Measurement of CCSNano-fabricated SiN oscillators on the USP tomography bench (M1.0)","pages":2,"file":"MS/QPC-2_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow carries out the first convergence measurement of the center: a CCSNano-fabricated SiN oscillator measured on the USP tomography bench (M1.0, month 9), and documents the chip-to-bench interface (coupling, pump filtering, shot-noise calibration)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-2, Continuous-variable quantum photonics on SiN and PPLN-TFLN, of the PHOQUS Research Plan, and serves L2 (integrated squeezing with on-chip readout) and L3 (squeezed light for the spectrometer). The work package is defined as follows. QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tracks (Kerr in SiN, χ(2) in PPLN-TFLN [1]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far."},{"t":"p","x":"Starting point. How are quantum noise and multimode correlations redistributed in integrated χ(2) and χ(3) circuits, and what limits their reconstruction (H-A, H-B)? Observable: calibrated covariance matrices and tomography versus loss, visibility and mode structure."},{"t":"p","x":"Metric moved by this fellowship. Tomography of an integrated χ(3) OPO [2]; assumption-free measurement of intense-field sidebands [3]; CV entanglement and hidden entanglement in four-wave-mixing OPOs [4, 5]; diagnostics for CV cluster states [6]; structured quantum light (Barros) [7]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Couple CCSNano chips to the USP bench with the QPC-3 loss protocol."},{"t":"p","x":"2. Measure noise spectra and first squeezing or classical correlations of the integrated oscillator."},{"t":"p","x":"3. Write the chip-to-bench interface protocol."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Homodyne detection, fiber coupling, shot-noise calibration."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","M1.0 measurement report","M1.0","Second chip generation measured","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 and QPC-3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Joint Unicamp–USP publication; protocol; candidate for QPC-2 DR2 continuation."}],"refs":{"1":"Jie Zhao et al. Sci. Adv. 11 (2025), eadu4888.","2":"Roger Alfredo Kögler et al. Opt. Lett. 49.11 (2024), pp. 3150–3153.","3":"F.A.S. Barbosa et al. Phys. Rev. A 102.6 (2020).","4":"A. Montaña Guerrero et al. Phys. Rev. Lett. 129.16 (2022).","5":"R.L. Rincón Celis et al. Phys. Rev. Lett. 137.9 (2026).","6":"Carlos González-Arciniegas et al. PRX Quantum 2 (3 2021), p. 030343.","7":"Markus Hiekkamäki et al. Nat. Photon. 16.12 (2022), pp. 828 –833."}},{"id":"f-QPC-3_MS1","group":"MS","title":"QPC-3 MS1: Facet-loss metrology at 300 K and 4 K and packaging of lighthouse chips","pages":2,"file":"MS/QPC-3_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow builds the facet-loss metrology station (300 K and 4 K) and packages the first lighthouse chips, producing the loss-budget registry used by all work packages."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-3, Low-loss fiber–chip quantum interfaces, of the PHOQUS Research Plan, and serves all lighthouses (fiber–chip loss budget), in particular L1 and the cryogenic attach of L4. The work package is defined as follows. Loss at the chip boundary is the dominant penalty for every lighthouse. QPC-3 develops 3D micro-printed couplers and specialty-fiber interfaces [1] and cryogenic-compatible packaging, with a coupling loss budget tracked as a center-level metric."},{"t":"p","x":"Starting point. How do coupling, mode overlap and packaging convert optical loss into quantum-state infidelity, at 300 K and 4 K? Observable: a joint loss and fidelity budget per interface."},{"t":"p","x":"Metric moved by this fellowship. Two-photon polymerised micro-optics and resonators [2]; current Marie Skłodowska-Curie work on 3D nanoprinting at IPHT (Tomazio); industrial collaboration with Corning Inc. on fiber–chip coupling (Innovation Action Plan)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Assemble the alignment and loss-measurement station and write the protocol."},{"t":"p","x":"2. Measure facet loss of the NIP-1, QPC-2 and NIP-4 chips and track it across cooldowns."},{"t":"p","x":"3. Package two chips for the Year-2 tests."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Six-axis alignment, calibrated power metrology, UV-cure attach, 4 K cryostat with fiber feedthrough. Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Station operating","Registry with ≥10 chips","D1 input","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QPC-3 DD1 and XC-1."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Conference paper; the loss registry; candidate for a DR in QPC-3."}],"refs":{"1":"Johannes Bürger et al. Adv. Photon. 7 (2025), p. 046002.","2":"Adriano J. G. Otuka et al. Polymers 13.12 (2021)."}},{"id":"f-IC-01","group":"IC","title":"IC-01: Simulation and optical characterization of dispersion-engineered SiN microresonators","pages":2,"file":"IC/IC-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month undergraduate research project on the simulation and optical characterization of dispersion-engineered silicon nitride (SiN) microresonators, the photon-pair and squeezed-light sources of L1 and L2. The student learns finite-element mode solving, dispersion design and the fiber-coupled measurement of quality factor and free spectral range, and delivers a calibrated dispersion map (measured against simulated) for one device generation of NIP-1."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-1, Kerr and electro-optic combs, DOPO in coupled microresonators, of the PHOQUS Research Plan, which serves L1 (SiN pair source), L2 (SiN Kerr squeezing track) and L3 (chip combs). Coupled SiN microresonators (photonic molecules) give independent control of dispersion and mode hybridization, which we use to select degenerate parametric oscillation and suppress competing processes [1, 2]. NIP-1 delivers (i) high-Q SiN rings for SFWM pair generation (L1), (ii) dispersion-engineered resonators for Kerr squeezing (L2, SiN track), and (iii) Kerr and EO combs for dual-comb spectroscopy (L3), including spectral extension to the blue and UV [3]. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Simulate the mode dispersion of SiN microrings (waveguide width, thickness and radius) and the coupling of a pair of rings for the photonic-molecule designs of NIP-1."},{"t":"p","x":"2. Measure transmission spectra with a tunable laser and a calibrated fiber interferometer; extract loaded and intrinsic quality factors and the integrated dispersion."},{"t":"p","x":"3. Compare measured and simulated dispersion and feed the deviations back to the next mask iteration."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Finite-element eigenmode simulations (open-source or commercial solver available in the group), scripted sweeps in Python; swept-laser transmission measurements with a fiber Mach–Zehnder reference for frequency calibration; automated fitting of resonance lineshapes. The devices come from the shared CCSNano SiN process baseline (M1.1); the student works alongside the NIP-1 postdoc and direct-PhD fellows, who provide the samples and the setup."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds Mode solver validated against a published SiN dispersion curve; first transmission spectra NIP-1 training Dispersion map of one chip (Q, FSR, D2) with uncertainties M1.1 (SiN baseline)"},{"t":"p","x":"Coupled-ring simulation and measurement of mode hybridization on a photonic-molecule device NIP-1 pair source for L1 Final report; measured-vs-simulated comparison handed to the mask iteration annual report, D1 input 6. Supervision, training and diffusion Supervisor: Wiederhecker (PR), with day-to-day guidance by the NIP-1 postdoc. Training across two links of the chain: design (simulation) and quantum measurement (resonator metrology). The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s6"},{"t":"p","x":"A dispersion-characterization notebook reused by NIP-1; one conference contribution (student poster) expected; readiness to continue into the MS fellowship of the work package."}],"refs":{}},{"id":"f-IC-02","group":"IC","title":"IC-02: Finite-element design of GHz phononic resonators in thin-film lithium niobate","pages":2,"file":"IC/IC-02_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on the finite-element design of GHz mechanical (phononic) resonators in thin-film lithium niobate (TFLN) for the Brillouin and optomechanical devices of NIP-2, which feed the L4 transducer. The student builds parametrized models of suspended TFLN structures, computes mechanical mode frequencies, quality-factor limits from clamping and the optomechanical coupling to the optical mode, and compares with the first measured devices."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-2, Brillouin scattering and optomechanics in TFLN, of the PHOQUS Research Plan, which serves L4 (phononic design rules and Brillouin/optomechanical devices on TFLN). NIP-2 develops phonon-mediated devices on TFLN: narrow-linewidth Brillouin sources and GHz acoustic resonators whose design rules (piezoelectric coupling, phonon confinement, mechanical Q at low temperature) are transferred to the transducers of QEPS-2. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Build parametrized finite-element models (elastic anisotropy and piezoelectricity of LN) of suspended TFLN phononic resonators in the 1–10 GHz range."},{"t":"p","x":"2. Compute clamping-limited mechanical quality factors and the overlap integrals that give the optomechanical and Brillouin coupling rates."},{"t":"p","x":"3. Compare the simulated mode spectra with the pump-probe measurements of the NIP-2 fellows on the first fabricated devices."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Finite-element simulations with the group’s established workflow (geometry scripting, perfectly matched layers for clamping loss, photoelastic and moving-boundary overlap integrals), run on the group cluster; weekly design reviews with the NIP-2 direct-PhD fellow; participation in the measurement sessions where the devices are tested at 300 K."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds Validated model of a reference optomechanical crystal (comparison with literature values)"},{"t":"p","x":"NIP-2 training Mode map of the first TFLN phononic design: frequencies, Qclamp, g0 estimate NIP-2 device generation 1 Design rules (thickness, tether geometry) documented; comparison with measured spectra L4 phononic design Final report and model library handed to NIP-2 annual report 6. Supervision, training and diffusion Supervisor: Alegre (PP), co-lead of NIP-2, with Wiederhecker. Links of the chain: design and quantum measurement (optomechanical readout). The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s6"},{"t":"p","x":"A parametrized model library for TFLN phononics used by the NIP-2 and QEPS-2 fellows; student poster at the annual meeting; natural continuation into the NIP-2 MS fellowship."}],"refs":{}},{"id":"f-IC-03","group":"IC","title":"IC-03: Raman and photoluminescence characterization of 2D materials transferred onto SiN waveguides","pages":2,"file":"IC/IC-03_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project at MackGraphe on the optical characterization of two-dimensional (2D) materials (MoS2, hBN, graphene) before and after transfer onto SiN waveguides: Raman and photoluminescence mapping, layer counting and the identification of strain and doping, which NIP-3 needs to select flakes for the quasi-phase-matched SHG/SPDC structures and the pump-control elements."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-3, 2D materials: χ(2) media and hybrid nonlinear devices, of the PHOQUS Research Plan, which serves L1 (alternative SPDC source) and L2 (on-chip pump control). Transition-metal dichalcogenides integrated on SiN provide a χ(2) response on a centrosymmetric platform [1]. NIP-3 pursues waveguide-coupled SHG and SPDC with modal phase matching and quasi-phase-matching by patterned 2D layers, and 2D saturable absorbers and non-reciprocal elements for on-chip pump control. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Learn mechanical exfoliation and the optical identification of mono- and few-layer flakes; build a labeled flake library."},{"t":"p","x":"2. Operate the Raman/PL microscope; map layer number, strain and doping before and after transfer onto waveguides."},{"t":"p","x":"3. Correlate the maps with the waveguide transmission measured by the NIP-3 fellows to establish a flake-selection protocol."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Exfoliation and dry-transfer stations and the confocal Raman/PL microscope of MackGraphe; Python scripts for map analysis (peak fitting, layer-number classification); joint sessions with the NIP-3 PhD and postdoc fellows for the transferred samples; sample records in the center’s data repository."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds Flake library (20 flakes) with optical-contrast layer identification NIP-3 training Raman/PL protocol documented; strain/doping map of transferred flakes NIP-3 Y1 deliverable Correlation of flake quality with waveguide transmission and SHG signal L1 SPDC alternative source Final report and selection protocol adopted by NIP-3 annual report 6. Supervision, training and diffusion Supervisor: de Matos (PP). Links of the chain: fabrication (2D transfer) and characterization. The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s6"},{"t":"p","x":"A flake-selection protocol and library for NIP-3; student poster; continuation into the NIP-3 PhD pipeline at Mackenzie."}],"refs":{}},{"id":"f-IC-04","group":"IC","title":"IC-04: Low-temperature photoluminescence mapping of epitaxial quantum-dot samples","pages":2,"file":"IC/IC-04_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on the low-temperature photoluminescence mapping of epitaxial quantum-dot (QD) samples grown by MBE at IFGW, and the automated analysis of emission wavelength, linewidth and density across the wafer. The maps select the regions used for the waveguide-integrated deterministic sources of the L1 QD track (NIP-4)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-4, Quantum emitters: from integrability to coherence, of the PHO-QUS Research Plan, which serves L1 (deterministic QD track) and the integrability–coherence program. NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Operate the micro-photoluminescence setup at 4 K (closed-cycle cryostat) under supervision; acquire PL maps of droplet-etched QD samples."},{"t":"p","x":"2. Write the analysis pipeline: peak finding, linewidth and wavelength statistics, QD density per field."},{"t":"p","x":"3. Deliver wafer maps that identify the regions meeting the NIP-4 wavelength and density targets for device processing."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"The NIP-4 micro-PL bench (spectrometer, CCD, 4 K cryostat), with the postdoc of the work package as day-today mentor; Python analysis pipeline with versioned scripts; sample registry shared with the MBE growth log. The student does not operate the MBE system but attends growth sessions to understand the growth–emission relation."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds PL spectra of a reference sample; cryostat and spectrometer operation certified by the mentor NIP-4 training Analysis pipeline validated; first wafer map (wavelength, linewidth, density)"},{"t":"fig","x":["NIP-4 source selection","Maps of three growth runs; correlation with growth parameters","L1 QD track (D1 input)","Final report; pipeline adopted by NIP-4","annual report"]},{"t":"h1","x":"6. Supervision, training and diffusion","id":"s6"},{"t":"p","x":"Supervisor: Deneke (PP), with Padilha for the emitter spectroscopy. Links of the chain: fabrication (growth) and quantum measurement (emitter spectroscopy). The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s7"},{"t":"p","x":"A PL-mapping pipeline and the wafer maps for the Year-1 and Year-2 QD samples; student poster; continuation into the NIP-4 MS fellowship."}],"refs":{}},{"id":"f-IC-05","group":"IC","title":"IC-05: Statistical validation (NIST SP 800-22/90B) of the DOPO quantum random-number generator","pages":2,"file":"IC/IC-05_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on the statistical validation of the quantum random-number generator (QRNG) of QPC-1: implementation and automation of the NIST SP 800-22 and SP 800-90B test batteries on the raw and post-processed bit streams of the DOPO-based chip, and the estimation of min-entropy against the module M1.2 target."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-1, Chip QKD transmitters and QRNG, of the PHOQUS Research Plan, which serves L1 (receiver chain and field test) and the QRNG module M1.2. QPC-1 develops the QRNG chip (Year-2 deliverable) and then the chip QKD transmitter and receiver chain, including time-bin analyzers, for the L1 field test [1, 2]. Published chip QRNGs already reach 18.8–100 Gbit/s [3, 4], so QPC-1 does not compete on bit rate: its target is a certifiable entropy source fabricated and packaged in Brazil and validated on a national testbed. The QRNG is based on integrated balanced-homodyne detection of vacuum fluctuations [5], the same receiver used for key reception, with the binary phase states of the NIP-1 degenerate OPO as an alternative entropy source [6, 7]; the receiver chain also develops single-photon detection for the discrete-variable protocols of L1. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Implement and validate the NIST SP 800-22 statistical test suite and the SP 800-90B entropy estimators on reference data."},{"t":"p","x":"2. Run the batteries on QRNG data acquired by the QPC-1 fellows; characterize bias, correlations and the effect of post-processing."},{"t":"p","x":"3. Automate the analysis as a service of the QPC-1 bench, with a reproducible report format."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Python/C implementations of the test suites (open-source reference code, validated against known-answer data), run on the group’s servers; acquisition sessions with the QPC-1 postdoc; version control and data provenance in line with the Data Management Plan."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds Test suites validated on reference data; acquisition protocol learned QPC-1 training First full report on a QRNG dataset (pass rates, min-entropy)"},{"t":"p","x":"M1.2 (QRNG module)"},{"t":"p","x":"Automated pipeline; study of post-processing and sampling-rate effects QPC-1 certifiable entropy source Final report; pipeline adopted by QPC-1 and the innovation plan annual report 6. Supervision, training and diffusion Supervisor: Frateschi (PP). Links of the chain: quantum measurement and data analysis; contact with the Innovation plan (QRNG as a testable module). The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s6"},{"t":"p","x":"A validated statistical-test pipeline for the center’s QRNG; student poster; a well-documented basis for the entropy-certification work of QPC-1."}],"refs":{}},{"id":"f-IC-06","group":"IC","title":"IC-06: Characterization and shot-noise calibration of balanced homodyne detectors","pages":2,"file":"IC/IC-06_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project at the USP quantum-optics laboratory on the characterization of balanced homodyne detectors: electronic noise, bandwidth, common-mode rejection and shot-noise calibration versus optical power, the measurements that set the detection-efficiency term of the L2 squeezing loss budget (QPC-2)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-2, Continuous-variable quantum photonics on SiN and PPLN-TFLN, of the PHOQUS Research Plan, which serves L2 (integrated squeezing with on-chip readout) and L3 (squeezed light for the spectrometer). QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tracks (Kerr in SiN, χ(2) in PPLN-TFLN [1]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Learn the operation of a balanced homodyne detector and the shot-noise calibration procedure (linearity of the noise variance with local-oscillator power)."},{"t":"p","x":"2. Characterize electronic noise clearance, bandwidth and common-mode rejection of the detectors of the bench with uncertainties."},{"t":"p","x":"3. Produce a calibration routine and report used by the QPC-2 fellows and by the TT5-02 metrology plan."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"The USP continuous-variable bench (low-noise detectors, spectrum analyzer, digitizer), with the QPC-2 postdoc as mentor; Python scripts for variance estimation and linear fits; participation in squeezing measurement sessions as observer and then as operator of the calibration step."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Shot-noise calibration reproduced on the reference detector","QPC-2 training","Noise, bandwidth and CMRR characterization of two detectors","L2 loss budget (detection term)","Calibration routine automated and documented","QPC-2 / TT5-02","Final report; routine adopted on the bench","annual report, L2-T preparation"]},{"t":"h1","x":"6. Supervision, training and diffusion","id":"s6"},{"t":"p","x":"Supervisor: Martinelli (PP), with Nussenzveig. Link of the chain: quantum measurement, with an introduction to the chip devices measured on the bench (M1.0). The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s7"},{"t":"p","x":"A documented detector-calibration routine; student poster; continuation into the QPC-2 MS fellowship at USP."}],"refs":{}},{"id":"f-IC-07","group":"IC","title":"IC-07: Automation of fiber-chip facet-loss measurements","pages":1,"file":"IC/IC-07_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on the automation of fiber–chip facet-loss measurements for the packaging work package QPC-3: motorized alignment, repeatable insertion-loss measurement with cut-back and reference structures, and the statistics of coupling loss over many facets, which feed the loss budgets of all four lighthouses."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-3, Low-loss fiber–chip quantum interfaces, of the PHOQUS Research Plan, which serves all lighthouses (fiber–chip loss budget), in particular L1 and the cryogenic attach of L4. Loss at the chip boundary is the dominant penalty for every lighthouse. QPC-3 develops 3D micro-printed couplers and specialty-fiber interfaces [1] and cryogenic-compatible packaging, with a coupling loss budget tracked as a center-level metric. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Learn fiber-to-chip edge coupling and the measurement of insertion loss with calibrated references."},{"t":"p","x":"2. Automate alignment and data acquisition (motorized stages, power meters, swept laser) in Python."},{"t":"p","x":"3. Measure the facet-loss distribution of one chip generation and report it with uncertainties."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"The QPC-3 coupling station at IFGW (six-axis stages, lensed and cleaved fibers, swept laser, power meters); scripted alignment and acquisition; analysis of cut-back structures; weekly reviews with the QPC-3 direct-PhD fellow and the TT5-04 fellow once in place."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Manual coupling and loss measurement mastered on a reference chip","QPC-3 training","Automated alignment routine; repeatability study","QPC-3 facet metrology"]},{"t":"p","x":"Loss distribution of one chip generation (statistics over 20 facets)"},{"t":"p","x":"lighthouse loss budgets (L1, L2)"},{"t":"p","x":"Final report; routine adopted by the packaging station annual report 6. Supervision, training and diffusion Supervisor: Wiederhecker (PR), co-lead of QPC-3, with Tomázio (PA) as technical mentor. Links of the chain: packaging and characterization. The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s6"},{"t":"p","x":"An automated facet-loss routine and the first loss statistics of the center’s chips; student poster; continuation into the QPC-3 MS fellowship."}],"refs":{}},{"id":"f-IC-08","group":"IC","title":"IC-08: Dual-comb spectroscopy data processing of CO2 and CH4 and HITRAN fitting","pages":2,"file":"IC/IC-08_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on the processing of dual-comb spectroscopy data of CO2 and CH4: extraction of absorption spectra from interferograms, fitting against the HITRAN database, and the quantification of concentration sensitivity, which establishes the classical baseline against which the squeezed dual-comb spectrometer of L3 (QEPS-1) will be compared."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-1, Squeezed dual-comb spectroscopy, of the PHOQUS Research Plan, which serves L3 (squeezed dual-comb spectrometer). QEPS-1 owns the L3 lighthouse. It builds a dual-comb spectrometer seeded by the L2 squeezed light, first with fiber or EO combs and then with chip combs from NIP-1, and extends coverage to the mid-infrared and THz by difference-frequency generation in GaP/GaAs and TFLN [1]. Its primary scientific output is a controlled test of whether frequency-dependent squeezing and multimode correlations give a statistically significant concentration-estimation advantage once mode matching, comb technical noise, transmission and detection losses are included: mode-resolved covariance data, a resource-matched classical control and estimator-level precision. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Implement the processing chain from dual-comb interferograms to calibrated absorption spectra (phase correction, averaging, frequency axis)."},{"t":"p","x":"2. Fit measured spectra of CO2 and CH4 with line-by-line models from HITRAN; estimate concentration and its uncertainty."},{"t":"p","x":"3. Quantify the noise floor and sensitivity versus averaging time on the classical setup."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Data from the QEPS-1 dual-comb bench at IFGW (acquired with the QEPS-1 fellows); Python processing (FFT, phase correction, HITRAN-based fitting with an open-source line-shape library); gas-cell measurements at known concentrations for validation."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Processing chain validated on a reference dataset","QEPS-1 training","Calibrated CO2 spectrum fitted to HITRAN; concentration retrieval","QEPS-1 classical baseline","Sensitivity versus averaging time; CH4 added","L3 shot-noise reference","Final report; processing chain adopted by QEPS-1","annual report, L3-T preparation"]},{"t":"h1","x":"6. Supervision, training and diffusion","id":"s6"},{"t":"p","x":"Supervisor: Cruz (PP). Links of the chain: quantum measurement (comb metrology) and data analysis. The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s7"},{"t":"p","x":"A documented dual-comb processing chain and the classical sensitivity baseline of the spectrometer; student poster; continuation into the QEPS-1 MS fellowship."}],"refs":{}},{"id":"f-IC-09","group":"IC","title":"IC-09: Room-temperature and 4 K characterization of optomechanical crystals","pages":2,"file":"IC/IC-09_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on the room-temperature and 4 K characterization of optomechanical crystals for the L4 transducer (QEPS-2): measurement of optical and mechanical quality factors, thermal-noise spectra and the optomechanical coupling rate g0, following the measurement protocol of the work package."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-2, Piezo-optomechanical microwave–optical transduction, of the PHOQUS Research Plan, which serves L4 (microwave–optical transducer). QEPS-2 owns the L4 lighthouse. It develops lithium-niobate-on-silicon and diamond optomechanical crystals operated in the sideband-resolved regime at millikelvin temperatures, and couples them to superconducting circuits fabricated at Unicamp. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Learn the optomechanical readout (swept-laser transmission, thermal-noise spectrum on a spectrum analyzer) and its calibration."},{"t":"p","x":"2. Measure optical Q, mechanical Qm and g0 of a set of devices at 300 K and, under supervision, at 4 K in the closed-cycle cryostat."},{"t":"p","x":"3. Compile the device statistics that select the designs for the millikelvin experiments."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"The QEPS-2 optomechanics bench at IFGW and the 4 K closed-cycle cryostat of the Cryogenics Facility (operated with the facility technicians and the TT5-01 fellow); phase-modulation calibration of g0; Python analysis scripts shared with the work package."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds Room-temperature measurement of a reference device; g0 calibration reproduced QEPS-2 training Statistics of Q, Qm, g0 over one chip at 300 K QEPS-2 design down-selection First 4 K measurements (mechanical Qm versus temperature)"},{"t":"p","x":"L4 (mK campaign preparation)"},{"t":"p","x":"Final report and device database annual report 6. Supervision, training and diffusion Supervisor: Alegre (PP), lead of QEPS-2. Links of the chain: quantum measurement and cryogenic operation (with XC-1). The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s6"},{"t":"p","x":"A device database for the L4 transducer candidates; student poster; continuation into the QEPS-2 MS fellowship."}],"refs":{}},{"id":"f-IC-10","group":"IC","title":"IC-10: Design and RF characterization of surface-acoustic-wave transducers on LN and GaAs","pages":2,"file":"IC/IC-10_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month project on surface-acoustic-wave (SAW) devices for the cross-cutting work package XC-1: design and room-temperature radio-frequency characterization of interdigital transducers on lithium niobate and GaAs (resonance frequency, insertion loss, electromechanical coupling), which are the acoustic control elements shared by the emitter and phononic platforms of the center."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package XC-1, Acoustic control and cryogenic operation across branches, of the PHOQUS Research Plan, which serves the QD track of L1 and the cryogenic platform of L4. Surface acoustic waves (SAW) and cryogenic operation are needed in all three branches, and XC-1 provides them as a shared platform. SAW on piezoelectric substrates (LN, GaAs) modulate excitons, trions and quantum emitters (NIP-4), drive Brillouin and optomechanical interactions (NIP-2), and offer an acoustic route to the microwave interface of L4 (QEPS-2). The IFGW Cryogenics Facility supplies the 4 K and mK operation required by NIP-4, QPC-3 packaging and L4. XC-1 also hosts strain engineering of emitters on semiconductor nanomembranes. The undergraduate fellowships are the entry point of the center’s training pipeline (Diffusion plan, A7): a twelve-month project with a defined deliverable for the work package, supervised by the PR or a PP and mentored day to day by a postdoctoral or PhD fellow of the same work package. Candidates must have completed the relevant disciplines with good standing (call, item e.5.i)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design interdigital transducers (period, aperture, number of fingers) for 0.5–3 GHz SAW on LN and GaAs with analytical and finite-element models."},{"t":"p","x":"2. Measure S-parameters of fabricated devices with a vector network analyzer; extract resonance, insertion loss and coupling coefficient."},{"t":"p","x":"3. Compare with design and document the SAW device library of XC-1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Analytical (delta-function) and finite-element models; RF probe station and vector network analyzer at IFGW; devices fabricated in the CCSNano baseline by the XC-1 fellows; data analysis in Python; measurement sessions with the XC-1 postdoc."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","IDT design tool validated against a reference device","XC-1 training","S-parameter characterization of the first device set","XC-1 SAW platform","Design-versus-measurement comparison; second design iteration","NIP-4/QEPS-2 acoustic control","Final report; device library documented","annual report"]},{"t":"h1","x":"6. Supervision, training and diffusion","id":"s6"},{"t":"p","x":"Supervisor: Couto (PP). Links of the chain: design and characterization (RF metrology), with an introduction to the cryogenic platform of XC-1. The fellow takes part in at least one action of the Diffusion plan (a laboratory visit of the “quantum light” circuit, A2, or the annual school, A1) and presents a poster at the annual PHOQUS meeting. Selection follows the center’s call for IC fellows, with priority to students from public schools and from under-represented groups (Diffusion plan, A7)."},{"t":"h1","x":"7. Expected results","id":"s7"},{"t":"p","x":"A SAW device library and RF characterization protocol for XC-1; student poster; preparation for a graduate project on acoustically driven quantum emitters."}],"refs":{}},{"id":"f-JC1-01","group":"JC1","title":"JC1-01: Center website and monthly result pieces","pages":2,"file":"JC1/JC1-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month science-journalism training on the center’s website and monthly editorial piece: the fellow learns to turn results of the work packages into accurate plain-language texts, interviews fellows and PIs, and maintains the plain-language version of the lighthouse roadmap."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"Action A6 of the Diffusion plan creates a center website with the lighthouse roadmap in plain language and a monthly piece on results and people. This fellowship is the entry level of that newsroom, supervised by the Knowledge Diffusion Coordinator at USP. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-I, for students enrolled in an undergraduate course (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Produce one monthly piece (text, 600–900 words, with figure) on a result or a person of the center, reviewed by the researchers involved."},{"t":"p","x":"2. Maintain the plain-language roadmap page and the glossary of quantum-photonics terms used across the center’s material."},{"t":"p","x":"3. Learn the basics of reporting on physics research: sources, uncertainty, peer review, embargoes."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Weekly editorial meeting with the Diffusion Manager; interviews with fellows at the monthly branch meetings; fact-checking protocol with the researchers; web publishing and analytics; a short course on science journalism offered by the center in the first quarter (together with the other JC fellows)."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Glossary and roadmap page online; first two pieces published","Diffusion A6, Year-1 website","Six pieces; readership analytics reported","annual Scientific Report metrics","Coverage of the annual PHOQUS meeting and school","A1, A6","Twelve pieces; editorial guide handed to the next fellow","A6"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"Twelve published pieces, the glossary and the editorial guide; training in science reporting documented in a final report; assessment by the Coordinator on accuracy, clarity and autonomy."}],"refs":{}},{"id":"f-JC1-02","group":"JC1","title":"JC1-02: Social media and short videos from the laboratories","pages":2,"file":"JC1/JC1-02_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month training on short-form science communication: the fellow produces the center’s social-media content and short videos (60–180 s) filmed in the laboratories of Campinas, explaining what the fellows do and why quantum light matters, with the Diffusion Manager and the Unicamp communication office."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A6 includes the center’s social-media presence and short videos; the laboratories of IFGW and CCSNano in Campinas are where the chips are made and measured, and this fellowship is based there, supervised by the Director. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-I, for students enrolled in an undergraduate course (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Plan and produce a weekly social-media schedule and two short videos per month, with scripts reviewed by the researchers."},{"t":"p","x":"2. Learn laboratory filming (cleanroom and laser-safety rules, image rights) and basic editing."},{"t":"p","x":"3. Measure reach and engagement and report them to the Diffusion plan metrics."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Weekly planning with the Diffusion Manager; filming sessions scheduled with the laboratory managers; editing on the institution’s equipment; the science-journalism short course of the center in the first quarter; accessibility (captions, Portuguese and English)."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Content guide and visual identity applied; first four videos","A6","Twelve videos; engagement report","annual Scientific Report metrics"]},{"t":"p","x":"Video coverage of the annual school and the “Noite da Luz Quântica” A1, A6 Twenty-four videos; archive and guide handed over A6 6. Integration and reporting The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s6"},{"t":"p","x":"A video archive and the content guide; metrics of reach; training in laboratory filming and short-form science communication; final report and assessment by the supervisor."}],"refs":{}},{"id":"f-JC1-03","group":"JC1","title":"JC1-03: Scripts and support material of the quantum-light laboratory-visit circuit","pages":2,"file":"JC1/JC1-03_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month training on the communication material of the laboratory-visit circuit: the fellow writes the visit scripts for the three demonstrations (random numbers, entanglement link, gas-sensing spectrometer) for secondary-school audiences, prepares the guide material and the printed and digital support, and helps run and evaluate the visits."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A2 organizes guided visits around three demonstrations, with a target of 40 visits and 1500 students per year from Year 2, with priority to public schools. The fellowship is based in Campinas (CCSNano and IFGW laboratories), supervised by the Director. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-I, for students enrolled in an undergraduate course (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Write and test the visit scripts (15 minutes per station) and the guide handbook used by the research fellows who act as guides."},{"t":"p","x":"2. Produce the support material (panels, a take-home sheet, a web page for teachers)."},{"t":"p","x":"3. Run the visitor survey and report the metrics (students, schools, origin)."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Script development with the researchers responsible for each demonstration; pilot visits with two schools; iteration with teacher feedback; survey design with the Diffusion Manager; the science-journalism short course of the center."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Draft scripts and handbook; pilot visit","A2 (Year-2 launch)","Material printed and online; ten visits supported","A2 metrics","Survey analysis; script revision","A2, A7","Final material and visit report; hand-over","annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"The visit scripts, handbook and support material; metrics of the first year of the circuit; training in audiencecentered science communication; final report and assessment."}],"refs":{}},{"id":"f-JC1-04","group":"JC1","title":"JC1-04: Coverage and open publication of the annual PHOQUS School","pages":1,"file":"JC1/JC1-04_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month training on the communication of the annual PHOQUS School: the fellow prepares the school’s web presence, covers the two weeks of the school (daily reports, interviews with lecturers and students, recording support), and edits the lecture notes and recordings for open publication."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A1 turns the team’s two-week school in quantum optics and photonics into the center’s annual school, with lecture notes and recordings published openly; the fellowship, supervised by the Knowledge Diffusion Coordinator, provides the editorial work this requires. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-I, for students enrolled in an undergraduate course (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Produce the school’s call, web pages and daily coverage (text and images)."},{"t":"p","x":"2. Coordinate the recording and the open publication of lectures (editing, captions, metadata)."},{"t":"p","x":"3. Interview participants and produce a feature on the school for the center’s channels."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Work with the school’s organizing committee from the planning phase; coverage protocol agreed with the lecturers (image rights, embargoes); editing of recordings with the institution’s audiovisual service; the science-journalism short course of the center."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","School web pages and call published","A1","Coverage plan and recording protocol approved","A1","School covered; recordings and notes online within 60 days","A1, A5","Feature published; metrics (views, downloads) reported","annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"Open lecture collection of one edition of the school, the coverage archive and a feature; training in event coverage and editorial production; final report and assessment."}],"refs":{}},{"id":"f-JC1-05","group":"JC1","title":"JC1-05: Texts and videos for the quantum-optics applet series","pages":2,"file":"JC1/JC1-05_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month training on the texts and short videos that accompany the interactive applets on quantum-optics concepts (photons and detectors, interference, entanglement, squeezing, randomness): the fellow writes the explanatory texts in Portuguese and English for secondary-school level, scripts the short videos and tests the material with students."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A5 publishes applets and short videos under an open license, used in the visits (A2), the exhibition (A3) and the teacher course (A4). The fellowship, supervised by the Knowledge Diffusion Coordinator at USP, provides the writing and testing; the applets are produced with AI assistance and reviewed by the researchers. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-I, for students enrolled in an undergraduate course (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Write the accompanying texts of five applets at secondary-school level, reviewed by the researchers."},{"t":"p","x":"2. Script and produce five short explanatory videos (Portuguese, English captions)."},{"t":"p","x":"3. Test the material with two school classes and revise it from the results."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Writing sprints with the researcher responsible for each concept; the plain-language glossary of JC1-01; pilot sessions in partner schools with the Diffusion Manager; the science-journalism short course of the center; open publication with version control."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Texts of the first two applets reviewed and online","A5","Five texts; two videos","A5, A4 (teacher course material)","Pilot test with two classes; revision","A2, A5","Five applets complete with texts and videos","annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"Bilingual texts and videos for five applets, tested with students; training in educational science writing; final report and assessment."}],"refs":{}},{"id":"f-JC1-06","group":"JC1","title":"JC1-06: Classroom material of the teacher course on light","pages":2,"file":"JC1/JC1-06_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month training on the classroom material of the teacher course on light, information and quantum technologies (40 hours, 60 teachers per year): the fellow prepares the ready-to-use material (lesson sheets, slides, activity guides with the applets of A5) with the lecturers, documents the course and collects the teachers’ feedback."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A4 offers one edition per year of a course for secondary-school physics teachers in partnership with the state education secretariat. The fellowship is based in Campinas, supervised by the Director, and works with the lecturers of the course. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-I, for students enrolled in an undergraduate course (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Produce the classroom material of the course (eight lesson modules) in a consistent format, reviewed by the lecturers."},{"t":"p","x":"2. Cover the course edition (text and images) and collect the teachers’ evaluation."},{"t":"p","x":"3. Publish the material under an open license and report its downloads."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Monthly meetings with the course lecturers; adaptation of the applets and texts of A5; feedback forms designed with the Diffusion Manager; the science-journalism short course of the center."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Material format and first two modules","A4","Eight modules reviewed; course edition supported","A4 (Year-2 edition)","Evaluation report of the teachers; revision","A4, A7","Material published; downloads reported","annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"The open classroom material of the course and its evaluation; training in educational communication; final report and assessment."}],"refs":{}},{"id":"f-JC2-01","group":"JC2","title":"JC2-01: Press relations and press releases on the center’s results","pages":2,"file":"JC2/JC2-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month science-journalism fellowship on the press relations of the center: press releases on the results of the work packages and lighthouses, media briefings with the researchers, relations with the communication offices of USP, Unicamp, Mackenzie and CNPEM and with the science desks of the press, and the media-coverage metrics of the Diffusion plan."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A6 assigns press relations to the communication plan run by the Diffusion Manager. The fellowship, supervised by the Knowledge Diffusion Coordinator at USP, provides a trained journalist for this task during the first years of the center, when its first results (QRNG module, entanglement link, spectrometer) become public. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-II, for holders of a higher-education degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Write and distribute press releases on the center’s results (target: one per month), coordinated with the journals’ embargoes and the institutional offices."},{"t":"p","x":"2. Prepare the researchers for interviews (briefing notes, key messages, media training session)."},{"t":"p","x":"3. Monitor and report media coverage; keep the press kit and the image bank up to date."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Editorial calendar linked to the publication pipeline of the work packages; fact-checking with the authors; joint work with the institu
