and gives a written opinion on which modules to prioritise and how to test them."},{"t":"p","x":"Module evaluation agreements. For each module (QRNG, QKD testbed, spectrometer, transducer prototype) the Innovation Manager negotiates an evaluation agreement with at least one partner: the partner receives the module and a test protocol, the center receives the field data and the requirements for the next generation. The QKD testbed on deployed fiber is the first such agreement (link owner to be confirmed: CPqD, RNP or the Unicamp campus network)."},{"t":"p","x":"Multi-user access to process modules. CCSNano is an academic nanofabrication facility, not a foundry, and already operates on a multi-user open-access model; the center adds multi-project-wafer (MPW) style runs on its SiN and TFLN processes, documented process design kits and a published schedule, so that companies and other groups can obtain devices without joining the center. This is also the mechanism by which the process modules transferred from the associates (poling, sputtered SiN, nanoprinted couplers) become available in Brazil."},{"t":"p","x":"Intellectual property and licensing. Intellectual property (IP) generated in the center is managed by the Unicamp Innovation Agency, the Agência USP de Inovação and the Mackenzie technology-transfer office (UPM-TTO) under the existing inter-institutional agreements, with FAPESP’s rules on IP for CEPIDs; inventions are evaluated for protection before publication through a fast-track procedure (two weeks) agreed with Inova Unicamp, and licensing follows the Agency’s standard terms, with preference for São Paulo companies and start-ups founded by members of the center."},{"t":"p","x":"Entrepreneurship and incubation. Fellows with an application-oriented project are routed through the Unicamp programs for student entrepreneurship (LIF Empreende, Inova’s pre-incubation) and the Incamp incubator; the center funds one entrepreneurship workshop per year within its school and reserves time in the annual meeting for start-up pitches to the IAB. The target for Phase 1 is at least one spin-off or license built on the QRNG or QKD modules."},{"t":"p","x":"Continuing education and workforce for industry. The center offers a yearly short course for industry professionals on integrated photonics and quantum technologies (design, fabrication, packaging, measurement), with hands-on sessions at CCSNano, and places MS and DD/DR fellows in internships with IAB companies. The technical-training (TT) fellows of the center are trained as process and cryogenics engineers, a profile directly employable by the industry."},{"t":"h1","x":"4. Feasibility and timeline","id":"s4"},{"t":"p","x":"Year Innovation deliverable Partner / instrument IAB constituted; IP fast-track agreed with Inova; process-documentation standard for CCSNano modules Innovation Manager Packaged QRNG module validated (NIST SP 800-22/90B), M1.2; first evaluation agreement;"},{"t":"p","x":"first industry short course telecom / security partner QKD evaluation testbed on deployed fiber (L1 threshold); SiN MPW-style run offered externally link owner; CCSNano users Chip spectrometer module in field trial with an agri-environmental partner; first license or spin-off decision sensing partner; Inova TFLN and packaging modules offered externally and reproduced by at least one group outside the center (Research Plan, Table 6); QRNG/QKD technology-transfer agreement; Phase-2 innovation roadmap with the IAB IAB; Agency 6–11 Transducer and network-node prototypes; sensing products with partners; the center as supplier of process modules in Brazil Phase 2 The feasibility of this plan rests on three existing assets: an open-access academic nanofabrication facility that already serves external users, a coordinator who has run the university’s innovation agency, and lighthouse experiments that are themselves prototypes of products (a random-number generator, a key-distribution link, a gas sensor). The Innovation Manager, allocated by the host institution, runs the agreements, the IAB and the IP procedure, and reports to the Executive Committee weekly. The indicators reported annually, aligned with the goals table of the Research Plan (Section 10), are: modules delivered against the schedule above; evaluation agreements signed and field data returned; external users of the CCSNano process modules and modules reproduced outside the center; invention disclosures, licenses and spin-offs; and participants in the industry course and internships. Phase-1 thresholds and goals, calibrated by the Innovation Coordinator: invention disclosures 10 / 15; priority filings 2 / 5 (PCT 2 / 4); licenses or options 1 / 3; agreements with companies and ICTs 5 / 8; foundry and packaging cycles 5 / 8, at least one per year with company participation; venture teams trained 12 / 20, of which funded or incorporated 2 / 4; graduates hired by partner companies 5 / 10; fellows with industrial or venture experience 40 % / 70 %; prototypes at TRL ≥5 at Year 5: 1 / 3; external innovation funding R$ 1 M / R$ 5 M."},{"t":"p","x":"[1] Inova Unicamp. https://en.inova.unicamp.br/annual-reports/. 2021."},{"t":"p","x":"[2] INCT-DQ. https://pages.cnpem.br/inct- dq/programa- spin- off- quantico/."},{"t":"p","x":"2026."}],"refs":{}},{"id":"diffusion_plan","group":"documents","title":"Knowledge Diffusion Action Plan","pages":3,"file":"documents/diffusion_plan.pdf","blocks":[{"t":"h1","x":"1. Objectives","id":"s1"},{"t":"p","x":"The Diffusion plan of PHOQUS has three objectives, agreed by the Executive Committee with the Knowledge Diffusion Coordinator. First, to inspire the next generation of scientists at a moment in which artificial intelligence is changing what it means to learn and to do research, by showing young people laboratories in which questions are still open and hands still matter. Second, to communicate science to society at large as a cultural good and not only as a utility, using the center’s own experiments (light that is quantum, chips that carry it, cryptographic keys that no eavesdropper can read) as the thread. Third, to show that a photonics industry already exists in Brazil, how it grew out of decades of research in São Paulo, and how quantum technologies continue that path, so that students see a career and the public sees a return on investment. The plan serves the mission of the center (Research Plan, Section 1), which joins research, innovation and training in one platform: diffusion is derived from the research; the lighthouse experiments (the four flagship demonstrations of the Research Plan, three of which are shown in Fig. 1) are designed to be widely displayed, the discovery-track results of the work packages feed the communication actions as they appear, and every fellow of the center takes part in at least one diffusion action per year."},{"t":"fig","x":["A1 PHOQUS School: annual","two-week school, 40–60 students,","half from outside SP; notes and","recordings open","A7 Pipeline and inclusion: IC","→MS →DD/DR, calls directed","at public-school and under-","represented students; alumni","tracking","A3 Itinerant exhibition: ten in-","teractive stations with a science-","museum partner; 4 venues/yr","from Year 3","A6 Media: website with the","roadmap in plain language,","monthly piece, Mídia Ciência, an-","nual Noite da Luz Quântica","A2 Quantum-light visit circuit:","CCSNano, IFGW and USP labs;","40 visits, 1500 students/yr from","Year 2; JC fellows as guides","A4 Teacher training: yearly","course, 60 physics teachers,","classroom material","A5 Open material: AI-assisted","interactive applets on photons,","interference, entanglement,","squeezing and randomness, re-","viewed by the team, open license;","used in A1–A4 and undergradu-","ate courses","Students and young researchers","General public","Schools and teachers","Everyone, in Portuguese and English","What the research supplies","QRNG chip: true ran-","domness is physical","Entanglement link: a key","no eavesdropper reads","Gas-sensing spectrometer:","quantum light measures better","discovery-track results","(S1, S2, . . . ); open data","and process recipes","every fellow: ≥1 diffu-","sion action per year","Timeline","Year 1","website, material","standard, first school","Year 2","visit circuit,","teacher course","Year 3","exhibition, Mídia","Ciência project","Years 4–5","consolidation; external","evaluation by the IAC","Phase 2","exhibition and course","offered nationally via","the INCT networks","Metrics (an-","nual report)","students, teachers, vis-","itors, downloads, me-","dia, alumni destination"]},{"t":"cap","x":"Figure 1: The diffusion plan: the three lighthouse demonstrations (the quantum random-number generator of QPC-1, the entanglement link of L1 and the gas-sensing spectrometer of L3) and the discovery-track results are the thread of actions A1–A7, organized by audience, with the Years 1–5 timeline and the metrics reported annually."},{"t":"h1","x":"2. Documented experience of the team","id":"s2"},{"t":"p","x":"The Knowledge Diffusion Coordinator, Paulo A. Nussenzveig (IF-USP), has a long record in science communication and university governance. He contributes to science-popularization outlets such as Ciência Hoje and Jornal da USP, hosted the radio program Ciência e Cientistas on Rádio USP from 2018 to 2022, co-authored the monthly column Caminhos da Inovação in Folha de S. Paulo online, and received a special mention in the 2021 Nature Awards for Mentoring in Science. He was Provost for Research and Innovation of the University of São Paulo from 2022 to 2026, a term in which the university’s innovation policy was revised and the USP Office for Research Integrity and Protection was created, a structure that underpins the innovation and entrepreneurship activities of the university community as well as its international cooperation in research and innovation; this experience in institution-wide research policy and public communication informs the design of the diffusion and training actions below. The team organizes the São Paulo School of Advanced Science on quantum photonics and nonlinear optics (SPSAS, FAPESP 25/08613-9, Nov–Dec 2026, coordinated by the Vice-Director), a two-week international school with lectures and laboratory sessions, and has run advanced schools and courses in photonics for more than a decade. Members participate in Unicamp’s and USP’s open-days (UPA, Unicamp de Portas Abertas; Virada Científica), in the Brazilian Physics Olympiad and in teacher-training programs; CC-SNano receives school and industry visits as part of its open-facility model; and the groups maintain active social-media and YouTube channels on photonics."},{"t":"h1","x":"3. Actions","id":"s3"},{"t":"p","x":"A1. The PHOQUS School. The two-week school in quantum optics and photonics becomes the center’s annual school, alternating between Campinas and São Paulo, with 40–60 students (half from outside São Paulo and Latin America), lectures by the team and the international associates, laboratory sessions on the lighthouse experiments, an entrepreneurship workshop with the Innovation plan, a public-speaking and science-communication session for the students, and a public lecture. Lecture notes and recordings are published openly."},{"t":"p","x":"A2. Laboratory visits and the \"quantum light\" circuit. Guided visits for secondary-school classes and teachers to CCSNano, the IFGW laboratories and the USP quantum-optics laboratory, organized as a circuit around three demonstrations: the random-number generator (why randomness is physical), the entanglement link (why a key can be unbreakable) and the gas-sensing spectrometer (why quantum light measures better). Target: 40 visits and 1500 students per year from Year 2, with priority to public schools, through the FAPESP Public Education Program (Ensino Público) where applicable. The research fellows act as guides after training; the science journalism (JC) fellows write the visit scripts and support material and run the visitor survey. A3. Itinerant exhibition on quantum light. A modular exhibition (ten interactive stations, including table-top versions of the three demonstrations and the AI-assisted applets of A5) built with a science museum partner, shown in science centers, schools and public events in the state, with the photonics-industry story (from optical fibers and telecom to quantum chips) as its second half. Target: four venues per year from Year 3. A4. Teacher training. A course offered every year (one edition per year, 40 hours) for secondary-school physics teachers on light, information and quantum technologies, with ready-to-use classroom material and the applets of A5, in partnership with the state education secretariat; 60 teachers per year."},{"t":"p","x":"A5. Open educational material and AI-assisted applets. A series of interactive applets on quantum-optics concepts (photons and detectors, interference, entanglement, squeezing, randomness), produced with AI assistance and reviewed by the team, published under an open license in Portuguese and English with short videos; the material is used in A2–A4 and in the undergraduate courses of the partner institutions. The role of AI in producing the material is stated openly and used as a topic in A1 and A4 (how to learn with these tools and what still has to be done by hand)."},{"t":"p","x":"A6. Media and public communication. A communication plan run by the Diffusion Manager: a center website with the lighthouse roadmap in plain language, a monthly piece on results and people, social-media presence, press relations with the institutions’ communication offices, participation in the FAPESP Mídia Ciência program, an annual public event (\"Noite da Luz Quântica\") at the annual meeting, and regular engagement with the science-communication and diffusion teams of the partner institutions through periodic coordination meetings."},{"t":"p","x":"A7. Training pipeline and inclusion. Undergraduate (IC) fellowships as the entry point, with calls directed at students from public schools and from under-represented groups; the MS fellowships as the second step; mentoring by the postdocs; and participation of fellows in A1–A6 as part of their activity plans. Every fellow is trained across at least two links of the chain (design, fabrication, packaging, quantum measurement), the annual training indicator of the Research Plan (Section 10), and the center tracks the destination of its alumni (academia, industry, start-ups) as a diffusion metric."},{"t":"h1","x":"4. Organization, metrics and timeline","id":"s4"},{"t":"p","x":"The Knowledge Diffusion Coordinator is a member of the Executive Committee and reports on the plan at every meeting; the Diffusion Manager, allocated by the host institution, runs the calendar, the partnerships (schools, museums, education secretariat, media) and the metrics. Metrics reported in the annual Scientific Report: number of students and teachers reached (A2, A4), school participants and their origin (A1), exhibition visitors (A3), downloads and views of the open material (A5, A6), media coverage, fellows trained across at least two links of the chain and the destination of alumni (A7). Timeline: Year 1, website, material standard and first school; Year 2, visit circuit and teacher course; Year 3, exhibition and Mídia Ciência project; Years 4–5, consolidation and external evaluation of the plan by the International Advisory Committee; Phase 2, the exhibition and the course offered nationally through the INCT networks. The budget of the plan (school, exhibition, material, travel of visiting lecturers) is part of the center’s operating request, and the science journalism (JC) and undergraduate (IC) fellows are engaged in it through their activity plans: sixteen JC fellowships (six JC-1, five JC-2, five JC-3; 12 months each) are requested, one per action A1–A7 and per product (website, press relations, exhibition content, school coverage, open material, metrics and evaluation), supervised by the Knowledge Diffusion Coordinator or the Director; ten IC fellowships (12 months) are the first step of A7."}],"refs":{}},{"id":"institutional_support","group":"documents","title":"Institutional Support and Costs","pages":1,"file":"documents/institutional_support.pdf","blocks":[{"t":"h1","x":"1. Host institution: Unicamp (Instituto de Física Gleb Wataghin)","id":"s1"},{"t":"p","x":"Physical space."},{"t":"p","x":"Management staff allocated by the host institution (call item 5). Executive Manager, Innovation Manager and Knowledge Diffusion Manager (full time, employed or assigned by Unicamp, approved by FAPESP), plus administrative support of the IFGW research office for procurement, import and reporting. Technical staff and facilities."},{"t":"p","x":"CCSNano and Photonicamp cleanroom technicians and process engineers (shared with other users; FTE assigned to the Center), the IFGW Cryogenics Facility staff (helium liquefaction, dilution-refrigerator operation), the MBE technician, the IT services (DTIC) for the electronic laboratory notebook, Git server and data storage of the Data Management Plan."},{"t":"p","x":"Faculty positions and young researchers."},{"t":"p","x":"Institutional services. Inova Unicamp (IP evaluation fast-track, licensing, incubation), the Pró-Reitoria de Pesquisa (research-center governance), the communication office (Diffusion plan), the Museu Exploratório de Ciências (exhibition partner, to be confirmed)."},{"t":"h1","x":"2. Partner institutions","id":"s2"},{"t":"p","x":"USP (Instituto de Física). Continuous-variable quantum-optics laboratory and the SNSPD system as shared facilities of the Center; space and support for the Knowledge Diffusion Coordinator;"},{"t":"p","x":"Mackenzie (MackGraphe). The project draws on MackGraphe, a dedicated unit of the Mackenzie institution complemented by the Escola de Engenharia Mackenzie: about 4,500 m2 in 31 laboratory spaces grouped in four facilities, of which Lab-MackFóton (photonics, optoelectronics and optical characterization, with ultrafast laser sources), Lab-MackNano (micro- and nanofabrication: cleanroom, laser direct-write lithography, reactive-ion etching, electron-beam evaporation, atomic-layer deposition, plasma treatment) and Lab-MackMateriais (CVD growth of graphene and other 2D materials, Bruker Dimension Icon AFM, WITec Alpha 300R confocal Raman with 488/532/633 nm excitation, SEM) serve NIP-3 and the 2D-material node of the shared fabrication pathway. The multi-user facilities are supported by 12 staff, five of them on characterization and processing equipment, plus one PhD-level technician allocated full time to Lab-MackFóton by the Escola de Engenharia. UFSCar (CCET). Low-vibration cryostat and spectrometer; heterostructure facility;"},{"t":"p","x":"UFABC (CCNH). Atomic magnetometry laboratory;"},{"t":"p","x":"CNPEM (LNNano). Open-facility access to lithography and microscopy;"},{"t":"p","x":"International associates. Hosting of BEPE fellows and process access (TFLN poling at Harvard, sputtered SiN at MPL Erlangen, 3D nanoprinting at IPHT Jena, transducer design at TU Delft, 2D nonlinear optics at FSU Jena) under the cooperation strategy of the Research Plan; valued in kind."},{"t":"h1","x":"3. Summary table","id":"s3"},{"t":"fig","x":["Item","Institution","Annual value (R$)","Laboratory and office space (m2)","Unicamp/IFGW","Executive, Innovation and Diffusion Managers","Unicamp","Administrative support (research office, import, finance)","Unicamp/IFGW","Cleanroom technicians and process engineers (FTE)","Unicamp (CCSNano, Photonicamp)","Cryogenics Facility staff and helium plant operation","Unicamp/IFGW","Maintenance contracts (EBL, ICP, MBE, cryostats)","Unicamp","IT, storage and data repository","Unicamp (DTIC)","Partner laboratories and staff","USP, Mackenzie, UFSCar, UFABC, CNPEM","Total institutional counterpart"]}],"refs":{}},{"id":"other_support","group":"documents","title":"Other Current and Expected Support","pages":2,"file":"documents/other_support.pdf","blocks":[{"t":"h1","x":"1. Current FAPESP research grants of the team with content adjacent to the Center","id":"s1"},{"t":"p","x":"The table lists the active grants of the Principal Investigator (PR), the Principal Investigators (PP) and the Associate Researchers (PA), what each funds and what the Center adds; the same delimitation appears in Section 2.4 of the Research Plan. None of these grants funds the integration program of the Center (shared fabrication pathway, packaging, lighthouse experiments, convergence milestones)."},{"t":"fig","x":["Grant (holder, period)","Funds","PHOQUS adds","Regular 25/10683-5","(Wiederhecker, PR;","12/2025–11/2028)","Nonlinear and quantum photonics in","microresonator arrays","Quantum-light sources on those arrays,","packaging and field use (L1, L2)","Regular 25/17579-9 (de","Matos, PP;","02/2026–01/2029)","Photo-induced chirality in nanophotonic devices","2D χ(2) elements on SiN for L1/L2 (NIP-3)","Visiting Researcher","26/02105-4 (de Matos, PP;","08/2026–07/2027)","Hybrid microwave–optical adapters for corrosion","sensing","None (ends in Year 1); contact for sensing","partners","Thematic 22/09436-5","(Martinelli, PP;","04/2023–03/2028)","Information in quantum optics (USP CV bench)","Chip squeezers and on-chip readout (QPC-2, L2)","Thematic FAPESP/FAPERJ","25/23232-1 (Martinelli, PP,","with Barros)","Quantum optics with structured and squeezed","light","CV sources and tomography protocols (QPC-2)","FAPESP 25/17324-0","(Deneke, PP; Regular)","III–V heterostructures for devices in quantum","information and photonics","Epitaxial QD heterostructures (NIP-4)","FAPESP 25/15490-0","QuantaNet (Frateschi, PP;","coordinator C. Villas Boas)","Academia–industry network for testing quantum","technologies","Evaluation partners for the QRNG/QKD modules","(Innovation plan)","FAPESP/FAPERJ","25/23157-0 TRAP-Q","(Frateschi, PP; coordinator","Alegre)","Trapping and control in condensed matter","Superconducting and cryogenic circuits","(QEPS-2)","JP2 21/06803-4 (Couto, PP;","02/2022–01/2027)","Acoustic modulation of excitonic dynamics in","vdW materials","SAW and cryogenic cross-cutting platform","(XC-1)","SPSAS 25/08613-9 (Alegre,","PP; 11–12/2026)","School in quantum and nonlinear photonics","Becomes the annual PHOQUS school (Diffusion","plan)","QuTIa JP 24/08450-0","(Barros, PA;","12/2024–11/2029)","Structured light for quantum technologies","Integrated sources of structured states (QPC-2)","QuTIa JP 24/08455-1","(Benevides, PA;","12/2024–11/2029)","Modular microwave–optical transduction","LN-on-Si transducer and SC-circuit link","(QEPS-2, L4)","QuTIa JP 24/08522-0","(Florez, PA;","01/2025–12/2029)","Vector atomic magnetometer with squeezed light","Chip-integrated magnetometry (QEPS-3, H2)","QuTIa JP 24/08527-2","(Covre da Silva, PA;","04/2025–03/2030)","Telecom single-photon sources","Waveguide integration and the QD track of L1","(NIP-4)","JP 21/14303-1 (Marques,","PA; 02/2023–01/2028)","Photonic chips for quantum-information","protocols","Fabrication at CCSNano; QRNG/QKD chain","(QPC-1)","Initial Project 22/03035-9","(Siqueira, PA;","02/2023–01/2027)","VUV and THz sources for spectroscopy","Spectral extension of L3 (QEPS-1)","Regular 25/11708-1","(Gobato, PA;","11/2025–10/2028)","Twisted magnetic CrSBr heterostructures","2D emitters (NIP-4)"]},{"t":"p","x":"Grants ending before June 2027 (Regular 24/02289-2, Wiederhecker; JP 18/03474-7, Barbosa) are not concurrent with the Center."},{"t":"h1","x":"2. Current multi-user equipment grants (infrastructure available to the Center)","id":"s2"},{"t":"p","x":"EMU 22/11526-2 (Frateschi; 100 kV electron-beam lithography, to 07/2030); EMU 20/08163-0 and 20/07393-1 (Frateschi; mid-infrared microscope module, film-thickness mapping, to 10/2027); EMU 22/13838-1 (Cruz; scientific instrumentation for combs and spectroscopy, to 07/2030); EMU 23/17024-1 (Couto; helium liquefaction, IFGW Cryogenics Facility, to 08/2027); EMU 23/12741-7 (Alegre; 20 GHz vector network analyzer, to 11/2030); EMU 25/03500-1 (Barros, USP; SNSPD system, to 04/2032); EMU 25/08511-1 (Benevides, USP; dilution refrigerator, to 06/2032); EMU 25/06758-0 (Covre da Silva; MBE system, to 06/2032); EMU 20/01987-7 (Barbosa, USP; chemical-mechanical polisher, to 08/2027); EMU 23/17080-9 (Gobato, UFSCar; low-vibration cryostat and spectrometer, to 08/2027). These grants fund the equipment; the Center funds its operation for the program, the shared technical staff and the missing links (Research Plan, Section 6). The Center requests complementary equipment only where these systems do not reach (SAGe budget)."},{"t":"h1","x":"3. Other current support","id":"s3"},{"t":"p","x":"AFOSR grant FA9550-24-1-0018 (Cruz; combs and spectroscopy) ; CNPq 422316/2023-7 (Frateschi, PP; 2023–2026; QKD transceiver and QRNG for commercial applications, coordinator C. Villas Boas; R$ 2.95 M) and CNPq INCT-DQ 208783/2024-0 (Frateschi); FINEP Proinfra 01.25.0507.00 (Mackenzie, 06/2025–06/2027; R$ 12.65 M for the recovery and upgrade of the MackGraphe processing and characterization equipment relevant to NIP-3: confocal Raman, AFM, reactive-ion etcher, direct-write lithography); EMU 23/17024-1 (Couto; cryogenic liquids and facility operation, to 08/2027); Marie Skłodowska-Curie fellowship of N. Tomázio at Leibniz IPHT Jena (3D nanoprinted couplers) ; FAPESP BEPE fellowships of Unicamp students in the Del’Haye (25/20846-9, 25/04049-1) and Gröblacher groups and the Lončar group (22/11486-0); industrial collaboration with Corning Inc. on fiber–chip coupling ; INCT-DQ (CNPEM) and INCT-IQ participation of team members ; institutional support of Unicamp, USP, Mackenzie, UFSCar, UFABC and CNPEM (Institutional Support document)."},{"t":"h1","x":"4. Expected support","id":"s4"},{"t":"p","x":"FAPESP Young Investigator grants to be applied for by postdocs of the Center (Management plan, item d); BEPE fellowships for the DD/DR fellows’ stays with the associates (one per fellow); renewal or successor grants of the QuTIa initiative; participation in Horizon Europe and NSF projects through the associates (Quantum Flagship, NSF CQN) as the São Paulo node; CNPq/MCTI calls of the Brazilian Quantum Technologies Initiative (IBTEQ); industrial evaluation agreements and licenses from the Innovation plan (QRNG, QKD testbed, spectrometer modules); and FAPESP Mídia Ciência and Public Education Program projects of the Diffusion plan. None of the expected support is counted in the Center’s budget."}],"refs":{}},{"id":"data_management_plan","group":"documents","title":"Data Management Plan","pages":2,"file":"documents/data_management_plan.pdf","blocks":[{"t":"h1","x":"1. Data generated by the Center","id":"s1"},{"t":"p","x":"PHOQUS produces five classes of data, all of them tied to the work packages and lighthouses of the Research Plan. (i) Design data: device layouts (GDS), simulation inputs and results (dispersion, mode, finite-element and nonlinear models), and process design kits of the CCSNano SiN and TFLN modules. (ii) Fabrication and process records: run sheets, recipes, metrology (thickness, roughness, Q and loss statistics per wafer), MBE growth logs and 2D-material transfer records, kept in an electronic laboratory notebook. (iii) Measurement data: raw and processed optical, quantum-optical, microwave and cryogenic measurements (spectra, photon-counting time tags, homodyne traces, dual-comb interferograms, transducer S-parameters and noise), with the calibration data (shot-noise references, detector efficiencies, facet losses) that the center’s shared protocols require. (iv) Software: analysis code, instrument control and the shared protocol implementations. (v) Management and diffusion data: milestone tracking, the loss and noise budgets of the lighthouses, fellowship records, and the educational material and metrics of the Diffusion plan. Typical volumes are tens of gigabytes per year for time-tagged photon-counting data and interferograms, and a few gigabytes per year for the rest. Field-test data of L1 (deployed fiber) may include network metadata of the link owner."},{"t":"h1","x":"2. Organization, formats and documentation","id":"s2"},{"t":"p","x":"Every dataset carries the identifier of the work package and lighthouse it belongs to (e.g. QPC-2/L2) and of the fellowship that produced it, and is described by a metadata record (instrument, calibration, chip and wafer identifiers, protocol version, operator, date). Formats are open where they exist: GDSII/OASIS for layouts, HDF5 or NetCDF for measurement data with embedded metadata, CSV for tables, PDF/A for documents, and Git repositories for code and notebooks. The center’s shared protocols (source metrics, squeezing, loss budget, comb noise, transduction efficiency) define the mandatory fields of each measurement class, so that results from different groups and institutions are comparable; this is a condition of the convergence the center is built on."},{"t":"h1","x":"3. Storage, preservation and access","id":"s3"},{"t":"p","x":"During the project, data are stored on the institutional storage of the host and partner institutions with daily backup, and shared among members through a center-wide electronic laboratory notebook and a Git server hosted by the Unicamp IT services (DTIC). Datasets that support a publication, a milestone report or a decision point are deposited, at the latest at publication, in an open repository with a persistent identifier (DOI): the Unicamp institutional research-data repository (REDU) or a disciplinary repository such as Zenodo, with the metadata record of Section 2 and a README. Software is released under an open license (MIT or GPL) on GitHub with a DOI through Zenodo. Datasets are preserved for at least ten years after the end of the project, in line with FAPESP’s guidelines, and the annual Scientific Report lists the datasets deposited in the year. Access is open by default (CC-BY for data and material); exceptions are listed below."},{"t":"h1","x":"4. Ethical, legal and confidentiality aspects","id":"s4"},{"t":"p","x":"The center produces no personal or sensitive data in its research; the only personal data are those of the fellows and visitors (Diffusion plan metrics), handled under the LGPD by the host institution’s rules and reported only in aggregate. Three classes of data may be embargoed: (i) data that support an invention under evaluation for protection, embargoed until filing (fast-track of two weeks agreed with the Innovation Agency), then released; (ii) data covered by a partnership or evaluation agreement with a company or link owner (Innovation plan), released as agreed in the contract and at the latest at publication of the corresponding result; (iii) process recipes of CCSNano that are part of a licensed module, which are documented in the foundry-style process design kit at the level needed to use the module, with the detailed recipe kept as a trade secret under the institution’s policy. Export-control and dual-use aspects of quantum-communication hardware are reviewed by the Innovation Manager before any transfer abroad. No data originate from human or animal subjects."},{"t":"h1","x":"5. Responsibilities","id":"s5"},{"t":"p","x":"The Executive Manager is the data steward of the center and keeps the registry of datasets, protocols and embargoes; each work-package lead is responsible for the compliance of its datasets and each fellowship plan includes data deposition among its deliverables; the Vice-Director reviews the plan yearly with the International Advisory Committee. The plan is published on the center’s website and revised at the Year-3 and Year-5 evaluations."}],"refs":{}},{"id":"f-NIP-1_PD1","group":"PD","title":"NIP-1 PD1: High-Q SiN process baseline and Kerr/EO comb sources for the L3 dual-comb spectrometer","pages":2,"file":"PD/NIP-1_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc owns the SiN process baseline of the center and the Kerr and electro-optic comb sources that feed L3. In the first year the postdoc releases the baseline (Qi ≥5 × 106, loss statistics over three wafers, M1.1) to all branches; afterwards the postdoc develops low-noise microcombs and the 20 GHz EO comb as the comb pair of the dual-comb spectrometer, and co-supervises the DD and MS fellows of NIP-1."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-1, Kerr and electro-optic combs, DOPO in coupled microresonators, of the PHOQUS Research Plan, and serves L1 (SiN pair source), L2 (SiN Kerr squeezing track) and L3 (chip combs). The work package is defined as follows. Coupled SiN microresonators (photonic molecules) give independent control of dispersion and mode hybridization, which we use to select degenerate parametric oscillation and suppress competing processes [1, 2]. NIP-1 delivers (i) high-Q SiN rings for SFWM pair generation (L1), (ii) dispersion-engineered resonators for Kerr squeezing (L2, SiN track), and (iii) Kerr and EO combs for dual-comb spectroscopy (L3), including spectral extension to the blue and UV [3]."},{"t":"p","x":"Starting point. To what extent do engineered coupling and hybridization in photonic molecules give independent control of parametric pathways and multimode quantum correlations beyond a matched single-resonator baseline (H-A)? Observable: squeezing spectra, quadrature covariances and mode correlations versus coupling and detuning, against quantitative coupled-mode predictions and control devices."},{"t":"p","x":"Metric moved by this fellowship. Tunable DOPO, mapping of nonlinear mode interactions and hybridized-band oscillation in coupled SiN resonators [4–6]; color symmetry breaking with MPL [7]; dispersion engineering of high-Q resonators [8]; visible-to-telecom parametric oscillation in CMOS-compatible OPOs [9, 10] and tunable squeezing in coupled SiN rings [11]; 20 GHz resonant EO comb across the S/C/L bands and mid-IR χ(2) combs [12, 13]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Release and maintain the SiN process baseline (M1.1) with documented yield and loss statistics."},{"t":"p","x":"2. Demonstrate a SiN dual-comb pair (two microcombs with offset repetition rates) with relative intensity noise below shot noise in the detection band required by QEPS-1."},{"t":"p","x":"3. Extend comb coverage to the blue/UV and toward the mid-infrared as spectral sources for QEPS-1 [3]."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Process development at CCSNano (deposition, EBL, etching, annealing, cladding) with statistical process control; comb generation and noise characterization on the NIP-1 bench (optical spectrum, RF beat-note and RIN on the electrical spectrum analyzer); EO comb generation on TFLN with the Cruz laboratory. The postdoc defines the shared comb-noise protocol used by QEPS-1 to decide between chip and fiber combs at the Year-4 threshold."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","M1.1: baseline released, Qi and loss over ≥3 wafers","M1.1","First SiN dual-comb pair; comb-noise protocol adopted by QEPS-1","annual report Y2"]},{"t":"p","x":"Chip comb pair meeting the RIN budget of L3; UV/mid-IR extension demonstrated L3 preparation (Y4 threshold)"},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QEPS-1 (comb pair and noise budget), QPC-2 (resonators for the SiN squeezing track) and with the Cruz laboratory on EO combs; hosts the visits of the Del’Haye group for the sputtered-SiN transfer. Short research stays at MPL Erlangen are foreseen in Years 1–2."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"The process baseline document and the comb-noise protocol are center-level deliverables; two to three publications on comb sources; co-supervision of NIP-1 DD1 and MS1; participation in the center’s school as instructor on nonlinear integrated photonics."}],"refs":{"1":"Alexander K Vorobyev et al. Phys. Rev. Appl. 24 (2025), p. 054054.","2":"Ryotatsu Yanagimoto et al. Nature 649 (2026), pp. 330–337.","3":"Alekhya Ghosh et al. arXiv preprint arXiv:2603.03255 (2026).","4":"Nathalia B Tomazio et al. ACS Photon. 12 (1 2025), 227 – 235.","5":"Luca O. Trinchão et al. Optics Letters, 51 (6 2026), pp. 1387–1390.","6":"Luca O. Trinchão et al. APL Photon. 11.6 (2026).","7":"Luca O. Trinchão et al. Laser Photon. Rev. (2026).","8":"Marvyn Inga et al. APL Photon. 5.11 (2020).","9":"Renato R. Domeneguetti et al. Optica 8.3 (2021), pp. 316 –322.","10":"Yun Zhao et al. Optica 7.2 (2020), pp. 135 –141.","11":"Avik Dutt et al. Opt. Lett. 41.2 (2016), pp. 223–226.","12":"Marlon M. Correia et al. APL Photon. 11.6 (2026).","13":"Alexander J. Lind et al. Phys. Rev. Lett. 124 (13 2020)."}},{"id":"f-NIP-3_PD1","group":"PD","title":"NIP-3 PD1: Hybrid 2D-material pump-control elements (saturable absorbers and isolators) for quantum-light chips","pages":2,"file":"PD/NIP-3_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc develops the hybrid 2D-material elements that control the pump on quantum-light chips: saturable absorbers for pulse shaping and non-reciprocal elements (isolators) that protect sources from back-reflection, building on the group’s integrated saturable absorbers and the Bi2Te3 isolator [1, 2]."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-3, 2D materials: χ(2) media and hybrid nonlinear devices, of the PHOQUS Research Plan, and serves L1 (alternative SPDC source) and L2 (on-chip pump control). The work package is defined as follows. Transition-metal dichalcogenides integrated on SiN provide a χ(2) response on a centrosymmetric platform [3]. NIP-3 pursues waveguide-coupled SHG and SPDC with modal phase matching and quasi-phase-matching by patterned 2D layers, and 2D saturable absorbers and non-reciprocal elements for on-chip pump control."},{"t":"p","x":"Starting point. How do interface, crystal symmetry and optical confinement determine integrated χ(2) conversion in 2D materials on waveguides? Observable: calibrated conversion efficiency and phase matching versus layer geometry and orientation."},{"t":"p","x":"Metric moved by this fellowship. On-chip SHG in SiN waveguides integrated with MoS2 monolayers [3]; SHG enhancement in TMD monolayers on epsilon-near-zero substrates and nonlinear dynamics of layered TMDs [4, 5]; low-loss integrated circuits with layered semiconductors [6]; nonlinear frequency conversion in franckeite heterostructures [7]; hybrid 2D saturable absorbers in photonic integrated circuits [1, 8]; an all-photonic isolator from atomically thin Bi2Te3 [2]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Integrate 2D saturable absorbers and non-reciprocal layers on SiN and TFLN waveguides with insertion loss compatible with the center’s loss budget (≤0.5 dB)."},{"t":"p","x":"2. Demonstrate an on-chip isolator with ≥10 dB isolation at 1550 nm on a quantum-light chip."},{"t":"p","x":"3. Supervise NIP-3 DR1 jointly with the PP and coordinate the MackGraphe–CCSNano process interface."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Material growth and transfer at MackGraphe, device fabrication at CCSNano, loss and isolation measurements on the shared transmission bench, integration tests with NIP-1 sources."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","First hybrid elements with measured insertion loss","annual report Y1","Isolator at ≥10 dB; element on an L1/L2 chip","D1/D2","Elements adopted in the L2 Year-3 chip","L2-T"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1, QPC-2 and QPC-3; hosts the Soavi group exchanges."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; a documented 2D-material process module for the center; co-supervision of NIP-3 DR1."}],"refs":{"1":"Maria Carolina Volpato et al. J. Opt. Soc. Am. B 43.3 (2026), A200 –A205.","2":"Saswata Goswami et al. Nanoscale 18.21 (2026), pp. 11258 –11270.","3":"Mohd Rehan et al. ACS Photon. (2026).","4":"P.G. Vianna et al. Nanoscale Adv. 3 (1 2021), pp. 272–278.","5":"Melissa E. Maldonado et al. ACS Photon. 7.12 (2020), pp. 3440–3447.","6":"Jijun He et al. Nano Lett. 21.7 (2021), pp. 2709 –2718.","7":"Alisson R. Cadore et al. J. Appl. Phys. 135.8 (2024).","8":"Maria Carolina Volpato et al. Appl. Phys. Lett. 127.22 (2025)."}},{"id":"f-NIP-4_PD1","group":"PD","title":"NIP-4 PD1: MBE growth and processing of telecom-converted epitaxial QD sources on photonic chips","pages":2,"file":"PD/NIP-4_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc (device or optics background) leads the fabrication and integration of the epitaxial QD sources: membrane release and transfer of processed QD heterostructures onto SiN or TFLN circuits, cavity and waveguide processing at the CCSNano and DFA cleanrooms, SiN overgrowth where needed, and the hand-over of integrated sources to QPC-1; co-supervised with Louis (membrane transfer and waveguide coupling)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-4, Quantum emitters: from integrability to coherence, of the PHO-QUS Research Plan, and serves L1 (deterministic QD track) and the integrability–coherence program. The work package is defined as follows. NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols."},{"t":"p","x":"Starting point. What sets the trade-off between integrability and coherence across epitaxial, colloidal and 2D emitters coupled to the same resonator, and which material strategy (exciton band alignment, strain, shell engineering) gives high-purity, indistinguishable emission from colloidal nanomaterials? Observable: purity, linewidth, indistinguishability and extraction versus coupling and temperature, on one protocol. Metric moved by this fellowship. Epitaxial QDs: entanglement-based QKD with QD sources [1, 2], urban-network and teleportation experiments [3, 4], waveguide-integrated and cavity-enhanced sources [5, 6], and droplet-etched InGaAs QDs with Unicamp participation [7, 8]. Colloidal emitters: bright/dark exciton inversion in strain-graded QDs and lattice-distortion engineering of emission [9], optical gain by biexciton engineering and linewidth control in nanocrystals [10–12]; droplet-etched GaAs nanostructures grown at LNNano [13, 14]. 2D emitters: strain-engineered confinement and single-photon emitters in WSe2 [15–17]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Establish the process pipeline from grown heterostructure to integrated device: hyperspectral pre-selection, membrane release and transfer, cavity and waveguide processing, overgrowth."},{"t":"p","x":"2. Deliver cavity-integrated and waveguide-coupled QD sources and measure their extraction efficiency and indistinguishability with the center’s source protocol."},{"t":"p","x":"3. Co-supervise NIP-4 DD1 and MS1 and coordinate the process plan with CCSNano, DFA and the Louis laboratory."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Nanofabrication (membranes, transfer, cavities), optical characterization, process records shared under the Data Management Plan."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Membrane transfer of QD heterostructures onto SiN demonstrated","annual report Y1","Cavity-integrated sources","D1","Waveguide-coupled source delivered to QPC-1","L1-T"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with CCSNano, DFA, the Louis laboratory and XC-1; exchanges with the Linz network."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Publications on integration; the QD membrane-transfer process module of the center; co-supervision."}],"refs":{"1":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","2":"Christian Schimpf et al. Adv. Photon. 3.6 (2021).","3":"Gonzalo Carvacho et al. Optica 9.5 (2022), pp. 572–578.","4":"Alessandro Laneve et al. Nat. Commun. 16.1 (2025).","5":"Florian Hornung et al. Nano Lett. 24.4 (2024), pp. 1184–1190.","6":"Michele B. Rota et al. eLight 4.1 (2024).","7":"Saimon F. Covre Da Silva et al. Nano Lett. 26.3 (2026), pp. 953–960.","8":"Evandro Martin Lanzoni et al. Nanotechnology 33.16 (2022).","9":"Jeong Woo Park et al. Nat. Commun. 17.1 (2026).","10":"Gabriel Nagamine et al. ACS Photon. 7.8 (2020), pp. 2252 –2264.","11":"Albert Liu et al. ACS Nano 15.4 (2021), pp. 6499 –6506.","12":"Albert Liu et al. Sci. Adv. 7.1 (2021).","13":"Saimon Filipe Covre da Silva et al. Nanoscale Res. Lett. 12 (2017), p. 61.","14":"Vanessa Orsi Gordo et al. Nanotechnology 31 (2020), p. 255202.","15":"Caique Serati De Brito et al. Appl. Phys. Lett. 121.7 (2022).","16":"Caique Serati de Brito et al. Nano Lett. 24.42 (2024), pp. 13300 –13306.","17":"F.S. Covre et al. Nanoscale 14.15 (2022), pp. 5758 –5768."}},{"id":"f-NIP-4_PD2","group":"PD","title":"NIP-4 PD2: Linewidth engineering and coherent spectroscopy of resonator-coupled nanocrystal emitters","pages":2,"file":"PD/NIP-4_PD2_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc leads linewidth engineering and coherent spectroscopy of resonator-coupled nanocrystal emitters, the colloidal end of the integrability–coherence axis, and supervises the deposition and cryogenic characterization campaigns."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-4, Quantum emitters: from integrability to coherence, of the PHO-QUS Research Plan, and serves L1 (deterministic QD track) and the integrability–coherence program. The work package is defined as follows. NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols."},{"t":"p","x":"Starting point. What sets the trade-off between integrability and coherence across epitaxial, colloidal and 2D emitters coupled to the same resonator, and which material strategy (exciton band alignment, strain, shell engineering) gives high-purity, indistinguishable emission from colloidal nanomaterials? Observable: purity, linewidth, indistinguishability and extraction versus coupling and temperature, on one protocol. Metric moved by this fellowship. Epitaxial QDs: entanglement-based QKD with QD sources [1, 2], urban-network and teleportation experiments [3, 4], waveguide-integrated and cavity-enhanced sources [5, 6], and droplet-etched InGaAs QDs with Unicamp participation [7, 8]. Colloidal emitters: bright/dark exciton inversion in strain-graded QDs and lattice-distortion engineering of emission [9], optical gain by biexciton engineering and linewidth control in nanocrystals [10–12]; droplet-etched GaAs nanostructures grown at LNNano [13, 14]. 2D emitters: strain-engineered confinement and single-photon emitters in WSe2 [15–17]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Quantify dephasing and spectral diffusion of resonator-coupled nanocrystals at 4 K and identify the dominant mechanisms."},{"t":"p","x":"2. Demonstrate Purcell-enhanced, narrowed emission in a SiN resonator and measure g(2)(0)."},{"t":"p","x":"3. Co-supervise NIP-4 DR1 and MS1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Multidimensional coherent spectroscopy, photon-correlation measurements, nanocrystal synthesis [12]. Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Dephasing mechanisms identified","Purcell-narrowed emission","D1","Benchmark published"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 and XC-1."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Publications; co-supervision; the colloidal-emitter protocol of the center."}],"refs":{"1":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","2":"Christian Schimpf et al. Adv. Photon. 3.6 (2021).","3":"Gonzalo Carvacho et al. Optica 9.5 (2022), pp. 572–578.","4":"Alessandro Laneve et al. Nat. Commun. 16.1 (2025).","5":"Florian Hornung et al. Nano Lett. 24.4 (2024), pp. 1184–1190.","6":"Michele B. Rota et al. eLight 4.1 (2024).","7":"Saimon F. Covre Da Silva et al. Nano Lett. 26.3 (2026), pp. 953–960.","8":"Evandro Martin Lanzoni et al. Nanotechnology 33.16 (2022).","9":"Jeong Woo Park et al. Nat. Commun. 17.1 (2026).","10":"Gabriel Nagamine et al. ACS Photon. 7.8 (2020), pp. 2252 –2264.","11":"Albert Liu et al. ACS Nano 15.4 (2021), pp. 6499 –6506.","12":"Albert Liu et al. Sci. Adv. 7.1 (2021).","13":"Saimon Filipe Covre da Silva et al. Nanoscale Res. Lett. 12 (2017), p. 61.","14":"Vanessa Orsi Gordo et al. Nanotechnology 31 (2020), p. 255202.","15":"Caique Serati De Brito et al. Appl. Phys. Lett. 121.7 (2022).","16":"Caique Serati de Brito et al. Nano Lett. 24.42 (2024), pp. 13300 –13306.","17":"F.S. Covre et al. Nanoscale 14.15 (2022), pp. 5758 –5768."}},{"id":"f-QEPS-1_PD1","group":"PD","title":"QEPS-1 PD1: Mid-infrared extension of the dual-comb spectrometer by difference-frequency generation","pages":2,"file":"PD/QEPS-1_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc extends the L3 spectrometer to the mid-infrared by difference-frequency generation in GaP/GaAs and TFLN, where molecular fingerprints are strongest, and leads the comb-noise and detection engineering that makes the quantum advantage visible [1, 2]."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-1, Squeezed dual-comb spectroscopy, of the PHOQUS Research Plan, and serves L3 (squeezed dual-comb spectrometer). The work package is defined as follows. QEPS-1 owns the L3 lighthouse. It builds a dual-comb spectrometer seeded by the L2 squeezed light, first with fiber or EO combs and then with chip combs from NIP-1, and extends coverage to the mid-infrared and THz by difference-frequency generation in GaP/GaAs and TFLN [3]. Its primary scientific output is a controlled test of whether frequency-dependent squeezing and multimode correlations give a statistically significant concentration-estimation advantage once mode matching, comb technical noise, transmission and detection losses are included: mode-resolved covariance data, a resource-matched classical control and estimator-level precision."},{"t":"p","x":"Starting point. Under which resource constraints does a non-classical optical resource yield a net task-level estimation advantage in broadband multimode spectroscopy (H-B)? Observable: Fisher information or concentration precision against a resource-matched optimized classical reference."},{"t":"p","x":"Metric moved by this fellowship. Mid-IR comb generation and spectroscopy with χ(2) optics and suspended-Si waveguides [1, 2]; free-running 1 GHz dual-comb laser and 20 GHz EO comb [4, 5]; methane and CO sensing in hollow-core fiber [6]; near-infrared dual-comb spectroscopy with multipass cells targeting N2O, starting at USP in early 2027."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Demonstrate mid-infrared comb generation by DFG from the near-infrared comb pair with sufficient power for DCS."},{"t":"p","x":"2. Establish the shot-noise-limited detection chain in the mid-infrared."},{"t":"p","x":"3. Co-supervise QEPS-1 DD1 and MS1 and run the L3 campaign with QPC-2."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Nonlinear frequency conversion, mid-IR detection, dual-comb signal processing."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Mid-IR DFG comb","Mid-IR DCS of a target gas","Mid-IR chain ready for the squeezed-light test","L3 goal path"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 (chip combs) and QPC-2 (squeezing); exchanges with the Del’Haye group."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"fig","x":["Publications; the mid-IR extension; co-supervision.","References","[1]","Alexander J. Lind et al. Phys. Rev. Lett. 124 (13 2020).","[2]","Nima Nader et al. Optica, 6 (10 2019), pp. 1269–1276.","[3]","Daniel I. Herman et al. Science 387 (6734 2025), pp. 653–658.","[4]","Marlon M Correia et al. (2026).","[5]","Marlon M. Correia et al. APL Photon. 11.6 (2026).","[6]"]},{"t":"p","x":"Artur de Araujo Silva et al. J. Opt. Soc. Am. B 40.4 (2023), pp. C21 –C27."}],"refs":{}},{"id":"f-QEPS-2_PD1","group":"PD","title":"QEPS-2 PD1: Superconducting-circuit interface and added-noise characterization of the L4 transducer","pages":2,"file":"PD/QEPS-2_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc builds the superconducting-circuit interface of L4 and the calibrated added-noise measurement: circuit design and fabrication at Unicamp, cryogenic microwave chain, noise thermometry and the pulsed protocol that keeps nadd low."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-2, Piezo-optomechanical microwave–optical transduction, of the PHOQUS Research Plan, and serves L4 (microwave–optical transducer). The work package is defined as follows. QEPS-2 owns the L4 lighthouse. It develops lithium-niobate-on-silicon and diamond optomechanical crystals operated in the sideband-resolved regime at millikelvin temperatures, and couples them to superconducting circuits fabricated at Unicamp."},{"t":"p","x":"Starting point. How do piezo-optomechanical coupling, cryogenic dissipation and optically induced heating constrain coherent transfer of quantum information between microwave and optical fields (H-C)? Observable: non-classical correlations or state-transfer fidelity beyond η and nadd."},{"t":"p","x":"Metric moved by this fellowship. Optomechanical quantum teleportation and low-noise single phonon–photon conversion with Delft [1, 2]; dissipative optomechanics at GHz [3]; high-rate photon–phonon pairs in 2D optomechanical crystals [4]; diamond optomechanical crystal design [5]; quasiparticle dynamics of optically irradiated qubits and loss in mechanical resonators coupled to superconducting circuits (Benevides) [6, 7]; reproducible Josephson-junction fabrication by e-beam lithography (Rouxinol) [8]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design and fabricate the superconducting resonator and qubit chips and the wiring to the transducer."},{"t":"p","x":"2. Calibrate the microwave chain (gain, noise temperature) and measure nadd referred to the input."},{"t":"p","x":"3. Co-supervise QEPS-2 DR1 and MS1 and coordinate the dilution-refrigerator schedule with XC-1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Superconducting-circuit fabrication, microwave measurements, pulsed optomechanics protocols [6, 7]. Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","SC resonator chips; chain calibrated","Transducer–resonator coupling measured","nadd measured in pulsed operation","L4-T path"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with Rouxinol’s group and XC-1; exchanges with Delft."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"fig","x":["Publications; the SC-circuit interface module; co-supervision.","References","[1]","Niccolò Fiaschi et al. Nat. Photon. 15.11 (2021), pp. 817 –821.","[2]","Liu Chen et al. Nat. Commun. 17 (1 2026), pp. 1187–.","[3]","André G Primo et al. Nat. Commun. 14 (1 2023), p. 5793.","[4]","Felix M. Mayor et al. Nat. Commun. 16 (1 2025), pp. 2576–.","[5]"]},{"t":"p","x":"Flávio Moraes et al. J. Opt. Soc. Am. B 39.10 (2022), pp. 2735–2741."},{"t":"fig","x":["[6]","R. Benevides et al. Phys. Rev. Lett. 133.6 (2024).","[7]","Raquel Garcia-Belles et al. PRX Quantum 7.3 (2026).","[8]","Arthur M. Rebello et al. Nanomaterials 14.9 (2024)."]}],"refs":{}},{"id":"f-QPC-1_PD1","group":"PD","title":"QPC-1 PD1: DOPO-based quantum random-number generator chip and its NIST validation (M1.2)","pages":2,"file":"PD/QPC-1_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc delivers the QRNG chip, the center’s first innovation deliverable (M1.2, month 24): an integrated balanced-homodyne receiver sampling vacuum fluctuations as the entropy source [1], the same receiver that serves key reception in L1, with the binary phase states of the NIP-1 degenerate OPO [2] as an alternative source; packaged with its electronics and validated with the NIST SP 800-22 and 90B suites. The receiver work also develops single-photon detection for the discrete-variable protocols of L1."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-1, Chip QKD transmitters and QRNG, of the PHOQUS Research Plan, and serves L1 (receiver chain and field test) and the QRNG module M1.2. The work package is defined as follows. QPC-1 develops the QRNG chip (Year-2 deliverable) and then the chip QKD transmitter and receiver chain, including time-bin analyzers, for the L1 field test [3, 4]. Published chip QRNGs already reach 18.8–100 Gbit/s [5, 6], so QPC-1 does not compete on bit rate: its target is a certifiable entropy source fabricated and packaged in Brazil and validated on a national testbed. The QRNG is based on integrated balanced-homodyne detection of vacuum fluctuations [1], the same receiver used for key reception, with the binary phase states of the NIP-1 degenerate OPO as an alternative entropy source [7, 8]; the receiver chain also develops single-photon detection for the discrete-variable protocols of L1."},{"t":"p","x":"Starting point. How do source and receiver imperfections propagate into certified randomness and finite-key security? Observable: entropy certification and finite-key rate as functions of measured imperfections. Metric moved by this fellowship. First chip-QRNG result of the team [9]; the route builds on its integrated homodyne receivers and, as an alternative, on the in-house tunable DOPO [2]. QKD: entanglement-based QKD with QD sources, including daylight operation [10, 11]; device-independent tests and randomness-relevant protocols (Marques) [12, 13]; transfer-matrix modeling of multiport integrated beam splitters and photonic molecules [14, 15]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design the integrated homodyne entropy source and its readout; quantify entropy rate, bias and side channels with a physical model of the vacuum-noise sampling (and of the DOPO phase-state alternative)."},{"t":"p","x":"2. Package the module (chip, pump, detection, FPGA post-processing) and pass NIST SP 800-22/90B validation."},{"t":"p","x":"3. Hand the module to the Innovation Coordinator for external evaluation and co-supervise QPC-1 MS1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Integrated balanced-homodyne detection, randomness extraction and statistical testing, module packaging with QPC-3, comparison with the DOPO phase-state alternative on the NIP-1 bench; single-photon detector integration for the L1 receivers."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Homodyne entropy source characterized; entropy rate model","annual report Y1","Packaged QRNG module validated (NIST suites)","M1.2"]},{"t":"p","x":"Module in external evaluation; second generation with on-chip detection Innovation plan 6. Integration, infrastructure and international exchange Works with QPC-2 (homodyne detection), NIP-1 (DOPO alternative), QPC-3 (packaging), the Innovation Coordinator and the Industry Advisory Board."},{"t":"h1","x":"7. Expected results and training","id":"s6"},{"t":"p","x":"Two publications; the QRNG module and its test report; a licensing or spin-off route explored with Inova Unicamp."}],"refs":{"1":"Y Liu et al. Nature 562 (2018), pp. 548–551.","2":"Nathalia B Tomazio et al. ACS Photon. 12 (1 2025), 227 – 235.","3":"Chen-Xi Zhu et al. Phys. Rev. Appl. 17 (2022), p. 064034.","4":"Hao Yu et al. Nat. Commun. 16 (2025), p. 171.","5":"Bing Bai et al. Appl. Phys. Lett. 118 (2021), p. 264001.","6":"Cédric Bruynsteen et al. PRX Quantum 4 (2023), p. 010330.","7":"Yoshitomo Okawachi et al. Opt. Lett. 41 (2016), pp. 4194–4197.","8":"Liam Quinn et al. Opt. Lett. 48 (2023), pp. 3741–3744.","9":"A. Dantas et al. Anais do Congresso Brasileiro de Ciência e Tecnologia Quântica (CBCTQ 2026). 2026.","10":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","11":"F. Basso Basset et al. Quantum Sci. Technol. 8.2 (2023).","12":"Alley Hameedi et al. Phys. Rev. A 102.3 (2020).","13":"Rafael A. Da Silva et al. Phys. Rev. A 107.4 (2023).","14":"Diego G. Barreto et al. J. Opt. Soc. Am. B 43.2 (2026), pp. 300 –308.","15":"Maria Carolina Volpato et al. J. Opt. Soc. Am. B 43.3 (2026), A200 –A205."}},{"id":"f-QPC-2_PD1","group":"PD","title":"QPC-2 PD1: Integrated balanced homodyne detection and loss-budget metrology for on-chip squeezing","pages":2,"file":"PD/QPC-2_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc develops the integrated balanced-homodyne detection and the loss-budget metrology on which the L2 goal depends: on-chip beamsplitter balance, local-oscillator mode matching, heterogeneous photodiode integration and the calibration chain from shot-noise reference to measured squeezing."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-2, Continuous-variable quantum photonics on SiN and PPLN-TFLN, of the PHOQUS Research Plan, and serves L2 (integrated squeezing with on-chip readout) and L3 (squeezed light for the spectrometer). The work package is defined as follows. QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tracks (Kerr in SiN, χ(2) in PPLN-TFLN [1]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far."},{"t":"p","x":"Starting point. How are quantum noise and multimode correlations redistributed in integrated χ(2) and χ(3) circuits, and what limits their reconstruction (H-A, H-B)? Observable: calibrated covariance matrices and tomography versus loss, visibility and mode structure."},{"t":"p","x":"Metric moved by this fellowship. Tomography of an integrated χ(3) OPO [2]; assumption-free measurement of intense-field sidebands [3]; CV entanglement and hidden entanglement in four-wave-mixing OPOs [4, 5]; diagnostics for CV cluster states [6]; structured quantum light (Barros) [7]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Establish the per-element efficiency metrology (escape, routing, visibility, quantum efficiency) as a center protocol."},{"t":"p","x":"2. Demonstrate an integrated balanced detector with ηQE ≥0.9 and ≥30 dB common-mode rejection on TFLN or SiN."},{"t":"p","x":"3. Co-supervise QPC-2 DR1/DR2 and MS1 and lead the on-chip measurement campaign of L2."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Photodiode integration (bonding or partner foundry), electronic design of the balanced receiver, calibration against the USP bench [8, 9]."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Metrology protocol; first bonded photodiodes","Integrated balanced detector characterized","D2","On-chip readout used in the L2 measurement","L2-T / goal"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QPC-3 (packaging, photodiode integration) and QEPS-1 (balanced detection for L3)."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"fig","x":["Publications; the on-chip detector module; co-supervision.","References","[1]","Jie Zhao et al. Sci. Adv. 11 (2025), eadu4888.","[2]"]},{"t":"p","x":"Roger Alfredo Kögler et al. Opt. Lett. 49.11 (2024), pp. 3150–3153."},{"t":"fig","x":["[3]","F.A.S. Barbosa et al. Phys. Rev. A 102.6 (2020).","[4]","A. Montaña Guerrero et al. Phys. Rev. Lett. 129.16 (2022).","[5]","R.L. Rincón Celis et al. Phys. Rev. Lett. 137.9 (2026).","[6]"]},{"t":"p","x":"Carlos González-Arciniegas et al. PRX Quantum 2 (3 2021), p. 030343."},{"t":"p","x":"[7] Markus Hiekkamäki et al. Nat. Photon. 16.12 (2022), pp. 828 –833."},{"t":"fig","x":["[8]","Joel F. Tasker et al. Sci. Adv. 10.20 (2024), eadk6890.","[9]","Haoran Chen et al. 2026."]}],"refs":{}},{"id":"f-QPC-2_PD2","group":"PD","title":"QPC-2 PD2: Multimode squeezing and cluster-state resources on chip (toward H3)","pages":2,"file":"PD/QPC-2_PD2_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc opens the Phase-2 horizon H3 from within L2: multimode squeezing and small cluster-state resources on chip, using the multimode structure of microcombs and the group’s CV entanglement diagnostics [1, 2]."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-2, Continuous-variable quantum photonics on SiN and PPLN-TFLN, of the PHOQUS Research Plan, and serves L2 (integrated squeezing with on-chip readout) and L3 (squeezed light for the spectrometer). The work package is defined as follows. QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tracks (Kerr in SiN, χ(2) in PPLN-TFLN [3]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far."},{"t":"p","x":"Starting point. How are quantum noise and multimode correlations redistributed in integrated χ(2) and χ(3) circuits, and what limits their reconstruction (H-A, H-B)? Observable: calibrated covariance matrices and tomography versus loss, visibility and mode structure."},{"t":"p","x":"Metric moved by this fellowship. Tomography of an integrated χ(3) OPO [4]; assumption-free measurement of intense-field sidebands [5]; CV entanglement and hidden entanglement in four-wave-mixing OPOs [6, 7]; diagnostics for CV cluster states [2]; structured quantum light (Barros) [8]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Characterize multimode squeezing and entanglement in a SiN or TFLN microcomb below threshold."},{"t":"p","x":"2. Demonstrate a few-mode cluster state with on-chip generation and off-chip measurement."},{"t":"p","x":"3. Define the H3 roadmap for the Year-5 re-planning."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Multimode homodyne detection, entanglement witnesses and nullifiers, comb sources from NIP-1. Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Multimode squeezing measured","Two- to four-mode entanglement","H3 roadmap; publications","Year-5 re-planning"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 and QPC-2 DR2; exchanges with CV integrated-photonics groups abroad."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"fig","x":["Publications; the H3 roadmap; co-supervision.","References","[1]","Xinyu Jia et al. Nature 639 (2025), pp. 329–336.","[2]"]},{"t":"p","x":"Carlos González-Arciniegas et al. PRX Quantum 2 (3 2021), p. 030343."},{"t":"p","x":"[3] Jie Zhao et al. Sci. Adv. 11 (2025), eadu4888."},{"t":"p","x":"[4] Roger Alfredo Kögler et al. Opt. Lett. 49.11 (2024), pp. 3150–3153."},{"t":"fig","x":["[5]","F.A.S. Barbosa et al. Phys. Rev. A 102.6 (2020).","[6]","A. Montaña Guerrero et al. Phys. Rev. Lett. 129.16 (2022).","[7]","R.L. Rincón Celis et al. Phys. Rev. Lett. 137.9 (2026).","[8]"]},{"t":"p","x":"Markus Hiekkamäki et al. Nat. Photon. 16.12 (2022), pp. 828 –833."}],"refs":{}},{"id":"f-XC-1_PD1","group":"PD","title":"XC-1 PD1: Cryogenic operation platform and SAW-driven interfaces shared across the three branches","pages":2,"file":"PD/XC-1_PD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The postdoc runs the shared cryogenic operation platform of the center (4 K systems and the dilution refrigerator schedule, fiber and RF access, user protocols) and develops the SAW-driven interfaces used across the branches."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package XC-1, Acoustic control and cryogenic operation across branches, of the PHOQUS Research Plan, and serves the QD track of L1 and the cryogenic platform of L4. The work package is defined as follows. Surface acoustic waves (SAW) and cryogenic operation are needed in all three branches, and XC-1 provides them as a shared platform. SAW on piezoelectric substrates (LN, GaAs) modulate excitons, trions and quantum emitters (NIP-4), drive Brillouin and optomechanical interactions (NIP-2), and offer an acoustic route to the microwave interface of L4 (QEPS-2). The IFGW Cryogenics Facility supplies the 4 K and mK operation required by NIP-4, QPC-3 packaging and L4. XC-1 also hosts strain engineering of emitters on semiconductor nanomembranes."},{"t":"p","x":"Starting point. What limits acoustic control of emitters and phonons at low temperature (mechanical dissipation, heating, coupling strength) (H-C)? Observable: modulation contrast and coherence versus temperature and drive."},{"t":"p","x":"Metric moved by this fellowship. Acoustically driven Stark effect and acoustic modulation of excitonic complexes in 2D heterostructures [1, 2]; SAW-mediated SBS in LN waveguides [3]; single-QD optomechanics [4, 5]; rolled-up quantum wells and strain-free GaAs nanostructures [6]; coordination of the IFGW Cryogenics Facility (EMU 2023/17024-1)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Define and operate the shared cryogenic schedule and the fiber/RF access protocols."},{"t":"p","x":"2. Develop SAW-driven interfaces on LN and GaAs for emitters and transducers."},{"t":"p","x":"3. Co-supervise XC-1 DD1 and support the cryogenic campaigns of L1 (QD) and L4."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Cryogenic engineering, SAW device fabrication, RF and optical measurements."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: take over the WP baseline (process or bench), define the measurement protocols shared across the center."},{"t":"p","x":"• Months 7–24: lead the WP deliverables toward the Year-3 threshold; co-supervise the DD/MS fellows of the WP."},{"t":"p","x":"• Months 25–36: lighthouse integration campaign; transfer of the module to the shared infrastructure; publications."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Shared cryogenic schedule and protocols","annual report Y1","SAW interfaces delivered to NIP-4/NIP-2","Cryogenic campaigns of L4 supported","L4 preparation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with all WPs that use the cryogenic platform."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Publications; the cryogenic user facility of the center; co-supervision."}],"refs":{"1":"Diego Scolfaro et al. ACS Nano 15 (9 2021), pp. 15371–15380.","2":"Marcos L.F. Gomes et al. Nano Lett. 24 (49 2024), pp. 15517–15524.","3":"Caique C. Rodrigues et al. J. Opt. Soc. Am. B 40.5 (2023), pp. D56 –D63.","4":"Jan Kettler et al. Nat. Nanotechnol. 16.3 (2021), pp. 283 –287.","5":"Anja Vogele et al. Adv. Quantum Technol. 3.2 (2020).","6":"Leonarde N. Rodrigues et al. ACS Appl. Nano Mater. 4.3 (2021), pp. 3140 –3147."}},{"id":"f-NIP-1_DD1","group":"DD","title":"NIP-1 DD1: Dispersion-engineered coupled SiN microresonators as photon-pair and squeezed-light sources for L1 and L2","pages":2,"file":"DD/NIP-1_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow will design, fabricate at CCSNano and characterize coupled SiN microresonators (photonic molecules) in which dispersion and mode hybridization are set independently, and use them as the center’s primary photon-pair source for L1 and as the Kerr squeezing track of L2. The target by the end of the fellowship is a fiber-coupled pair rate of 1 MHz at CAR ≥100 from a ring with Qi ≥5 × 106, and a coupled-resonator design in which degenerate parametric oscillation is selected and competing processes are suppressed, delivered as the chip measured in the L1 field test and in the L2 Year-3 measurement."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-1, Kerr and electro-optic combs, DOPO in coupled microresonators, of the PHOQUS Research Plan, and serves L1 (SiN pair source), L2 (SiN Kerr squeezing track) and L3 (chip combs). The work package is defined as follows. Coupled SiN microresonators (photonic molecules) give independent control of dispersion and mode hybrid
