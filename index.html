ization, which we use to select degenerate parametric oscillation and suppress competing processes [1, 2]. NIP-1 delivers (i) high-Q SiN rings for SFWM pair generation (L1), (ii) dispersion-engineered resonators for Kerr squeezing (L2, SiN track), and (iii) Kerr and EO combs for dual-comb spectroscopy (L3), including spectral extension to the blue and UV [3]."},{"t":"p","x":"Starting point. To what extent do engineered coupling and hybridization in photonic molecules give independent control of parametric pathways and multimode quantum correlations beyond a matched single-resonator baseline (H-A)? Observable: squeezing spectra, quadrature covariances and mode correlations versus coupling and detuning, against quantitative coupled-mode predictions and control devices."},{"t":"p","x":"Metric moved by this fellowship. Tunable DOPO, mapping of nonlinear mode interactions and hybridized-band oscillation in coupled SiN resonators [4–6]; color symmetry breaking with MPL [7]; dispersion engineering of high-Q resonators [8]; visible-to-telecom parametric oscillation in CMOS-compatible OPOs [9, 10] and tunable squeezing in coupled SiN rings [11]; 20 GHz resonant EO comb across the S/C/L bands and mid-IR χ(2) combs [12, 13]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Establish the design rules that map coupling gap, ring radii and detuning of a photonic molecule onto the dispersion of the hybridized bands, and validate them against the Year-1 SiN process baseline (M1.1)."},{"t":"p","x":"2. Demonstrate SFWM pair generation with on-chip brightness ≥107 pairs s−1 mW−2 and heralded g(2)(0) ≤0.05, with the pump filtered on chip by a drop ring."},{"t":"p","x":"3. Deliver the packaged source (with QPC-3 couplers) to the L1 receiver chain and support the field test; deliver the dispersion-engineered DOPO design to the SiN track of L2."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Devices are designed with coupled-mode and finite-element models of the hybridized bands (the group’s existing framework for photonic molecules [4, 5]), fabricated in the CCSNano SiN process (100 kV EBL, ICP etching, annealing) and characterized on the NIP-1 transmission bench (Q, dispersion by swept-laser spectroscopy against a wavemeter). Pair generation is measured with the center’s shared source protocol: SNSPDs and time tagging for singles, coincidences, CAR and heralded g(2)(0), with pump rejection quantified separately. The fellow uses the loss-budget protocol of QPC-3 at the facets and reports all figures in the common data format."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"p","x":"Month Milestone of this plan Center milestone it feeds Photonic-molecule designs fabricated on the M1.1 baseline; Qi and dispersion measured M1.1 Pair source at ≥107 pairs s−1 mW−2 on chip, CAR ≥100 measured with QPC-1 filters D1 (L1 source down-select)"},{"t":"p","x":"Packaged source used in the L1 threshold test; DOPO design transferred to QPC-2 L1-T, L2-T 48–60 Multi-user WDM pair source for the L1 goal; thesis L1 goal (Y4)"},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"The fellow works with QPC-3 (packaging of the source) and QPC-1 (receiver chain and field test), and provides the resonator designs used by QPC-2 for Kerr squeezing. A BEPE period of 6–12 months in the Del’Haye group (MPL Erlangen) on ultralow-loss sputtered SiN is planned for Year 3, bringing back the process transfer foreseen in Section 2.3 of the Research Plan. Designs, process records and measurement data follow the Data Management Plan."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications (hybridized-band design rules; the packaged pair source and its field performance), one process module (dispersion-engineered coupled rings) documented for the CCSNano multi-user access model, and a fellow trained in design, cleanroom fabrication, packaging and photon-counting measurement. The source is the first element of the QKD evaluation testbed of the Innovation plan and a demonstration piece for laboratory visits."}],"refs":{"1":"Alexander K Vorobyev et al. Phys. Rev. Appl. 24 (2025), p. 054054.","2":"Ryotatsu Yanagimoto et al. Nature 649 (2026), pp. 330–337.","3":"Alekhya Ghosh et al. arXiv preprint arXiv:2603.03255 (2026).","4":"Nathalia B Tomazio et al. ACS Photon. 12 (1 2025), 227 – 235.","5":"Luca O. Trinchão et al. Optics Letters, 51 (6 2026), pp. 1387–1390.","6":"Luca O. Trinchão et al. APL Photon. 11.6 (2026).","7":"Luca O. Trinchão et al. Laser Photon. Rev. (2026).","8":"Marvyn Inga et al. APL Photon. 5.11 (2020).","9":"Renato R. Domeneguetti et al. Optica 8.3 (2021), pp. 316 –322.","10":"Yun Zhao et al. Optica 7.2 (2020), pp. 135 –141.","11":"Avik Dutt et al. Opt. Lett. 41.2 (2016), pp. 223–226.","12":"Marlon M. Correia et al. APL Photon. 11.6 (2026).","13":"Alexander J. Lind et al. Phys. Rev. Lett. 124 (13 2020)."}},{"id":"f-NIP-2_DD1","group":"DD","title":"NIP-2 DD1: GHz phononic resonators and Brillouin interactions in TFLN for the L4 transducer","pages":2,"file":"DD/NIP-2_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Branch reserve fellowship assigned to NIP-2. The fellow develops GHz phononic resonators and Brillouin interactions in TFLN, measuring the parameters (piezoelectric coupling, phonon confinement, mechanical Q at 4 K and below) that the L4 transducer design of QEPS-2 needs, and demonstrates a Brillouin laser on TFLN as a narrow-linewidth source. The Executive Committee may reassign the fellowship at D1 or D2 to the branch work package that is most behind."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-2, Brillouin scattering and optomechanics in TFLN, of the PHOQUS Research Plan, and serves L4 (phononic design rules and Brillouin/optomechanical devices on TFLN). The work package is defined as follows. NIP-2 develops phonon-mediated devices on TFLN: narrow-linewidth Brillouin sources and GHz acoustic resonators whose design rules (piezoelectric coupling, phonon confinement, mechanical Q at low temperature) are transferred to the transducers of QEPS-2."},{"t":"p","x":"Starting point. Which phonon-mediated mechanisms (Brillouin gain and noise, piezoelectric coupling, phonon dissipation at low temperature) set the coherence limits of acousto-optic interactions in TFLN (H-C)? Observable: Brillouin gain and noise spectra and optomechanical rates versus temperature."},{"t":"p","x":"Metric moved by this fellowship. Cross-polarized SBS in LiNbO3 waveguides [1] and SBS mediated by surface acoustic waves in LN [2]; milliwatt UV generation in sidewall-poled LN with Harvard, which also gives access to TFLN poling [3]; intermodal Brillouin scattering in fibers [4]; Brillouin optomechanics in the quantum ground state (Benevides) [5]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design and fabricate suspended and unsuspended TFLN phononic resonators at 2–10 GHz with interdigital transducers, and measure mechanical Q and electromechanical coupling at 300 K and 4 K."},{"t":"p","x":"2. Demonstrate stimulated Brillouin scattering with net gain in a TFLN waveguide resonator and a Brillouin laser line [1]."},{"t":"p","x":"3. Deliver the measured design rules (g0, Qm, Cem) to QEPS-2 for the first LN-on-Si transducer generation."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"TFLN fabrication at CCSNano (EBL, Ar ICP etching, release when needed), electromechanical characterization with the vector network analyzer, optomechanical and Brillouin spectroscopy with the lock-in cross-polarized scheme developed in the group, and 4 K measurements on the XC-1 cryogenic platform. Simulations with finite-element models of the coupled optical and acoustic modes."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","First TFLN phononic resonators; Qm at 300 K","annual report Y2","4 K measurements; Cem extracted; Brillouin gain measured","D1/D2 reassignment check","Brillouin laser on TFLN; design rules delivered to QEPS-2","L4 device generation 1","48–60","Phononic devices integrated in the L4 chip; thesis","L4-T (Y5)"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QEPS-2 (transducer design), XC-1 (SAW and cryogenics) and QPC-2 (TFLN process). BEPE period in the Lončar group (Harvard) on TFLN acousto-optic devices in Year 3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two publications (TFLN phononic resonators at 4 K; Brillouin laser on TFLN); the phononic design rules used in L4; training in TFLN fabrication, microwave and cryogenic measurement."}],"refs":{"1":"Caique C. Rodrigues et al. Phys. Rev. Lett. 134 (11 2025), p. 113601.","2":"Caique C. Rodrigues et al. J. Opt. Soc. Am. B 40.5 (2023), pp. D56 –D63.","3":"C. A. A. Franken et al. Nat. Commun. 17 (1 2026), pp. 3651–.","4":"Paulo F. Jarschel et al. APL Photon. 6.3 (2021).","5":"H.M. Doeleman et al. Phys. Rev. Res. 5.4 (2023)."}},{"id":"f-NIP-4_DD1","group":"DD","title":"NIP-4 DD1: Waveguide-integrated droplet-etched quantum dots as deterministic sources for the L1 QD track","pages":2,"file":"DD/NIP-4_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow (DD, or DR for a candidate with an MSc) develops the heterostructures of the L1 QD track: growth of droplet-etched quantum dots at the Unicamp MBE, design and optimization of the diode (p-i-n or n-i-n) structures that control the charge environment, k·p modeling of the heterostructure and support to the cavity design (DBR, circular Bragg), together with the quantum-optical characterization (g(2)(0), indistinguishability, extraction efficiency) that the L1 goal requires (g(2)(0) ≤0.02, VTPI ≥0.9); device fabrication and integration are led by NIP-4 PD1."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-4, Quantum emitters: from integrability to coherence, of the PHO-QUS Research Plan, and serves L1 (deterministic QD track) and the integrability–coherence program. The work package is defined as follows. NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols."},{"t":"p","x":"Starting point. What sets the trade-off between integrability and coherence across epitaxial, colloidal and 2D emitters coupled to the same resonator, and which material strategy (exciton band alignment, strain, shell engineering) gives high-purity, indistinguishable emission from colloidal nanomaterials? Observable: purity, linewidth, indistinguishability and extraction versus coupling and temperature, on one protocol. Metric moved by this fellowship. Epitaxial QDs: entanglement-based QKD with QD sources [1, 2], urban-network and teleportation experiments [3, 4], waveguide-integrated and cavity-enhanced sources [5, 6], and droplet-etched InGaAs QDs with Unicamp participation [7, 8]. Colloidal emitters: bright/dark exciton inversion in strain-graded QDs and lattice-distortion engineering of emission [9], optical gain by biexciton engineering and linewidth control in nanocrystals [10–12]; droplet-etched GaAs nanostructures grown at LNNano [13, 14]. 2D emitters: strain-engineered confinement and single-photon emitters in WSe2 [15–17]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Grow and characterize droplet-etched GaAs/InGaAs QDs at Unicamp with the growth protocol transferred from Linz, and locate single dots deterministically."},{"t":"p","x":"2. Design and grow diode-embedded QD heterostructures (p-i-n or n-i-n) and the cavity layers (DBR, circular Bragg) with k·p and FDTD support, and characterize extraction efficiency and indistinguishability of the processed devices [5]."},{"t":"p","x":"3. Demonstrate telecom conversion or telecom-band emission and deliver a waveguide-coupled source to QPC-1 for the L1 QD track."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"MBE growth with in-situ thickness control, hyperspectral and micro-photoluminescence mapping on the small closed-cycle cryostat and spectrometer of NIP-4, k·p and FDTD design, processing with NIP-4 PD1 at CC-SNano, resonant excitation and Hong–Ou–Mandel interference on the NIP-4 quantum-optics bench with the shared SNSPDs."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Droplet-etched QDs grown at Unicamp; single-dot g(2)(0) measured","annual report Y1","Waveguide-coupled dot with g(2)(0) < 0.05","D1","Cavity-enhanced source; VTPI measured","L1-T (QD track input)","48–60","g(2)(0) ≤0.02, VTPI ≥0.9; thesis","L1 goal"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with XC-1 (SAW tuning of emitters, cryogenics), QPC-1 (source protocol) and QPC-3 (fiber coupling of QD chips). BEPE period with the Rastelli network (JKU Linz) or an integrated-QD laboratory in Year 3–4."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; the first waveguide-integrated deterministic source fabricated in Brazil; training in MBE growth, nanofabrication and single-photon metrology."}],"refs":{"1":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","2":"Christian Schimpf et al. Adv. Photon. 3.6 (2021).","3":"Gonzalo Carvacho et al. Optica 9.5 (2022), pp. 572–578.","4":"Alessandro Laneve et al. Nat. Commun. 16.1 (2025).","5":"Florian Hornung et al. Nano Lett. 24.4 (2024), pp. 1184–1190.","6":"Michele B. Rota et al. eLight 4.1 (2024).","7":"Saimon F. Covre Da Silva et al. Nano Lett. 26.3 (2026), pp. 953–960.","8":"Evandro Martin Lanzoni et al. Nanotechnology 33.16 (2022).","9":"Jeong Woo Park et al. Nat. Commun. 17.1 (2026).","10":"Gabriel Nagamine et al. ACS Photon. 7.8 (2020), pp. 2252 –2264.","11":"Albert Liu et al. ACS Nano 15.4 (2021), pp. 6499 –6506.","12":"Albert Liu et al. Sci. Adv. 7.1 (2021).","13":"Saimon Filipe Covre da Silva et al. Nanoscale Res. Lett. 12 (2017), p. 61.","14":"Vanessa Orsi Gordo et al. Nanotechnology 31 (2020), p. 255202.","15":"Caique Serati De Brito et al. Appl. Phys. Lett. 121.7 (2022).","16":"Caique Serati de Brito et al. Nano Lett. 24.42 (2024), pp. 13300 –13306.","17":"F.S. Covre et al. Nanoscale 14.15 (2022), pp. 5758 –5768."}},{"id":"f-QEPS-1_DD1","group":"DD","title":"QEPS-1 DD1: Squeezed dual-comb spectroscopy of CO2 and CH4 with chip-generated squeezed light (L3)","pages":2,"file":"DD/QEPS-1_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow builds the L3 experiment: a dual-comb spectrometer of CO2 (1.57 µm) and CH4 (1.65 µm) into which the squeezed light of the L2 chip is injected, demonstrating a noise floor ≥1 dB below shot noise and a ≥1.25× speed-up in concentration retrieval with fiber or EO combs (Year-4 threshold), and then moving the combs to the NIP-1 chips for the Year-6 goal (≥3 dB, ≥2×)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-1, Squeezed dual-comb spectroscopy, of the PHOQUS Research Plan, and serves L3 (squeezed dual-comb spectrometer). The work package is defined as follows. QEPS-1 owns the L3 lighthouse. It builds a dual-comb spectrometer seeded by the L2 squeezed light, first with fiber or EO combs and then with chip combs from NIP-1, and extends coverage to the mid-infrared and THz by difference-frequency generation in GaP/GaAs and TFLN [1]. Its primary scientific output is a controlled test of whether frequency-dependent squeezing and multimode correlations give a statistically significant concentration-estimation advantage once mode matching, comb technical noise, transmission and detection losses are included: mode-resolved covariance data, a resource-matched classical control and estimator-level precision."},{"t":"p","x":"Starting point. Under which resource constraints does a non-classical optical resource yield a net task-level estimation advantage in broadband multimode spectroscopy (H-B)? Observable: Fisher information or concentration precision against a resource-matched optimized classical reference."},{"t":"p","x":"Metric moved by this fellowship. Mid-IR comb generation and spectroscopy with χ(2) optics and suspended-Si waveguides [2, 3]; free-running 1 GHz dual-comb laser and 20 GHz EO comb [4, 5]; methane and CO sensing in hollow-core fiber [6]; near-infrared dual-comb spectroscopy with multipass cells targeting N2O, starting at USP in early 2027."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Assemble a shot-noise-limited dual-comb spectrometer (fiber or EO combs, multipass cell, balanced detection) and quantify its noise budget against the comb RIN protocol of NIP-1."},{"t":"p","x":"2. Inject chip-generated squeezed vacuum into the signal arm and demonstrate the sub-shot-noise SNR and the quantum speed-up [1]."},{"t":"p","x":"3. Replace the combs by SiN microcombs and report sensitivity in ppm·m."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Dual-comb spectroscopy on the Cruz laboratory bench (1 GHz dual-comb laser, 20 GHz EO comb), squeezed-light injection with mode matching to the comb, balanced detection and RF analysis on the electrical spectrum analyzer, concentration retrieval with fits to HITRAN lines, Allan-deviation analysis of the speed-up. Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Classical shot-noise-limited DCS of CO2/CH4","annual report Y1","Squeezed-light injection test (bench squeezer)","annual report Y2","Chip squeezer injected; noise budget closed","L3 preparation","48–60","L3 threshold (≥1 dB, 1.25×); chip combs; thesis","L3-T (Y4), goal (Y6)"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QPC-2 (squeezer), NIP-1 (combs) and QPC-3 (coupling). BEPE period in a comb-spectroscopy or squeezed-light sensing laboratory in Year 3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications, including the first chip-based squeezed DCS; the sensing demonstrator of the Innovation plan; training across comb metrology and quantum optics."}],"refs":{"1":"Daniel I. Herman et al. Science 387 (6734 2025), pp. 653–658.","2":"Alexander J. Lind et al. Phys. Rev. Lett. 124 (13 2020).","3":"Nima Nader et al. Optica, 6 (10 2019), pp. 1269–1276.","4":"Marlon M Correia et al. (2026).","5":"Marlon M. Correia et al. APL Photon. 11.6 (2026).","6":"Artur de Araujo Silva et al. J. Opt. Soc. Am. B 40.4 (2023), pp. C21 –C27."}},{"id":"f-QEPS-3_DD1","group":"DD","title":"QEPS-3 DD1: Chip-integrated magnetometry with color centers and atomic vapours (H2)","pages":2,"file":"DD/QEPS-3_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Branch reserve fellowship assigned to QEPS-3. The fellow develops chip-integrated magnetometry: a vapour-cell magnetometer coupled to a photonic chip as benchmark (with squeezed-light enhancement from QPC-2), and color-center magnetometry on the diamond platform shared with QEPS-2, seeding the Phase-2 horizon H2 (field quantum sensors) [1, 2]."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-3, Chip-integrated magnetometry, of the PHOQUS Research Plan, and serves the Phase-2 horizon H2 (field quantum sensors). The work package is defined as follows. QEPS-3 combines color-center defects in diamond with atomic-vapour interfaces for chip-integrated magnetometry, using the diamond platform of QEPS-2 and the squeezed-light resources of QPC-2. It seeds the Phase 2 field-sensor horizon (H2)."},{"t":"p","x":"Starting point. When does a quantum optical resource give a real magnetic-field estimation advantage on a chip at matched sensing resources? Observable: sensitivity versus an optimized classical reference under identical conditions."},{"t":"p","x":"Metric moved by this fellowship. Floquet and stroboscopic microwave spectroscopy of optically pumped magnetometers [1, 2]; ultrafast dynamics of NV-center ensembles [3]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Couple an optically pumped vapour-cell magnetometer to chip-delivered light and establish its sensitivity (T/√ Hz) as the benchmark."},{"t":"p","x":"2. Demonstrate squeezed-light readout of the magnetometer with light from the QPC-2 chip."},{"t":"p","x":"3. Fabricate diamond photonic structures with NV ensembles and compare with the vapour-cell benchmark."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Optically pumped magnetometry (UFABC), squeezed-light injection (USP/QPC-2), diamond nanofabrication (CCSNano) and NV spectroscopy."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Benchmark magnetometer coupled to a chip","annual report Y2","Squeezed-light readout","Diamond NV device","48–60","H2 prototype; thesis","Year-5 re-planning (H2)"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QPC-2 and QEPS-2; research stays with the associates as appropriate."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two publications; the H2 seed; training in atomic physics, quantum optics and diamond photonics."}],"refs":{"1":"Hans Marin Florez et al. Phys. Rev. A 103 (3 2021), p. 033113.","2":"Hans Marin Florez et al. Phys. Rev. A 110 (4 2024), p. 043102.","3":"Albert Liu et al. Mater. Quantum Technol. 1.2 (2021)."}},{"id":"f-QPC-1_DD1","group":"DD","title":"QPC-1 DD1: Chip QKD transmitter and BBM92 receiver chain for the L1 deployed-fiber field test","pages":2,"file":"DD/QPC-1_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow builds the L1 communication chain around the NIP-1 source: the time-bin or polarization analyzers, the synchronisation and the finite-key BBM92 post-processing, first on spooled fiber and then on the deployed metropolitan link, and runs the Year-3 field test that is the L1 threshold (visibility ≥95% after ≥25 km, secure key with finite-key analysis)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-1, Chip QKD transmitters and QRNG, of the PHOQUS Research Plan, and serves L1 (receiver chain and field test) and the QRNG module M1.2. The work package is defined as follows. QPC-1 develops the QRNG chip (Year-2 deliverable) and then the chip QKD transmitter and receiver chain, including time-bin analyzers, for the L1 field test [1, 2]. Published chip QRNGs already reach 18.8–100 Gbit/s [3, 4], so QPC-1 does not compete on bit rate: its target is a certifiable entropy source fabricated and packaged in Brazil and validated on a national testbed. The QRNG is based on integrated balanced-homodyne detection of vacuum fluctuations [5], the same receiver used for key reception, with the binary phase states of the NIP-1 degenerate OPO as an alternative entropy source [6, 7]; the receiver chain also develops single-photon detection for the discrete-variable protocols of L1."},{"t":"p","x":"Starting point. How do source and receiver imperfections propagate into certified randomness and finite-key security? Observable: entropy certification and finite-key rate as functions of measured imperfections. Metric moved by this fellowship. First chip-QRNG result of the team [8]; the route builds on its integrated homodyne receivers and, as an alternative, on the in-house tunable DOPO [9]. QKD: entanglement-based QKD with QD sources, including daylight operation [10, 11]; device-independent tests and randomness-relevant protocols (Marques) [12, 13]; transfer-matrix modeling of multiport integrated beam splitters and photonic molecules [14, 15]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design and build the two receivers (analyzer, SNSPDs, time tagging, clock distribution) and the drift compensation of the link."},{"t":"p","x":"2. Demonstrate entanglement distribution over 25 km of spooled and then deployed fiber with V ≥95% and CAR ≥100 at the detectors."},{"t":"p","x":"3. Implement the BBM92 key extraction with finite-key security analysis and report the secure key rate of the field test."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Fiber-optic receiver design, SNSPD operation, time-tagging and real-time coincidence software, polarization and timing stabilization, security analysis (finite-key bounds). Spooled-fiber emulation in Year 2, deployed link (CPqD/RNP/campus, to be confirmed) in Year 3. The fellow uses the QPC-1 protocols for QBER and key-rate reporting [1, 2]."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Two receivers operating; local entanglement visibility measured","annual report Y1","25 km spooled-fiber distribution with V ≥95%","D1","Field test on deployed fiber; finite-key BBM92 key","L1-T","48–60","≥10 MHz source, multi-user WDM distribution; thesis","L1 goal (Y4)"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 (source), QPC-3 (packaging) and NIP-4 (QD track). BEPE period in a quantum-network laboratory (to be chosen with the associates, e.g. the Delft network group) in Year 3–4."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; the QKD evaluation testbed of the Innovation plan; training in quantum communication systems engineering."}],"refs":{"1":"Chen-Xi Zhu et al. Phys. Rev. Appl. 17 (2022), p. 064034.","2":"Hao Yu et al. Nat. Commun. 16 (2025), p. 171.","3":"Bing Bai et al. Appl. Phys. Lett. 118 (2021), p. 264001.","4":"Cédric Bruynsteen et al. PRX Quantum 4 (2023), p. 010330.","5":"Y Liu et al. Nature 562 (2018), pp. 548–551.","6":"Yoshitomo Okawachi et al. Opt. Lett. 41 (2016), pp. 4194–4197.","7":"Liam Quinn et al. Opt. Lett. 48 (2023), pp. 3741–3744.","8":"A. Dantas et al. Anais do Congresso Brasileiro de Ciência e Tecnologia Quântica (CBCTQ 2026). 2026.","9":"Nathalia B Tomazio et al. ACS Photon. 12 (1 2025), 227 – 235.","10":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","11":"F. Basso Basset et al. Quantum Sci. Technol. 8.2 (2023).","12":"Alley Hameedi et al. Phys. Rev. A 102.3 (2020).","13":"Rafael A. Da Silva et al. Phys. Rev. A 107.4 (2023).","14":"Diego G. Barreto et al. J. Opt. Soc. Am. B 43.2 (2026), pp. 300 –308.","15":"Maria Carolina Volpato et al. J. Opt. Soc. Am. B 43.3 (2026), A200 –A205."}},{"id":"f-QPC-3_DD1","group":"DD","title":"QPC-3 DD1: 3D nanoprinted fiber-chip couplers and cryogenic fiber attach for L1 to L4","pages":2,"file":"DD/QPC-3_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Branch reserve fellowship assigned to QPC-3. The fellow develops the fiber–chip interfaces that every lighthouse depends on: 3D nanoprinted couplers and specialty-fiber interfaces with ≤1 dB per facet, and the cryogenic fiber attach needed by L4 and by the QD track of L1, tracked with a center-level loss-budget metric at 300 K and 4 K."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-3, Low-loss fiber–chip quantum interfaces, of the PHOQUS Research Plan, and serves all lighthouses (fiber–chip loss budget), in particular L1 and the cryogenic attach of L4. The work package is defined as follows. Loss at the chip boundary is the dominant penalty for every lighthouse. QPC-3 develops 3D micro-printed couplers and specialty-fiber interfaces [1] and cryogenic-compatible packaging, with a coupling loss budget tracked as a center-level metric."},{"t":"p","x":"Starting point. How do coupling, mode overlap and packaging convert optical loss into quantum-state infidelity, at 300 K and 4 K? Observable: a joint loss and fidelity budget per interface."},{"t":"p","x":"Metric moved by this fellowship. Two-photon polymerised micro-optics and resonators [2]; current Marie Skłodowska-Curie work on 3D nanoprinting at IPHT (Tomazio); industrial collaboration with Corning Inc. on fiber–chip coupling (Innovation Action Plan)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design and fabricate 3D nanoprinted couplers (with IPHT Jena) and inverse-taper facets at CCSNano and reach ≤1.5 dB (Year 3) and ≤1 dB (Year 5) per facet."},{"t":"p","x":"2. Develop cryogenic-compatible fiber attach (UV-cure, thermal matching) and verify loss stability over cooldown cycles."},{"t":"p","x":"3. Package the L1 source and the L2 chip and maintain the center’s loss-budget registry."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Mode-matching design [1], two-photon polymerisation at IPHT (and later in-house), facet processing, loss metrology with calibrated power meters and cut-back, cryogenic tests on the XC-1 platform; industrial collaboration with Corning on self-aligned coupling."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Facet-loss metrology protocol; first nanoprinted couplers","annual report Y2","≤1.5 dB/facet at C-band; L1 source packaged","D1","Cryogenic attach qualified at 4 K","L2-T / L4 preparation","48–60","≤1 dB/facet; cryogenic attach in the L4 chip; thesis","L4-T"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with all WPs as the packaging interface; BEPE period in the Schmidt group (Leibniz IPHT Jena) on 3D nanoprinting in Year 2–3, with transfer of the printing process to CCSNano by Year 5."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; the packaging module of the center (a direct Innovation-plan asset); training in packaging, which is the scarcest skill in the field."}],"refs":{"1":"Johannes Bürger et al. Adv. Photon. 7 (2025), p. 046002.","2":"Adriano J. G. Otuka et al. Polymers 13.12 (2021)."}},{"id":"f-XC-1_DD1","group":"DD","title":"XC-1 DD1: Surface-acoustic-wave control of quantum emitters and phononic devices on LN and GaAs","pages":2,"file":"DD/XC-1_DD1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow develops surface-acoustic-wave control of quantum emitters and phononic devices on LN and GaAs as the acoustic platform shared by the three branches: SAW tuning of QD and 2D-emitter transitions (NIP-4), SAW-driven Brillouin and optomechanical interactions (NIP-2) and an acoustic route to the microwave interface of L4 (QEPS-2) [1–3]."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package XC-1, Acoustic control and cryogenic operation across branches, of the PHOQUS Research Plan, and serves the QD track of L1 and the cryogenic platform of L4. The work package is defined as follows. Surface acoustic waves (SAW) and cryogenic operation are needed in all three branches, and XC-1 provides them as a shared platform. SAW on piezoelectric substrates (LN, GaAs) modulate excitons, trions and quantum emitters (NIP-4), drive Brillouin and optomechanical interactions (NIP-2), and offer an acoustic route to the microwave interface of L4 (QEPS-2). The IFGW Cryogenics Facility supplies the 4 K and mK operation required by NIP-4, QPC-3 packaging and L4. XC-1 also hosts strain engineering of emitters on semiconductor nanomembranes."},{"t":"p","x":"Starting point. What limits acoustic control of emitters and phonons at low temperature (mechanical dissipation, heating, coupling strength) (H-C)? Observable: modulation contrast and coherence versus temperature and drive."},{"t":"p","x":"Metric moved by this fellowship. Acoustically driven Stark effect and acoustic modulation of excitonic complexes in 2D heterostructures [1, 2]; SAW-mediated SBS in LN waveguides [3]; single-QD optomechanics [4, 5]; rolled-up quantum wells and strain-free GaAs nanostructures [6]; coordination of the IFGW Cryogenics Facility (EMU 2023/17024-1)."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Fabricate SAW delay lines and resonators on TFLN and GaAs chips and characterize them electrically and optically at 300 K and 4 K."},{"t":"p","x":"2. Demonstrate SAW modulation of a resonator-coupled emitter (modulation depth, sideband resolution) and of a Brillouin interaction."},{"t":"p","x":"3. Deliver the SAW platform (design rules, chips, cryogenic operation) to NIP-4, NIP-2 and QEPS-2."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"IDT design and fabrication at CCSNano, VNA characterization, cryogenic micro-PL with RF drive on the XC-1 platform, strain engineering on nanomembranes."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–12: coursework, training on the shared fabrication and characterization stack, literature and design; first devices from the WP baseline process."},{"t":"p","x":"• Months 13–30: core device development and first measurements against the WP metric; qualifying exam."},{"t":"p","x":"• Months 31–48: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 49–60: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","SAW delay lines on TFLN and GaAs","annual report Y1","SAW modulation of an emitter at 4 K","D1","Acoustic drive of a NIP-2 device","48–60","Acoustic interface for L4; thesis","L4-T"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-4, NIP-2 and QEPS-2; BEPE period in a SAW-quantum-dot laboratory abroad in Year 3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; the SAW platform; training in acoustics, cryogenics and emitter spectroscopy."}],"refs":{"1":"Diego Scolfaro et al. ACS Nano 15 (9 2021), pp. 15371–15380.","2":"Marcos L.F. Gomes et al. Nano Lett. 24 (49 2024), pp. 15517–15524.","3":"Caique C. Rodrigues et al. J. Opt. Soc. Am. B 40.5 (2023), pp. D56 –D63.","4":"Jan Kettler et al. Nat. Nanotechnol. 16.3 (2021), pp. 283 –287.","5":"Anja Vogele et al. Adv. Quantum Technol. 3.2 (2020).","6":"Leonarde N. Rodrigues et al. ACS Appl. Nano Mater. 4.3 (2021), pp. 3140 –3147."}},{"id":"f-NIP-3_DR1","group":"DR","title":"NIP-3 DR1: Quasi-phase-matched SHG and SPDC with patterned 2D materials on SiN waveguides","pages":2,"file":"DR/NIP-3_DR1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow (potentially an MSc graduate of the MackGraphe group) develops phase-matched second-harmonic generation and spontaneous parametric down-conversion on SiN waveguides using patterned transition-metal-dichalcogenide layers as the χ(2) medium, as the alternative pair source of L1 and as an on-chip χ(2) element for the pump stage of L2."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-3, 2D materials: χ(2) media and hybrid nonlinear devices, of the PHOQUS Research Plan, and serves L1 (alternative SPDC source) and L2 (on-chip pump control). The work package is defined as follows. Transition-metal dichalcogenides integrated on SiN provide a χ(2) response on a centrosymmetric platform [1]. NIP-3 pursues waveguide-coupled SHG and SPDC with modal phase matching and quasi-phase-matching by patterned 2D layers, and 2D saturable absorbers and non-reciprocal elements for on-chip pump control."},{"t":"p","x":"Starting point. How do interface, crystal symmetry and optical confinement determine integrated χ(2) conversion in 2D materials on waveguides? Observable: calibrated conversion efficiency and phase matching versus layer geometry and orientation."},{"t":"p","x":"Metric moved by this fellowship. On-chip SHG in SiN waveguides integrated with MoS2 monolayers [1]; SHG enhancement in TMD monolayers on epsilon-near-zero substrates and nonlinear dynamics of layered TMDs [2, 3]; low-loss integrated circuits with layered semiconductors [4]; nonlinear frequency conversion in franckeite heterostructures [5]; hybrid 2D saturable absorbers in photonic integrated circuits [6, 7]; an all-photonic isolator from atomically thin Bi2Te3 [8]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Transfer and pattern TMD monolayers on SiN waveguides and achieve phase matching by modal phase matching or by quasi-phase matching through periodic orientation or coverage; measure SHG efficiency per unit length."},{"t":"p","x":"2. Demonstrate SPDC pairs from the same structure and characterize them with the center’s source protocol."},{"t":"p","x":"3. Compare the 2D-material χ(2) route with PPLN-TFLN for the L1 source decision at D1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"2D-material growth and transfer at MackGraphe, waveguide fabrication at CCSNano, nonlinear characterization on the NIP-3 bench (SHG with tunable pump, SPDC with SNSPDs), modeling of phase matching with the 2D-material susceptibility [1]."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: design and training on the shared stack; definition of the device generation to be fabricated."},{"t":"p","x":"• Months 7–24: device fabrication and characterization against the WP metric; qualifying exam."},{"t":"p","x":"• Months 25–36: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 37–48: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Patterned TMD on SiN with measured SHG enhancement","annual report Y1","SPDC pairs characterized; comparison with TFLN","D1","Pump-stage element for L2 or source for L1 (whichever selected)","L2-T","Thesis"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 (waveguides), QPC-1 (source characterization) and QPC-2 (pump stage). BEPE period in the Soavi group (FSU Jena) on ultrafast nonlinear optics of 2D materials."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two publications; a transferable 2D-material χ(2) process; training across 2D-material growth, nanofabrication and quantum-optical measurement."}],"refs":{"1":"Mohd Rehan et al. ACS Photon. (2026).","2":"P.G. Vianna et al. Nanoscale Adv. 3 (1 2021), pp. 272–278.","3":"Melissa E. Maldonado et al. ACS Photon. 7.12 (2020), pp. 3440–3447.","4":"Jijun He et al. Nano Lett. 21.7 (2021), pp. 2709 –2718.","5":"Alisson R. Cadore et al. J. Appl. Phys. 135.8 (2024).","6":"Maria Carolina Volpato et al. J. Opt. Soc. Am. B 43.3 (2026), A200 –A205.","7":"Maria Carolina Volpato et al. Appl. Phys. Lett. 127.22 (2025).","8":"Saswata Goswami et al. Nanoscale 18.21 (2026), pp. 11258 –11270."}},{"id":"f-NIP-4_DR1","group":"DR","title":"NIP-4 DR1: Colloidal and 2D emitters coupled to integrated resonators along the integrability-coherence axis","pages":2,"file":"DR/NIP-4_DR1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow (continuing an MSc in the Padilha group) develops new colloidal quantum dots with a large T2/T1 figure of merit, based on perovskite nanostructures with bright-exciton ground states or on shell engineering of core/shell heterostructures, and integrates them with the resonators of NIP-1, moving the most integrable emitters toward the coherence needed for quantum light along the integrability–coherence axis of the Research Plan."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-4, Quantum emitters: from integrability to coherence, of the PHO-QUS Research Plan, and serves L1 (deterministic QD track) and the integrability–coherence program. The work package is defined as follows. NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols."},{"t":"p","x":"Starting point. What sets the trade-off between integrability and coherence across epitaxial, colloidal and 2D emitters coupled to the same resonator, and which material strategy (exciton band alignment, strain, shell engineering) gives high-purity, indistinguishable emission from colloidal nanomaterials? Observable: purity, linewidth, indistinguishability and extraction versus coupling and temperature, on one protocol. Metric moved by this fellowship. Epitaxial QDs: entanglement-based QKD with QD sources [1, 2], urban-network and teleportation experiments [3, 4], waveguide-integrated and cavity-enhanced sources [5, 6], and droplet-etched InGaAs QDs with Unicamp participation [7, 8]. Colloidal emitters: bright/dark exciton inversion in strain-graded QDs and lattice-distortion engineering of emission [9], optical gain by biexciton engineering and linewidth control in nanocrystals [10–12]; droplet-etched GaAs nanostructures grown at LNNano [13, 14]. 2D emitters: strain-engineered confinement and single-photon emitters in WSe2 [15–17]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Synthesize and characterize colloidal nanocrystals with bright-exciton band alignment (perovskite and strain-graded core/shell QDs), measuring exciton fine structure and spin coherence in the magneto-optical cryostat."},{"t":"p","x":"2. Apply linewidth engineering (shell design, surface chemistry) to reach a radiatively limited linewidth in resonator-coupled nanocrystals [9]."},{"t":"p","x":"3. Deposit and position the best nanocrystals on SiN rings, measure Purcell enhancement, linewidth and g(2)(0) at 4 K, and report the comparison with the epitaxial route for the L1 source decision."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Nanocrystal synthesis and shell engineering in the Padilha laboratory, deterministic deposition on resonators, coherent and single-emitter spectroscopy on the low-temperature multiuser system, resonator fabrication at CCSNano."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: design and training on the shared stack; definition of the device generation to be fabricated."},{"t":"p","x":"• Months 7–24: device fabrication and characterization against the WP metric; qualifying exam."},{"t":"p","x":"• Months 25–36: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 37–48: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Nanocrystals on SiN rings; Purcell factor measured","annual report Y1","Linewidth-engineered emitters at 4 K; g(2)(0) measured","D1","Comparison across emitter classes published","annual report Y3","Thesis"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 (resonators), XC-1 (cryogenics) and NIP-4 DD1 (shared protocol). A short research stay in an integrated-emitter laboratory abroad in Year 3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two publications; new colloidal emitters with a large T2/T1 figure of merit and their resonator-coupled benchmark; training in nanomaterials chemistry, integrated photonics and quantum-optical spectroscopy."}],"refs":{"1":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","2":"Christian Schimpf et al. Adv. Photon. 3.6 (2021).","3":"Gonzalo Carvacho et al. Optica 9.5 (2022), pp. 572–578.","4":"Alessandro Laneve et al. Nat. Commun. 16.1 (2025).","5":"Florian Hornung et al. Nano Lett. 24.4 (2024), pp. 1184–1190.","6":"Michele B. Rota et al. eLight 4.1 (2024).","7":"Saimon F. Covre Da Silva et al. Nano Lett. 26.3 (2026), pp. 953–960.","8":"Evandro Martin Lanzoni et al. Nanotechnology 33.16 (2022).","9":"Jeong Woo Park et al. Nat. Commun. 17.1 (2026).","10":"Gabriel Nagamine et al. ACS Photon. 7.8 (2020), pp. 2252 –2264.","11":"Albert Liu et al. ACS Nano 15.4 (2021), pp. 6499 –6506.","12":"Albert Liu et al. Sci. Adv. 7.1 (2021).","13":"Saimon Filipe Covre da Silva et al. Nanoscale Res. Lett. 12 (2017), p. 61.","14":"Vanessa Orsi Gordo et al. Nanotechnology 31 (2020), p. 255202.","15":"Caique Serati De Brito et al. Appl. Phys. Lett. 121.7 (2022).","16":"Caique Serati de Brito et al. Nano Lett. 24.42 (2024), pp. 13300 –13306.","17":"F.S. Covre et al. Nanoscale 14.15 (2022), pp. 5758 –5768."}},{"id":"f-QEPS-2_DR1","group":"DR","title":"QEPS-2 DR1: LN-on-Si piezo-optomechanical transducer at millikelvin temperatures (L4)","pages":2,"file":"DR/QEPS-2_DR1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow (continuing an MSc on microwave cavities with Rouxinol in the QuaDRA program) builds the L4 transducer: an LN-on-Si piezo-optomechanical crystal operated at millikelvin temperature in the sideband-resolved regime, wire-bonded to a superconducting circuit fabricated at Unicamp, with the Year-5 threshold of bidirectional efficiency η ≥10−3 and added noise nadd ≤5 in pulsed operation."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-2, Piezo-optomechanical microwave–optical transduction, of the PHOQUS Research Plan, and serves L4 (microwave–optical transducer). The work package is defined as follows. QEPS-2 owns the L4 lighthouse. It develops lithium-niobate-on-silicon and diamond optomechanical crystals operated in the sideband-resolved regime at millikelvin temperatures, and couples them to superconducting circuits fabricated at Unicamp."},{"t":"p","x":"Starting point. How do piezo-optomechanical coupling, cryogenic dissipation and optically induced heating constrain coherent transfer of quantum information between microwave and optical fields (H-C)? Observable: non-classical correlations or state-transfer fidelity beyond η and nadd."},{"t":"p","x":"Metric moved by this fellowship. Optomechanical quantum teleportation and low-noise single phonon–photon conversion with Delft [1, 2]; dissipative optomechanics at GHz [3]; high-rate photon–phonon pairs in 2D optomechanical crystals [4]; diamond optomechanical crystal design [5]; quasiparticle dynamics of optically irradiated qubits and loss in mechanical resonators coupled to superconducting circuits (Benevides) [6, 7]; reproducible Josephson-junction fabrication by e-beam lithography (Rouxinol) [8]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design and fabricate LN-on-Si optomechanical crystals with IDT coupling and measure g0, κ, Qm and Cem at 4 K and at mK (design rules from NIP-2, design transfer from Delft [2, 9])."},{"t":"p","x":"2. Demonstrate microwave-to-optical conversion in pulsed operation and quantify efficiency and added noise with a calibrated microwave chain."},{"t":"p","x":"3. Couple the transducer to a superconducting resonator or qubit and demonstrate optical readout."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Fabrication at CCSNano, superconducting circuits with Rouxinol’s process [8], cryogenic measurements on the dilution refrigerator with the XC-1 platform, microwave characterization (VNA, calibrated noise chain), optical readout through the QPC-3 cryogenic fiber attach."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: design and training on the shared stack; definition of the device generation to be fabricated."},{"t":"p","x":"• Months 7–24: device fabrication and characterization against the WP metric; qualifying exam."},{"t":"p","x":"• Months 25–36: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 37–48: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","First LN-on-Si OMC with IDT; parameters at 4 K","annual report Y1"]},{"t":"p","x":"mK operation; ground-state occupation; first MW→optical conversion annual report Y2 η and nadd measured; coupling to a superconducting resonator L4 generation 2 η ≥10−3, nadd ≤5; thesis L4-T (Y5)"},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-2 (phononics), XC-1 (cryogenics), QPC-3 (cryogenic fiber). BEPE period in the Gröblacher group (TU Delft) in Year 2–3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; the first MW–optical transducer in Latin America; training in optomechanics, superconducting circuits and cryogenics."}],"refs":{"1":"Niccolò Fiaschi et al. Nat. Photon. 15.11 (2021), pp. 817 –821.","2":"Liu Chen et al. Nat. Commun. 17 (1 2026), pp. 1187–.","3":"André G Primo et al. Nat. Commun. 14 (1 2023), p. 5793.","4":"Felix M. Mayor et al. Nat. Commun. 16 (1 2025), pp. 2576–.","5":"Flávio Moraes et al. J. Opt. Soc. Am. B 39.10 (2022), pp. 2735–2741.","6":"R. Benevides et al. Phys. Rev. Lett. 133.6 (2024).","7":"Raquel Garcia-Belles et al. PRX Quantum 7.3 (2026).","8":"Arthur M. Rebello et al. Nanomaterials 14.9 (2024).","9":"Matthew J. Weaver et al. Nat. Nanotechnol. 19 (2024), pp. 166–172."}},{"id":"f-QPC-2_DR1","group":"DR","title":"QPC-2 DR1: PPLN-TFLN degenerate OPO with on-chip SHG pump and balanced-homodyne readout (L2)","pages":2,"file":"DR/QPC-2_DR1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow (continuing an MSc at USP) owns the primary L2 route: a degenerate χ(2) OPO on PPLN-TFLN with on-chip second-harmonic pump generation and an on-chip balanced-homodyne beamsplitter, measured first with off-chip detection (Year-3 threshold: ≥1.5 dB, or ≥1.0 dB with on-chip SHG and beamsplitter) and then with heterogeneous on-chip photodiodes (Year-5 goal: ≥3 dB at the photodiodes)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-2, Continuous-variable quantum photonics on SiN and PPLN-TFLN, of the PHOQUS Research Plan, and serves L2 (integrated squeezing with on-chip readout) and L3 (squeezed light for the spectrometer). The work package is defined as follows. QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tracks (Kerr in SiN, χ(2) in PPLN-TFLN [1]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far."},{"t":"p","x":"Starting point. How are quantum noise and multimode correlations redistributed in integrated χ(2) and χ(3) circuits, and what limits their reconstruction (H-A, H-B)? Observable: calibrated covariance matrices and tomography versus loss, visibility and mode structure."},{"t":"p","x":"Metric moved by this fellowship. Tomography of an integrated χ(3) OPO [2]; assumption-free measurement of intense-field sidebands [3]; CV entanglement and hidden entanglement in four-wave-mixing OPOs [4, 5]; diagnostics for CV cluster states [6]; structured quantum light (Barros) [7]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design the PPLN-TFLN OPO (poling period, escape efficiency ≥0.9) and the SHG and beamsplitter sections; obtain poled chips through the Lončar collaboration and, from Year 3, at CCSNano."},{"t":"p","x":"2. Measure directly ≥1.5 dB of squeezing with the USP homodyne bench and a calibrated shot-noise reference."},{"t":"p","x":"3. Integrate detection on chip and reach ≥3 dB measured at the photodiodes, with calibrated multi-angle quadrature acquisition for numerical state reconstruction."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Nonlinear design and poling, TFLN fabrication at CCSNano, homodyne detection and tomography on the USP bench (Thematic 22/09436-5 infrastructure), loss budget per element as in Section 4 of the Research Plan (escape, facet, visibility, quantum efficiency). Heterogeneous photodiodes via a partner foundry or in-house bonding (to be defined with QPC-3)."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: design and training on the shared stack; definition of the device generation to be fabricated."},{"t":"p","x":"• Months 7–24: device fabrication and characterization against the WP metric; qualifying exam."},{"t":"p","x":"• Months 25–36: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 37–48: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","OPO design and first poled chips; SHG measured","annual report Y1","Squeezing measured off chip from the TFLN OPO","D2 (L2 track choice, month 30)","≥1.5 dB directly measured; on-chip beamsplitter characterized","L2-T","On-chip photodiodes; ≥3 dB measured; thesis","L2 goal (Y5)"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 (resonator designs), NIP-3 (pump-control elements), QPC-3 (facets) and QEPS-1 (the squeezed light for L3). BEPE period in the Lončar group (Harvard) on TFLN poling and heterogeneous integration in Year 2."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two to three publications; the first integrated squeezer with on-chip readout; training across nonlinear design, TFLN fabrication and CV quantum measurement."}],"refs":{"1":"Jie Zhao et al. Sci. Adv. 11 (2025), eadu4888.","2":"Roger Alfredo Kögler et al. Opt. Lett. 49.11 (2024), pp. 3150–3153.","3":"F.A.S. Barbosa et al. Phys. Rev. A 102.6 (2020).","4":"A. Montaña Guerrero et al. Phys. Rev. Lett. 129.16 (2022).","5":"R.L. Rincón Celis et al. Phys. Rev. Lett. 137.9 (2026).","6":"Carlos González-Arciniegas et al. PRX Quantum 2 (3 2021), p. 030343.","7":"Markus Hiekkamäki et al. Nat. Photon. 16.12 (2022), pp. 828 –833."}},{"id":"f-QPC-2_DR2","group":"DR","title":"QPC-2 DR2: Kerr squeezing in coupled SiN microresonators and full state tomography (L2 parallel track)","pages":2,"file":"DR/QPC-2_DR2_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The fellow (continuing an MSc at USP) develops the parallel L2 route, Kerr squeezing in coupled SiN microresonators fabricated at CCSNano, measured on the USP tomography bench, starting with the first convergence milestone of the center (M1.0: a CCSNano SiN oscillator measured at USP) and aiming at ≥3 dB measured squeezing by Year 3."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QPC-2, Continuous-variable quantum photonics on SiN and PPLN-TFLN, of the PHOQUS Research Plan, and serves L2 (integrated squeezing with on-chip readout) and L3 (squeezed light for the spectrometer). The work package is defined as follows. QPC-2 owns the L2 lighthouse. It develops squeezed-light sources on two tracks (Kerr in SiN, χ(2) in PPLN-TFLN [1]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far."},{"t":"p","x":"Starting point. How are quantum noise and multimode correlations redistributed in integrated χ(2) and χ(3) circuits, and what limits their reconstruction (H-A, H-B)? Observable: calibrated covariance matrices and tomography versus loss, visibility and mode structure."},{"t":"p","x":"Metric moved by this fellowship. Tomography of an integrated χ(3) OPO [2]; assumption-free measurement of intense-field sidebands [3]; CV entanglement and hidden entanglement in four-wave-mixing OPOs [4, 5]; diagnostics for CV cluster states [6]; structured quantum light (Barros) [7]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup (M1.0) and establish the shared squeezing protocol."},{"t":"p","x":"2. Use the dispersion control of photonic molecules to suppress competing parametric processes and reach ≥3 dB measured below-threshold squeezing with η ≥0.6 [8]."},{"t":"p","x":"3. Perform full state tomography of the integrated source and compare with the TFLN track at D2."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Homodyne detection and tomography (USP), resonator design with NIP-1, loss-budget metrology with QPC-3; assumption-free sideband methods of the group [3]."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: design and training on the shared stack; definition of the device generation to be fabricated."},{"t":"p","x":"• Months 7–24: device fabrication and characterization against the WP metric; qualifying exam."},{"t":"p","x":"• Months 25–36: integration with the lighthouse chain; BEPE period (6–12 months) in the associate laboratory."},{"t":"p","x":"• Months 37–48: lighthouse measurement campaign, thesis writing and defense."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","M1.0: CCSNano SiN OPO measured at USP","M1.0","Squeezing from a coupled-resonator DOPO measured","D2","≥3 dB measured; tomography","L2-T (SiN track)","Multimode squeezing in the microcomb regime; thesis","H3 seed"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-1 and QPC-3; the M1.0 milestone is the first joint measurement of the Unicamp and USP groups. BEPE period in a CV integrated-photonics laboratory in Year 3."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"Two publications; the shared squeezing protocol; training in integrated photonics and CV quantum optics."}],"refs":{"1":"Jie Zhao et al. Sci. Adv. 11 (2025), eadu4888.","2":"Roger Alfredo Kögler et al. Opt. Lett. 49.11 (2024), pp. 3150–3153.","3":"F.A.S. Barbosa et al. Phys. Rev. A 102.6 (2020).","4":"A. Montaña Guerrero et al. Phys. Rev. Lett. 129.16 (2022).","5":"R.L. Rincón Celis et al. Phys. Rev. Lett. 137.9 (2026).","6":"Carlos González-Arciniegas et al. PRX Quantum 2 (3 2021), p. 030343.","7":"Markus Hiekkamäki et al. Nat. Photon. 16.12 (2022), pp. 828 –833.","8":"Y. Shen et al. Optica 12.3 (2025), p. 302."}},{"id":"f-NIP-1_MS1","group":"MS","title":"NIP-1 MS1: Characterization of pair generation and coincidence statistics in SiN microrings","pages":2,"file":"MS/NIP-1_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow builds and validates the center’s shared pair-source characterization protocol on SiN microrings: singles and coincidence rates, CAR, heralded g(2)(0) and pump rejection, as a function of pump power and coupling, so that every source of the center is compared with the same numbers."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-1, Kerr and electro-optic combs, DOPO in coupled microresonators, of the PHOQUS Research Plan, and serves L1 (SiN pair source), L2 (SiN Kerr squeezing track) and L3 (chip combs). The work package is defined as follows. Coupled SiN microresonators (photonic molecules) give independent control of dispersion and mode hybridization, which we use to select degenerate parametric oscillation and suppress competing processes [1, 2]. NIP-1 delivers (i) high-Q SiN rings for SFWM pair generation (L1), (ii) dispersion-engineered resonators for Kerr squeezing (L2, SiN track), and (iii) Kerr and EO combs for dual-comb spectroscopy (L3), including spectral extension to the blue and UV [3]."},{"t":"p","x":"Starting point. To what extent do engineered coupling and hybridization in photonic molecules give independent control of parametric pathways and multimode quantum correlations beyond a matched single-resonator baseline (H-A)? Observable: squeezing spectra, quadrature covariances and mode correlations versus coupling and detuning, against quantitative coupled-mode predictions and control devices."},{"t":"p","x":"Metric moved by this fellowship. Tunable DOPO, mapping of nonlinear mode interactions and hybridized-band oscillation in coupled SiN resonators [4–6]; color symmetry breaking with MPL [7]; dispersion engineering of high-Q resonators [8]; visible-to-telecom parametric oscillation in CMOS-compatible OPOs [9, 10] and tunable squeezing in coupled SiN rings [11]; 20 GHz resonant EO comb across the S/C/L bands and mid-IR χ(2) combs [12, 13]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Assemble and calibrate the photon-counting setup (SNSPDs, time tagger, filters) and document the measurement protocol."},{"t":"p","x":"2. Measure CAR and heralded g(2)(0) versus pump power on rings of the M1.1 baseline and extract brightness and noise contributions."},{"t":"p","x":"3. Deliver the protocol and a reference dataset to QPC-1 and NIP-4 for the D1 source down-select."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Swept-laser characterization of Q and coupling; pulsed and CW pumping; coincidence histograms with the time tagger; a noise model separating accidentals, pump leakage and Raman background, fitted to the data. The fellow uses the existing NIP-1 bench and the shared SNSPD systems."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Setup calibrated; protocol written","annual report","CAR and g(2)(0) versus power on three ring designs","D1 input","Dissertation; dataset and protocol handed to QPC-1 and NIP-4","D1"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with QPC-1 (filters, receiver) and NIP-4 (same protocol applied to QD sources). No international stay is foreseen; the fellow attends the center’s school."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"One publication or conference paper on the noise model; the shared protocol; a candidate for a DR fellowship in QPC-1 or NIP-1 from Year 3."}],"refs":{"1":"Alexander K Vorobyev et al. Phys. Rev. Appl. 24 (2025), p. 054054.","2":"Ryotatsu Yanagimoto et al. Nature 649 (2026), pp. 330–337.","3":"Alekhya Ghosh et al. arXiv preprint arXiv:2603.03255 (2026).","4":"Nathalia B Tomazio et al. ACS Photon. 12 (1 2025), 227 – 235.","5":"Luca O. Trinchão et al. Optics Letters, 51 (6 2026), pp. 1387–1390.","6":"Luca O. Trinchão et al. APL Photon. 11.6 (2026).","7":"Luca O. Trinchão et al. Laser Photon. Rev. (2026).","8":"Marvyn Inga et al. APL Photon. 5.11 (2020).","9":"Renato R. Domeneguetti et al. Optica 8.3 (2021), pp. 316 –322.","10":"Yun Zhao et al. Optica 7.2 (2020), pp. 135 –141.","11":"Avik Dutt et al. Opt. Lett. 41.2 (2016), pp. 223–226.","12":"Marlon M. Correia et al. APL Photon. 11.6 (2026).","13":"Alexander J. Lind et al. Phys. Rev. Lett. 124 (13 2020)."}},{"id":"f-NIP-2_MS1","group":"MS","title":"NIP-2 MS1: Brillouin gain and phonon lifetime measurements in TFLN waveguides at 300 K and 4 K","pages":2,"file":"MS/NIP-2_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow measures Brillouin gain spectra and phonon lifetimes in TFLN waveguides at 300 K and 4 K, providing the first temperature-dependent dataset for the phononic design of L4."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-2, Brillouin scattering and optomechanics in TFLN, of the PHOQUS Research Plan, and serves L4 (phononic design rules and Brillouin/optomechanical devices on TFLN). The work package is defined as follows. NIP-2 develops phonon-mediated devices on TFLN: narrow-linewidth Brillouin sources and GHz acoustic resonators whose design rules (piezoelectric coupling, phonon confinement, mechanical Q at low temperature) are transferred to the transducers of QEPS-2."},{"t":"p","x":"Starting point. Which phonon-mediated mechanisms (Brillouin gain and noise, piezoelectric coupling, phonon dissipation at low temperature) set the coherence limits of acousto-optic interactions in TFLN (H-C)? Observable: Brillouin gain and noise spectra and optomechanical rates versus temperature."},{"t":"p","x":"Metric moved by this fellowship. Cross-polarized SBS in LiNbO3 waveguides [1] and SBS mediated by surface acoustic waves in LN [2]; milliwatt UV generation in sidewall-poled LN with Harvard, which also gives access to TFLN poling [3]; intermodal Brillouin scattering in fibers [4]; Brillouin optomechanics in the quantum ground state (Benevides) [5]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Operate the cross-polarized Brillouin spectroscopy setup and extract gain coefficient and linewidth versus waveguide geometry."},{"t":"p","x":"2. Repeat the measurement at 4 K on the XC-1 platform and quantify the change in phonon lifetime."},{"t":"p","x":"3. Deliver the dataset to NIP-2 DD1 and QEPS-2."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Pump–probe Brillouin spectroscopy with lock-in detection, fiber-coupled TFLN chips, 4 K closed-cycle cryostat with fiber access."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Setup operating at 300 K","annual report","4 K dataset","NIP-2 design rules","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with XC-1 for cryogenic access and with QEPS-2 as the user of the data."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"One publication; the temperature-dependent Brillouin dataset; a candidate for the branch-reserve DD or a DR in QEPS-2."}],"refs":{"1":"Caique C. Rodrigues et al. Phys. Rev. Lett. 134 (11 2025), p. 113601.","2":"Caique C. Rodrigues et al. J. Opt. Soc. Am. B 40.5 (2023), pp. D56 –D63.","3":"C. A. A. Franken et al. Nat. Commun. 17 (1 2026), pp. 3651–.","4":"Paulo F. Jarschel et al. APL Photon. 6.3 (2021).","5":"H.M. Doeleman et al. Phys. Rev. Res. 5.4 (2023)."}},{"id":"f-NIP-4_MS1","group":"MS","title":"NIP-4 MS1: Comparative g(2) and linewidth protocol for epitaxial colloidal and 2D emitters on the same resonator designs","pages":2,"file":"MS/NIP-4_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow establishes the comparative measurement protocol (g(2)(0), linewidth, Purcell factor, extraction) of NIP-4 and applies it to the emitter classes as they are integrated: colloidal and 2D emitters deposited on SiN resonators, and epitaxial QDs processed with their membranes and transferred by NIP-4 PD1 (III–V dots are not transferred individually)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package NIP-4, Quantum emitters: from integrability to coherence, of the PHO-QUS Research Plan, and serves L1 (deterministic QD track) and the integrability–coherence program. The work package is defined as follows. NIP-4 brings all semiconductor-emitter expertise of the center into one program organized along an integrability–coherence axis, with the integrated resonators of NIP-1 as the common platform. At one end, colloidal quantum dots can be deposited on SiN, Si and LN resonators with little process overhead, but have long T1 and short T2 (a small T2/T1 ratio); at the other, epitaxial droplet-etched QDs grown by MBE are among the most coherent deterministic emitters available but are harder to integrate; strain-localized emitters in 2D materials sit in between. The emitters themselves are developed here, not taken as given: the work package (i) develops single-photon emitting platforms based on epitaxial QDs, colloidal QDs and 2D materials, with waveguide-coupled epitaxial QDs (also usable as entangled-pair sources) as the deterministic route for L1, including telecom conversion, (ii) uses material engineering (bright-exciton band alignment in perovskite and shell-engineered nanocrystals), resonator coupling and linewidth control to push colloidal and 2D emitters toward the coherence needed for quantum light, and (iii) compares all three classes on the same resonator designs and measurement protocols."},{"t":"p","x":"Starting point. What sets the trade-off between integrability and coherence across epitaxial, colloidal and 2D emitters coupled to the same resonator, and which material strategy (exciton band alignment, strain, shell engineering) gives high-purity, indistinguishable emission from colloidal nanomaterials? Observable: purity, linewidth, indistinguishability and extraction versus coupling and temperature, on one protocol. Metric moved by this fellowship. Epitaxial QDs: entanglement-based QKD with QD sources [1, 2], urban-network and teleportation experiments [3, 4], waveguide-integrated and cavity-enhanced sources [5, 6], and droplet-etched InGaAs QDs with Unicamp participation [7, 8]. Colloidal emitters: bright/dark exciton inversion in strain-graded QDs and lattice-distortion engineering of emission [9], optical gain by biexciton engineering and linewidth control in nanocrystals [10–12]; droplet-etched GaAs nanostructures grown at LNNano [13, 14]. 2D emitters: strain-engineered confinement and single-photon emitters in WSe2 [15–17]."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Operate the low-temperature micro-photoluminescence and photon-correlation setup and document the protocol."},{"t":"p","x":"2. Measure the integrated emitters with the same protocol and resonator designs as each class becomes available."},{"t":"p","x":"3. Deliver the dataset to NIP-4 and QPC-1."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Cryogenic micro-PL, Hanbury Brown–Twiss correlation, resonator transmission."},{"t":"p","x":"Phases."},{"t":"p","x":"• Months 1–6: coursework and training on the measurement setup; literature."},{"t":"p","x":"• Months 7–18: measurements and device iterations against the WP metric."},{"t":"p","x":"• Months 19–24: dissertation and hand-over of the protocol or module to the WP."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Center milestone it feeds","Protocol written","Three-class dataset","D1 input","Dissertation"]},{"t":"h1","x":"6. Integration, infrastructure and international exchange","id":"s6"},{"t":"p","x":"Works with NIP-4 DD1/DR1 and NIP-1."},{"t":"h1","x":"7. Expected results and training","id":"s7"},{"t":"p","x":"One publication; the emitter benchmark; a candidate for a DR fellowship."}],"refs":{"1":"Christian Schimpf et al. Sci. Adv. 7 (2021), eabe8905.","2":"Christian Schimpf et al. Adv. Photon. 3.6 (2021).","3":"Gonzalo Carvacho et al. Optica 9.5 (2022), pp. 572–578.","4":"Alessandro Laneve et al. Nat. Commun. 16.1 (2025).","5":"Florian Hornung et al. Nano Lett. 24.4 (2024), pp. 1184–1190.","6":"Michele B. Rota et al. eLight 4.1 (2024).","7":"Saimon F. Covre Da Silva et al. Nano Lett. 26.3 (2026), pp. 953–960.","8":"Evandro Martin Lanzoni et al. Nanotechnology 33.16 (2022).","9":"Jeong Woo Park et al. Nat. Commun. 17.1 (2026).","10":"Gabriel Nagamine et al. ACS Photon. 7.8 (2020), pp. 2252 –2264.","11":"Albert Liu et al. ACS Nano 15.4 (2021), pp. 6499 –6506.","12":"Albert Liu et al. Sci. Adv. 7.1 (2021).","13":"Saimon Filipe Covre da Silva et al. Nanoscale Res. Lett. 12 (2017), p. 61.","14":"Vanessa Orsi Gordo et al. Nanotechnology 31 (2020), p. 255202.","15":"Caique Serati De Brito et al. Appl. Phys. Lett. 121.7 (2022).","16":"Caique Serati de Brito et al. Nano Lett. 24.42 (2024), pp. 13300 –13306.","17":"F.S. Covre et al. Nanoscale 14.15 (2022), pp. 5758 –5768."}},{"id":"f-QEPS-1_MS1","group":"MS","title":"QEPS-1 MS1: Classical chip-based dual-comb spectroscopy of CO2/CH4 and shot-noise-limited detection","pages":2,"file":"MS/QEPS-1_MS1_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"The MSc fellow demonstrates classical chip-based dual-comb spectroscopy of CO2/CH4 with two SiN microcombs and establishes the shot-noise-limited detection on which the squeezed-light test will be built."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"This plan is part of work package QEPS-1, Squeezed dual-comb spectroscopy, of the PHOQUS Research Plan, and serves L3 (squeezed dual-comb spectrometer). The work package is defined as follows. QEPS-1 owns the L3 lighthouse. It builds a dual-comb spectrometer seeded by the L2 squeezed light, first with fiber or EO combs and then with chip combs from NIP-1, and extends coverage to the mid-infrared and THz by differenc
