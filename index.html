acks (Kerr in SiN, χ(2) in PPLN-TFLN [102]), on-chip SHG pumping, balanced homodyne detection and full state tomography. A first convergence step is to measure CCSNano-fabricated coupled-resonator DOPOs with the USP tomography setup, replacing the externally fabricated devices used so far."},{"t":"p","x":"Physics question. How are quantum noise and multimode correlations redistributed in integrated χ(2) and χ(3) circuits, and what limits their reconstruction (H-A, H-B)? Observable: calibrated covariance matrices and tomography versus loss, visibility and mode structure. Starting point. Tomography of an integrated χ(3) OPO [36]; assumption-free measurement of intense-field sidebands [103]; CV entanglement and hidden entanglement in four-wave-mixing OPOs [35, 104]; diagnostics for CV cluster states [105]; structured quantum light (Barros) [106]."},{"t":"p","x":"Enables / metric: L2, L3; measured squeezing, purity, detection efficiency."},{"t":"p","x":"Y1–3: CCSNano SiN OPO measured at USP (M1.0); SiN squeezer ≥3 dB; TFLN OPO ≥1.5 dB; on-chip BHD."},{"t":"wp","x":"QPC-3 Low-loss fiber–chip quantum interfaces (Wiederhecker, Tomazio; Schmidt (IPHT))","wp":"QPC-3","id":"s23"},{"t":"p","x":"Loss at the chip boundary is the dominant penalty for every lighthouse. QPC-3 develops 3D micro-printed couplers and specialty-fiber interfaces [107] and cryogenic-compatible packaging, with a coupling loss budget tracked as a center-level metric."},{"t":"p","x":"Physics question. How do coupling, mode overlap and packaging convert optical loss into quantum-state infidelity, at 300 K and 4 K? Observable: a joint loss and fidelity budget per interface. Starting point. Two-photon polymerised micro-optics and resonators [108]; current Marie Skłodowska-Curie work on 3D nanoprinting at IPHT (Tomazio); industrial collaboration with Corning Inc. on fiber–chip coupling (Innovation Action Plan)."},{"t":"p","x":"Enables / metric: L1–L4; dB per facet at 300 K and 4 K."},{"t":"p","x":"Y1–3: ≤1.5 dB/facet at C-band by Year 3 (≤1 dB by Year 5); cryogenic fiber attach qualified at 4 K."},{"t":"h2","x":"5.3 Branch C: Quantum-Enhanced Photonic Sensing (QEPS)","id":"s24"},{"t":"wp","x":"QEPS-1 Squeezed dual-comb spectroscopy (Cruz, Martinelli, Nussenzveig, Barea)","wp":"QEPS-1","id":"s25"},{"t":"p","x":"QEPS-1 owns the L3 lighthouse. It builds a dual-comb spectrometer seeded by the L2 squeezed light, first with fiber or EO combs and then with chip combs from NIP-1, and extends coverage to the mid-infrared and THz by difference-frequency generation in GaP/GaAs and TFLN [18]. Its primary scientific output is a controlled test of whether frequency-dependent squeezing and multimode correlations give a statistically significant concentration-estimation advantage once mode matching, comb technical noise, transmission and detection losses are included: mode-resolved covariance data, a resource-matched classical control and estimator-level precision. Physics question. Under which resource constraints does a non-classical optical resource yield a net task-level estimation advantage in broadband multimode spectroscopy (H-B)? Observable: Fisher information or concentration precision against a resource-matched optimized classical reference. Starting point. Mid-IR comb generation and spectroscopy with χ(2) optics and suspended-Si waveguides [38, 39]; free-running 1 GHz dual-comb laser and 20 GHz EO comb [71, 109]; methane and CO sensing in hollow-core fiber [110]; near-infrared dual-comb spectroscopy with multipass cells targeting N2O, starting at USP in early 2027."},{"t":"p","x":"Enables / metric: L3; detected noise below the calibrated shot-noise reference, estimator-level speed-up at matched resources, ppm·m. Y1–3: Classical chip DCS of CO2/CH4/N2O (USP–Unicamp from 2027); squeezed-light injection test."},{"t":"wp","x":"QEPS-2 Piezo-optomechanical microwave–optical transduction (Alegre, Benevides, Rouxinol, Couto; Gröblacher (Delft))","wp":"QEPS-2","id":"s26"},{"t":"p","x":"QEPS-2 owns the L4 lighthouse. It develops lithium-niobate-on-silicon and diamond optomechanical crystals operated in the sideband-resolved regime at millikelvin temperatures, and couples them to superconducting circuits fabricated at Unicamp."},{"t":"p","x":"Physics question. How do piezo-optomechanical coupling, cryogenic dissipation and optically induced heating constrain coherent transfer of quantum information between microwave and optical fields (H-C)? Observable: non-classical correlations or state-transfer fidelity beyond η and nadd. Starting point. Optomechanical quantum teleportation and low-noise single phonon–photon conversion with Delft [45, 46]; dissipative optomechanics at GHz [32]; high-rate photon–phonon pairs in 2D optomechanical crystals [111]; diamond optomechanical crystal design [60]; quasiparticle dynamics of optically irradiated qubits and loss in mechanical resonators coupled to superconducting circuits (Benevides) [112, 113]; reproducible Josephson-junction fabrication by e-beam lithography (Rouxinol) [114]."},{"t":"p","x":"Enables / metric: L4; η, nadd, repetition rate."},{"t":"p","x":"Y1–3: Optomechanical crystal in the ground state at mK (dilution refrigerator); first MW→optical conversion."},{"t":"wp","x":"QEPS-3 Chip-integrated magnetometry (Florez, de Assis, Almeida)","wp":"QEPS-3","id":"s27"},{"t":"p","x":"QEPS-3 combines color-center defects in diamond with atomic-vapour interfaces for chip-integrated magnetometry, using the diamond platform of QEPS-2 and the squeezed-light resources of QPC-2. It seeds the Phase 2 field-sensor horizon (H2)."},{"t":"p","x":"Physics question. When does a quantum optical resource give a real magnetic-field estimation advantage on a chip at matched sensing resources? Observable: sensitivity versus an optimized classical reference under identical conditions. Starting point. Floquet and stroboscopic microwave spectroscopy of optically pumped magnetometers [37, 115]; ultrafast dynamics of NV-center ensembles [116]."},{"t":"p","x":"Enables / metric: H2; magnetic sensitivity (T/√ Hz)."},{"t":"p","x":"Y1–3: Benchmark vapour-cell magnetometer coupled to a photonic chip; first squeezed-light readout."},{"t":"h2","x":"5.4 Cross-cutting platform: acoustic and cryogenic quantum interfaces (XC)","id":"s28"},{"t":"wp","x":"XC-1 Acoustic control and cryogenic operation across branches (Couto, Deneke, Alegre, Wiederhecker, Benevides)","wp":"XC-1","id":"s29"},{"t":"p","x":"Surface acoustic waves (SAW) and cryogenic operation are needed in all three branches, and XC-1 provides them as a shared platform. SAW on piezoelectric substrates (LN, GaAs) modulate excitons, trions and quantum emitters (NIP-4), drive Brillouin and optomechanical interactions (NIP-2), and offer an acoustic route to the microwave interface of L4 (QEPS-2). The IFGW Cryogenics Facility supplies the 4 K and mK operation required by NIP-4, QPC-3 packaging and L4. XC-1 also hosts strain engineering of emitters on semiconductor nanomembranes."},{"t":"p","x":"Physics question. What limits acoustic control of emitters and phonons at low temperature (mechanical dissipation, heating, coupling strength) (H-C)? Observable: modulation contrast and coherence versus temperature and drive. Starting point. Acoustically driven Stark effect and acoustic modulation of excitonic complexes in 2D heterostructures [117, 118]; SAW-mediated SBS in LN waveguides [72]; single-QD optomechanics [119, 120]; rolled-up quantum wells and strain-free GaAs nanostructures [121]; coordination of the IFGW Cryogenics Facility (EMU 2023/17024-1)."},{"t":"p","x":"Enables / metric: L1 (QD track), L4; SAW modulation depth, operating temperature, cryogenic uptime. Y1–3: SAW delay lines on TFLN and GaAs chips; shared 4 K/mK measurement schedule."},{"t":"h2","x":"5.5 Fellowships and their assignment to work packages","id":"s30"},{"t":"p","x":"FAPESP fellowships are the main instrument through which the work packages are staffed, and their activity plans are submitted as separate documents. To keep those plans traceable to this Research Plan, every fellowship carries a label formed by the work package it serves and its type, DD (direct PhD), DR (PhD), PD (postdoc) or MS (MSc), as in NIP-1 DD1; the fellowship activity plans use these labels as titles and cite the corresponding work package, lighthouse and milestones. The allocation rule is uniform (Table 2): the Principal Investigator (PR) and each of the Co-Principal Investigators (PPs) host one PhD and one postdoc fellowship in the work package they lead or co-lead; each branch receives one additional PhD fellowship, hosted by the co-leads of the work package without a PP of its own (NIP-2, QPC-3, QEPS-3), as a reserve that the Executive Committee may reassign at the decision points D1 and D2. Of the thirteen PhD fellowships, eight are direct-PhD (DD) and five are regular PhD (DR), with identical activity plans; the DR fellowships are placed with hosts whose groups already have MSc students in progress on the topic, so that these students are expected to continue into the center without a gap (two at USP, one at Mackenzie, two at IFGW). Each branch also receives three MSc fellowships for the two-year device and measurement tasks that feed the Year-3 thresholds, the entry point of the training pipeline (Section 7). Fellowships are requested in two waves, following the ramp of Section 8: postdocs, PP-hosted DD and the DR fellowships whose MSc candidates graduate in 2027 in Year 1; the branch reserves and the MSc fellowships from Year 2. Seven technical training fellowships (four TT-5, one TT-4A, two TT-4; labels TT5-01 to TT4-02) qualify the shared process, cryogenic, packaging and quantum-metrology capabilities of Section 6 as supervised training positions that end with the hand-over of documented procedures to the permanent facility staff; their plans use the same format."},{"t":"h1","x":"6. Shared infrastructure and common protocols","id":"s31"},{"t":"p","x":"One fabrication and packaging pathway. All lighthouse chips are made along a single route so that process knowledge accumulates in one place, under a dual-track strategy: devices on the critical path of the lighthouse milestones are fabricated through established processes (in-house SiN at CCSNano, external multi-project SiN runs and TFLN poling through the Lončar collaboration), while CCSNano develops the steps that add scientific value (poling, sputtered SiN, heterogeneous integration, packaging, 2D-material integration), each migrating to the critical path only after defined yield and reproducibility gates; because CCSNano, an academic facility, has no equipment redundancy, external backup runs and access to the Sisfóton-MCTI partner laboratories are budgeted. CCSNano (Unicamp) hosts the 100 kV electron-beam lithography system and the SiN and TFLN process modules, with film-thickness mapping, mid-infrared microscopy and chemical-mechanical polishing at USP for wafer preparation; the Photonicamp cleanroom complements it for packaging. III–V quantum dots are grown on the molecular-beam-epitaxy system at Unicamp (delivered and under installation; growth starts before the center); 2D materials are grown, transferred and characterized at MackGraphe (Mackenzie) and the heterostructure and low-vibration cryo-spectroscopy facilities of UFSCar; LNNano/CNPEM provides complementary lithogra-WP Host PhD (DD/DR) / postdoc labels MSc labels Feeds Branch A, NIP NIP-1 Wiederhecker (PR)"},{"t":"fig","x":["NIP-1 DD1, NIP-1 PD1","NIP-1 MS1","L1, L2, L3","NIP-2","Alegre (co-lead);","Wiederhecker","NIP-2 DD1 (branch reserve)","NIP-2 MS1","L4","NIP-3","de Matos","NIP-3 DR1, NIP-3 PD1","–","L1 (alt.), L2","NIP-4","Deneke; Padilha","NIP-4 DD1, NIP-4 DR1, NIP-4 PD1–PD2","NIP-4 MS1","L1 (QD track)","Branch B, QPC","QPC-1","Frateschi","QPC-1 DD1, QPC-1 PD1","QPC-1 MS1","M1.2, L1","QPC-2","Martinelli; Nussenzveig","QPC-2 DR1–DR2, QPC-2 PD1–PD2","QPC-2 MS1","L2, L3","QPC-3","Wiederhecker (co-lead);","Tomázio","QPC-3 DD1 (branch reserve)","QPC-3 MS1","L1–L4","Branch C, QEPS","QEPS-1","Cruz","QEPS-1 DD1, QEPS-1 PD1","QEPS-1 MS1","L3","QEPS-2","Alegre","QEPS-2 DR1, QEPS-2 PD1","QEPS-2 MS1","L4","QEPS-3","Florez (lead); de Assis","QEPS-3 DD1 (branch reserve)","QEPS-3 MS1","H2","Cross-cutting","XC-1","Couto","XC-1 DD1, XC-1 PD1","–","L1 (QD), L4","Total","8 DD (3 of them branch reserves) + 5 DR, 10 PD","9 MS"]},{"t":"cap","x":"Table 2: Fellowship allocation by work package. Labels are the titles of the separate fellowship activity plans; DD and DR fellowships share the same plan format. ; the Executive Committee may reassign reserve PhD fellowships at D1 and D2. phy and microscopy as an open facility. TFLN periodic poling, sputtered SiN and 3D nanoprinted couplers are obtained from the international associates in Years 1–3 and transferred to CCSNano by Year 5 (Section 2.3). Shared characterization and cryogenics. The center operates one quantum-characterization stack with common protocols and data formats (Data Management Plan): source metrics (pair rate, CAR, g(2)(0), indistinguishability) on the SNSPD systems at USP, Unicamp and Mackenzie; homodyne and tomography on the USP continuous-variable bench and, from Year 3, on chip; loss-budget protocols at 300 K and 4 K; microwave characterization up to 20 GHz (vector network analyzer); and the comb and spectroscopy instrumentation at Unicamp and USP. Cryogenic operation is provided by the IFGW Cryogenics Facility (helium liquefaction, Couto; 4 K systems; the dilution refrigerator with optical access requested for L4), by the new dilution-refrigerator laboratory of Benevides at USP and by the low-vibration cryostat at UFSCar (Gobato); superconducting circuits are fabricated at IFGW and USP; the XC-1 work package schedules this shared capacity and trains the Cryogenics Facility technicians in closed-cycle and dilution-refrigerator operation, which the facility does not yet run. This infrastructure is in three distinct states, kept apart in the Institutional Support document, which lists for each critical facility its status, responsible institution, commissioning or access date and backup route: operational, funded by FAPESP multi-user and Thematic grants of the team (electron-beam lithography, SiN and TFLN processing, the SNSPD systems, the CV bench, the comb instrumentation, the 4 K systems, the network analyzer); funded and under commissioning (the MBE system, the USP dilution refrigerator); and requested or still to be agreed (the IFGW dilution refrigerator with optical access, the deployed-fiber link, the processes transferred from the international associates). L4 milestones are tied to verified mK optical and microwave access, with the USP refrigerator as the fallback for the IFGW unit, and the transferred processes are qualified progressively at CCSNano (Section 2.3). PHOQUS funds operation for the center’s program, the shared technical staff and the missing links, chiefly packaging and cryogenic fiber attach."},{"t":"h1","x":"7. Integration with Innovation and Knowledge Diffusion","id":"s32"},{"t":"p","x":"The Innovation and Knowledge Diffusion plans are separate documents; here we state how they are wired into the research program, so that neither is an appendix to it."},{"t":"p","x":"Innovation. Innovation develops alongside the research without making discovery contingent on product development: where technically appropriate, each lighthouse yields a module that an external party can test while the discovery track advances from Year 1 (Section 8): the packaged QRNG (M1.2, month 24), the QKD evaluation testbed on deployed fiber (L1, Year 3), chip spectrometer modules for gas sensing (L3, Year 4–6) and, in Phase 2, transducer and network-node prototypes (H1). Partners are engaged early, as co-developers of the module specifications rather than as licensees of a finished device, and the Innovation Coordinator sits on the Executive Committee and reviews the lighthouse milestones with one question: which element of the chain is closest to a product and what is missing for a partner to try it. Process modules developed at CCSNano (SiN, poled TFLN, cryogenic packaging) are documented and offered through the CCSNano multi-user access model (an academic nanofabrication facility, not a foundry), with multi-project runs so that São Paulo companies and other groups can obtain devices. Student projects with an application target are routed through the Unicamp innovation ecosystem (Inova, LIF Empreende) and the Industry Advisory Board gives an annual opinion on the lighthouse roadmap; the detailed instruments, intellectual-property rules and partner list are in the Innovation Action Plan."},{"t":"p","x":"Knowledge Diffusion. The research program supplies the Diffusion plan with three things. First, a training pipeline that spans the whole chain, design, fabrication, packaging and quantum measurement, through the fellowships of Section 5.5, the MS fellowships being the entry point and the BEPE exchanges with the associates the international step; the annual two-week school in quantum optics and photonics organized by the team continues as the center’s school. Second, the lighthouse demonstrations themselves, which are designed to be shown: the QRNG, the entanglement link and the gas-sensing spectrometer become the core of laboratory visits and of an itinerant exhibition on quantum light, and the Diffusion Coordinator (USP) uses them as the thread of the plan’s public-engagement actions, including the AI-assisted interactive material on quantum-optics concepts. Third, open data and open process documentation under the Data Management Plan, so that the center’s measurements and fabrication recipes are reusable outside it. The school continues the São Paulo School of Advanced Science in quantum and nonlinear photonics (FAPESP 25/08613-9, first edition in 2026); the exhibition partner is proposed in the Diffusion Action Plan."},{"t":"h1","x":"8. Detailed schedule for Years 1–3","id":"s33"},{"t":"p","x":"Figure 3 gives the quarterly plan for the first three years (Year 1: June 2027 to May 2028). Year 1 is deliberately a consolidation year. Recruiting PhD students and postdocs takes up to eighteen months, so Year-1 output comes from the ongoing lines of each group listed as starting points in Section 5, and no lighthouse-specific result is expected before Year 2. Year 1 does, however, contain the first concrete convergence steps between groups that have not yet published together, such as measuring CCSNano-fabricated SiN oscillators with the USP tomography setup (M1.0) and sharing SAW and cryogenic infrastructure across branches (XC-1). The schedule is built backwards from the two Year-3 lighthouse thresholds (L1-T, L2-T) and contains two formal decision points at which parallel approaches are down-selected, so that resources are concentrated before the Year-4 integration test (L3). Progress against milestones is reviewed at the annual meeting and by the International Advisory Committee."},{"t":"p","x":"Discovery track. Alongside the integration milestones, the schedule carries early scientific deliverables that do not wait for the lighthouses: in Years 1–2, device-physics and CV results from the groups’ running lines (photonic-molecule parametric dynamics, Brillouin and optomechanics in TFLN, hidden CV entanglement) and the first cross-institution physics result, for which M1.0 fixes the shared question, the data protocol and the criteria for a joint manuscript (S1); in Years 2–3, quantitative quantum-noise and correlation studies in photonic molecules and χ(2) circuits (H-A) and the first joint result of the comb and integrated-photonics groups, from a common comb-noise protocol to a joint spectroscopic measurement (S2); in Years 3–4, the chip-squeezer dual-comb result of L3 as an independent scientific output. These items are reviewed with the same discipline as the milestones, with the evidence (model, calibrated data, joint authorship) stated in advance."},{"t":"h1","x":"9. Risk management and parallel approaches","id":"s34"},{"t":"p","x":"Each lighthouse has at least one technically independent route to its threshold, and the decision points D1 and D2 (Table 3) are the moments at which routes are down-selected. The table distinguishes risks to the best integrated outcome of one lighthouse from risks to the center’s scientific output as a whole; the discovery track of Section 8 is the mitigation for the latter. The main risks and mitigations are listed in Table 4."},{"t":"h1","x":"10. Goals, metrics and impact over eleven years","id":"s35"},{"t":"p","x":"Table 5 collects the center’s goals, the metrics by which they will be judged and their expected impact, organized by the FAPESP reporting calendar: annual Scientific Reports, comprehensive evaluations in Years 3, 5 and 8, and the end of the eleven-year horizon. Phase 1 entries are commitments taken from Tables 1 and 3; Phase 2 entries are indicative and will be re-planned at the Year-5 evaluation, with the International Advisory Committee, Year 1 Year 2 Year 3 Q1 Q2 Q3 Q4 Q1 Q2 Q3 Q4 Q1 Q2 Q3 Q4 A · NIP NIP-1 SiN process baseline M1.1 NIP-1 coupled-ring squeezer / DOPO designs NIP-1 comb pair for DCS NIP-2 Brillouin source; GHz resonators at 4 K NIP-3 TMD SHG on SiN; 2D pump control NIP-3 TMD SPDC on SiN (pair source for L1)"},{"t":"fig","x":["NIP-4 QD growth; waveguide and resonator coupling","B · QPC","QPC-1 QRNG chip and module","M1.2","QPC-1 BBM92 receiver; field link","L1-T","QPC-2 SiN Kerr squeezer","QPC-2 PPLN-TFLN OPO + on-chip BHD","L2-T","QPC-3 couplers; cryogenic packaging","C · QEPS","QEPS-1 classical chip DCS","QEPS-1 squeezed-light injection test","QEPS-2 OM crystal design and fabrication","QEPS-2 mK characterization","QEPS-3 vapour cell – chip coupling","XC","XC-1 SAW devices on TFLN/GaAs; 4 K/mK scheduling","Center","Recruitment of PhD students and postdocs","M1.0 first CCSNano SiN OPO measured at i-component measurement chain (L3) and, in its first steps, the microwave boundary (L4). Phase 2 (Years 6–11) combines the lighthouses into systems that no single group can build, and that is where the eleven-year instrument is needed rather than a sequence of Thematic projects. Three timescales exceed a five-year grant. Process maturation: a fabrication module (SiN Risk Mitigation / parallel route Trigger L1 Fiber-coupled pair rate limited by coupling loss or pump-noise leakage QPC-3 couplers; on-chip pump rejection;"},{"t":"fig","x":["TFLN SPDC and QD sources as parallel routes","D1 (month 24)","L1","Deployed-fiber access or drift delays field test","Spooled-fiber emulation first; active","polarization/timing stabilization","month 30","All","CCSNano tool downtime (no equipment","redundancy)","Budgeted external backup runs; service","contracts and spares; Sisfóton partner-lab","access","continuous","L2","Squeezing loss in the on-chip SHG and","homodyne circuit","SiN Kerr track with off-chip detection meets","threshold; loss budget per element tracked","D2 (month 30)","L2","On-chip photodiodes fall behind schedule","L2 integration goal slips; L3 proceeds on the","chip output path with off-chip readout","D2 (month 30)","L2","TFLN periodic-poling yield","Poled chips from the Lončar group and a","commercial TFLN foundry run in parallel to","in-house poling","month 18","L3","Comb technical noise masks squeezing","Year-4 threshold uses low-noise fiber/EO","combs; chip combs only for the goal","month 42","L4","Mechanical Q or optical absorption heating at","mK","Pulsed operation; LN-on-Si and diamond in","parallel; design transfer from Delft","collaboration","month 48","All","Inter-institution integration does not","materialize","Funded cross-group experiments from Year 1","(M1.0, S1, S2); paired supervision; shared","measurement campaigns; joint datasets and","manuscripts as evidence","annual review","All","State of the art moves past a fixed long-term","goal","Annual IAC benchmarking of the goals; the","physics questions and the committed","thresholds are kept, the goal value is updated","annual IAC report","All","Loss of key personnel or fabrication downtime","Cross-trained teams at intersections; shared","process documentation; second fabrication","route via partners","continuous"]},{"t":"cap","x":"Table 4: Main technical risks, mitigations and decision triggers."},{"t":"p","x":"with Qi > 5 × 106, poled TFLN, cryogenic fiber attach) takes two to three years from first demonstration to a yield other groups can rely on, and the transfer of the associates’ modules to CCSNano (Section 2.3) is itself a Year 3–5 task. Cryogenic integration: a transducer operating at mK with a superconducting circuit needs device generations spaced by months of fabrication and cooldown, so the L4 goal is a Year-7 target even with the Delft design transfer. Field deployment: a metropolitan testbed, its operating agreements and the sensing trials with partners build on the Phase-1 demonstrations and need the continuity of a center. The Year-5 evaluation is therefore the point at which the center decides, with the IAC, which of the three horizons below carries the largest share of Phase 2."},{"t":"p","x":"Indicative Phase-2 horizons."},{"t":"p","x":"H1, metropolitan quantum-network node (L1 + L4): chip entanglement sources and a microwave–optical transducer link a superconducting processor in Campinas to the deployed-fiber testbed, giving São Paulo a node that connects to the quantum-network programs of the associates. H2, field quantum sensors (L3 + QEPS-3): packaged squeezed-comb spectrometers and chip magnetometers taken from the laboratory to agri-environmental and industrial partners, with the sensitivity and robustness metrics of Section 4 re-stated for field conditions. H3, continuous-variable processing primitives (L2): multimode squeezing and cluster-state generation with on-chip measurement on TFLN and SiN, the resource on which measurement-based photonic processing is built [14, 30], pursued at the scale of a few modes where the center’s CV expertise is a comparative advantage. Each horizon reuses at least two lighthouses, so Phase 2 recombines Phase-1 results rather than starting anew. The enduring impact of the center is measured by the physics it settles and by what remains usable by the national community: reproducible quantum-photonic process modules, shared calibration and characterization protocols, packaging, trained technical staff, independently reproducible quantum-state measurements and externally accessible testbeds."},{"t":"fig","x":["FAPESP","checkpoint","Goals","Metrics","Evidence","Expected impact on society","Annual","reports","(Y1–Y11)","Milestones of Table 3;","convergence between","groups; physics","questions tested","Milestones met; publications with","corresponding author at a São","Paulo institution (validated, not","surname-matched); joint","publications across groups and","institutions; process yield and","reproducibility; external users of","the shared facilities; students and","postdocs trained across at least","two links of the chain","Scientific Report;","IAC","Recommendations","Report; yield and","user dashboards","Qualified workforce spanning","design, fabrication and","quantum measurement","Year 3","evaluation","Committed: L1 and L2","thresholds; QRNG","module (M1.2)","≥1 MHz fiber-coupled pairs,","visibility ≥95% over ≥25 km","deployed fiber; ≥1.5 dB (TFLN)","or ≥3 dB (SiN) measured","squeezing; QRNG passing NIST","SP 800-22/90B","Field-test report;","calibrated","homodyne data;","module test report","First quantum-light chips","fabricated and field-tested in","Brazil; QRNG prototype","offered to industrial partners","for secure communication","Year 5","evaluation","(renewal)","Committed: L3 and L4","thresholds; process","modules reproduced by","a second group;","updated state-of-the-art","benchmark. Ambition:","L1 and L2 goals","≥1 dB below the shot-noise","reference and . PRX Quantum 2 (3 2021), p. 030343.","106":"Markus Hiekkamäki et al. Nat. Photon. 16.12 (2022), pp. 828 –833.","107":"Johannes Bürger et al. Adv. Photon. 7 (2025), p. 046002.","108":"Adriano J. G. Otuka et al. Polymers 13.12 (2021).","109":"Marlon M Correia et al. (2026).","110":"Artur de Araujo Silva et al. J. Opt. Soc. Am. B 40.4 (2023), pp. C21 –C27.","111":"Felix M. Mayor et al. Nat. Commun. 16 (1 2025), pp. 2576–.","112":"R. Benevides et al. Phys. Rev. Lett. 133.6 (2024).","113":"Raquel Garcia-Belles et al. PRX Quantum 7.3 (2026).","114":"Arthur M. Rebello et al. Nanomaterials 14.9 (2024).","115":"Hans Marin Florez et al. Phys. Rev. A 103 (3 2021), p. 033113.","116":"Albert Liu et al. Mater. Quantum Technol. 1.2 (2021).","117":"Diego Scolfaro et al. ACS Nano 15 (9 2021), pp. 15371–15380.","118":"Marcos L.F. Gomes et al. Nano Lett. 24 (49 2024), pp. 15517–15524.","119":"Jan Kettler et al. Nat. Nanotechnol. 16.3 (2021), pp. 283 –287.","120":"Anja Vogele et al. Adv. Quantum Technol. 3.2 (2020).","121":"Leonarde N. Rodrigues et al. ACS Appl. Nano Mater. 4.3 (2021), pp. 3140 –3147."}},{"id":"justification","group":"documents","title":"Justification for the Center","pages":3,"file":"documents/justification.pdf","blocks":[{"t":"p","x":"Mission To establish in the State of São Paulo an internationally competitive center for research, innovation and training in integrated quantum photonics, delivering photonic chips that generate, manipulate, transmit and detect quantum states of light, and demonstrating that those states survive every interface of a deployed system. Every activity of the center is tied to this mission through four lighthouse experiments (L1, an entangled-pair chip on deployed fiber; L2, integrated squeezing with on-chip readout; L3, a squeezed dual-comb spectrometer; L4, a microwave–optical quantum transducer), which are the checkpoints at which the Research, Innovation and Knowledge Diffusion activities meet. The Executive Committee’s first duty is to keep every work package, fellowship and partnership attached to one of them."},{"t":"h1","x":"1. Why the proposed science needs a Center","id":"s1"},{"t":"p","x":"a) Boldness, complexity and the need for a multidisciplinary approach. The transformative question of PHOQUS is whether quantum states generated on a chip survive every interface of a deployed system: the chip facet, the fiber and the field, the on-chip readout, a multi-component measurement chain and the boundary with microwave quantum hardware. No group answers this question alone, because each interface belongs to a different discipline: nonlinear integrated photonics and nanofabrication (sources and circuits), semiconductor growth (deterministic emitters), 2D materials (hybrid nonlinear elements), continuous-variable quantum optics (squeezing and tomography), optomechanics and superconducting circuits (transduction), comb metrology (sensing) and packaging. The Research Plan shows that the state of the art has reached the component level in each of these fields and that the open problems are the system-level ones. Attacking them requires that these disciplines share one fabrication pathway, one loss and noise budget and one measurement stack, which is what a center provides and a portfolio of projects does not."},{"t":"p","x":"b) Scale and duration. The targets are set so that each is a world first at the system level (Research Plan, Section 4), and reaching them requires device generations spaced by months of fabrication, packaging and, for L4, cooldown cycles. Process maturation (a SiN process with Qi > 5 × 106 at reliable yield, periodically poled TFLN, cryogenic fiber attach) takes two to three years each; cryogenic integration of a transducer with a superconducting circuit is a Year-5 to Year-7 objective even with the design transfer from TU Delft; a deployed-fiber testbed and sensing trials with external partners are built on the Phase-1 demonstrations and need the continuity of a center to be used by others. The program therefore has a five-year Phase 1 with committed thresholds and goals, and a Phase 2 (Years 6–11) in which the lighthouses are recombined into systems (a metropolitan quantum-network node, field quantum sensors, continuous-variable processing primitives). This horizon exceeds the five years of a Thematic project by design, not by accumulation."},{"t":"p","x":"c) Why not Regular or Thematic grants. The team already holds the grants that fund its component-level science (Research Plan, Table 1: a Thematic project in quantum optics, Regular grants in microresonators and 2D materials, Young Investigator grants of the QuTIa initiative, and the multi-user equipment grants that built the infrastructure). What none of them funds, and what a sequence of them cannot fund, is the integration: the shared technical staff that keeps a fabrication process and a cryogenic facility open to all groups, the packaging and metrology links that belong to no single project, the center-level milestones at which parallel routes are down-selected (D1, D2), and the long-term commitment that lets external partners build on the demonstrations. The convergence gap is measurable: the Unicamp integrated-photonics groups and the USP quantum-optics group, both internationally visible, have no joint publication, nor do the comb and the integrated-photonics groups. The first milestones of the center (M1.0, a CCSNano chip measured on the USP bench; XC-1, a shared acoustic and cryogenic platform) exist to close exactly these gaps, and they would not happen under independent grants."},{"t":"h1","x":"2. World-class research at the frontier","id":"s2"},{"t":"p","x":"The international analysis of the Research Plan (Section 2) places the frontier at system integration and shows where the center’s choices are distinctive: three platforms (SiN, TFLN, III–V) and 2D materials under one fabrication pathway with in-house MBE growth of droplet-etched quantum dots; a continuous-variable quantum-optics group with two decades of tomography and squeezing expertise tied to a chip foundry; an application-driven lighthouse in quantum-enhanced spectroscopy that no comparable center pursues; and millikelvin optomechanics and superconducting-circuit fabrication on the same campus as the photonics foundry. The team’s recent results are at or near the state of the art in each lighthouse area (cross-polarized Brillouin scattering and ultraviolet generation in TFLN, optomechanical teleportation and low-noise phonon–photon conversion with Delft, tomography of an integrated OPO, droplet-etched quantum dots in entanglement-based QKD, mid-infrared comb spectroscopy), and the five international associates (Lončar, Del’Haye, Schmidt, Soavi, Gröblacher) are working collaborators with joint publications and students in residence, not advisory names. The targets of the lighthouses are benchmarked against results published up to 2026 and carry a committed threshold and an internationally leading goal each."},{"t":"h1","x":"3. Innovation","id":"s3"},{"t":"p","x":"The research program is built so that each lighthouse produces, before its scientific result, a module an external party can test: a packaged quantum random-number generator at month 24, a QKD evaluation testbed on deployed fiber in Year 3, chip spectrometer modules for gas sensing in Years 4–6 and, in Phase 2, transducer and network-node prototypes. The Innovation Coordinator, a former Director of the Unicamp Innovation Agency and Innovation Coordinator of the INCT on quantum devices, sits on the Executive Committee; CC-SNano operates as an open facility whose process modules are offered to companies and other groups; the Unicamp innovation ecosystem (Inova, LIF Empreende) and an Industry Advisory Board provide the pipeline from module to partnership or spin-off. The team’s documented experience includes a company founded by a Principal Investigator (BR Labs), the Corning collaboration on fiber–chip coupling, and the industrial links of the associates (HyperLight, QPhox). The Innovation Action Plan details the instruments."},{"t":"h1","x":"4. Knowledge diffusion and training","id":"s4"},{"t":"p","x":"The center’s demonstrations are designed to be shown: the quantum random-number generator, the entanglement link and the gas-sensing spectrometer become the core of laboratory visits, of an itinerant exhibition on quantum light and of the public-engagement actions led by the Knowledge Diffusion Coordinator, whose experience in science communication and education is documented in the Diffusion Action Plan. The training pipeline spans the full chain, design, fabrication, packaging and quantum measurement, through 32 fellowships (8 DD, 5 DR, 10 PD, 9 MS) with activity plans tied to the work packages, undergraduate fellowships as entry points and science journalism fellowships tied to the Diffusion plan, the BEPE exchanges with the associates, and the annual school in quantum optics and photonics that the team already organizes. The workforce that can move between cleanroom, integrated optics and quantum measurement is the scarcest resource of the field, and producing it is a deliverable of the center in its own right."},{"t":"h1","x":"5. Team, governance and institutional commitment","id":"s5"},{"t":"p","x":"The team has a Principal Investigator with 30 hours per week, nine Principal Investigators with 20 hours each at Unicamp, USP and Mackenzie, twenty Associate Researchers at Unicamp, USP, UFSCar, UFABC, CNPEM and the five international institutions, and a balanced age structure in which Young Investigators of the QuTIa initiative lead work packages. The Director leads the PHOQUS group, coordinates the FAPESP QuTIa initiative and co-directs CCSNano; the Vice-Director and the Principal Investigators coordinate Thematic, Young Investigator and multi-user equipment grants and have the profile to succeed the Director. Governance (Management Plan) follows the call: an Executive Committee meeting weekly, Executive, Innovation and Diffusion Managers allocated by the host institution, an International Advisory Committee meeting annually and reporting to FAPESP, and decision points at which parallel routes are down-selected. The host institution provides laboratory space, the CCSNano and Photonicamp cleanrooms, the IFGW Cryogenics Facility and administrative support (Institutional Support document), and the partner institutions have signed their consent letters."},{"t":"h1","x":"6. Budget adequacy","id":"s6"},{"t":"p","x":"The request for the first five years balances personnel (32 research fellowships and seven technical training fellowships), operation (consumables, foundry runs, services) and equipment, and makes use of the multi-user infrastructure already funded by FAPESP: the electron-beam lithography system, the molecular-beam epitaxy system, the SNSPD systems, the dilution refrigerator, the helium liquefaction plant, the vector network analyzer and the comb instrumentation, all accessible to the center. The equipment requested completes this base at the points the lighthouses need (etching, low-temperature characterization, packaging), and the budget justification ties each item to a work package. Other current and expected support is listed in the corresponding document."}],"refs":{}},{"id":"execution_schedule","group":"documents","title":"Project Execution Schedule","pages":2,"file":"documents/execution_schedule.pdf","blocks":[{"t":"h1","x":"1. Quarterly schedule for Years 1–3","id":"s1"},{"t":"p","x":"Year 1 starts in June 2027. Codes as in the Research Plan: M = milestone, D = go/no-go decision point, Lx-T = lighthouse threshold."},{"t":"fig","x":["Year 1","Year 2","Year 3","Q1","Q2","Q3","Q4","Q1","Q2","Q3","Q4","Q1","Q2","Q3","Q4","A · NIP","NIP-1 SiN process baseline","M1.1"]},{"t":"p","x":"NIP-1 coupled-ring squeezer / DOPO designs NIP-1 comb pair for DCS NIP-2 Brillouin source; GHz resonators at 4 K NIP-3 TMD SHG on SiN; 2D pump control NIP-3 TMD SPDC on SiN (pair source for L1)"},{"t":"p","x":"NIP-4 QD growth; waveguide and resonator coupling B · QPC QPC-1 QRNG chip and module M1.2 QPC-1 BBM92 receiver; field link L1-T QPC-2 SiN Kerr squeezer QPC-2 PPLN-TFLN OPO + on-chip BHD L2-T QPC-3 couplers; cryogenic packaging C · QEPS QEPS-1 classical chip DCS QEPS-1 squeezed-light injection test QEPS-2 OM crystal design and fabrication QEPS-2 mK characterization QEPS-3 vapour cell – chip coupling XC XC-1 SAW devices on TFLN/GaAs; 4 K/mK scheduling Center Recruitment of PhD students and postdocs M1.0 first CCSNano SiN OPO measured at USP S1 joint Unicamp–USP manuscript submitted (month 18) D1 L1 source down-select (month 24)"},{"t":"p","x":"D2 L2 track selection (month 30)"},{"t":"p","x":"S2 joint comb × chip spectroscopic result (month 30) IAC review / annual meeting Code Month Milestone / decision and verification M1.0 First CCSNano SiN OPO measured with the USP tomography setup (joint measurement report) M1.1 SiN process baseline released to all branches (Qi and loss statistics over ≥3 wafers) M1.2 Packaged QRNG module (NIST SP 800-22 / 90B test suites) D1 L1 source down-select: SiN SFWM / TFLN SPDC / QD (fiber-coupled rate at CAR ≥100; g(2)(0)) D2 L2 track for the Year-5 goal: PPLN-TFLN vs SiN (measured squeezing; integration readiness) L1-T L1 threshold: ≥1 MHz fiber-coupled pairs, V ≥95% over ≥25 km deployed fiber, finite-key BBM92 L2-T L2 threshold: ≥1.5 dB (TFLN) or ≥3 dB (SiN) directly measured squeezing 2. Five-year view: lighthouses, evaluations and fellowships Year 1 (06/2027–05/2028)"},{"t":"fig","x":["Year 2","Year 3","Year 4","Year 5","FAPESP","Annual report","Annual report","Year-3 evaluation","Annual report","Year-5 evaluation","(renewal)","L1","Source","baseline","(M1.1); receivers","Spooled-fiber test;","D1","L1-T field test","L1","goal:","≥10 MHz,","WDM","multi-user","L2","OPO/DOPO","de-","signs; M1.0","Squeezing off chip;","D2 (m. 30)","L2-T","On-chip","photodi-","odes","L2 goal: ≥3 dB on","chip","L3","Classical chip DCS","Squeezed-light in-","jection test","Chip squeezer in-","jected","L3-T:","≥1 dB,","1.25×","Chip combs; mid-","IR (goal Y6)","L4","OMC generation 1;","SC chips","mK operation; first","conversion","SC-circuit coupling","η, nadd generation","L4-T: η ≥10−3,","nadd ≤5","XC-1 / infrastruc-","ture","Shared","cryogenic","schedule;","SAW","delay lines","Cryogenic fiber at-","tach qualified","Poling","and","sput-","tered SiN transfer","starts","Packaging module","external","Process","mod-","ules at CCSNano","(foundry-style)","Fellowships","PD (10), PP-hosted","DD (5), DR with","graduating","MSc","(4),","TT","(4)","re-","cruited","Reserve","DD","(3),","DR (1), MS (9), TT","(3) recruited","BEPE","stays","(DD/DR)","First MS gradua-","tions; DR continua-","tion","First DD/DR theses","(DR)","Innovation","IAB; IP fast-track","QRNG","module","(M1.2)","QKD testbed agree-","ment","Spectrometer field","trial","Licence/spin-off","decision;","Phase-2","roadmap","Diffusion","Website; first PHO-","QUS school","Visit","circuit;","teacher course","Exhibition;","Mídia","Ciência","Consolidation","External evaluation","(IAC)"]},{"t":"h1","x":"3. Phase 2 (Years 6–11, indicative)","id":"s2"},{"t":"p","x":"Re-planned at the Year-5 evaluation with the International Advisory Committee according to which lighthouse goals were reached: L3 goal (Year 6) and L4 goal (Year 7); Year-8 evaluation with the H1 (metropolitan quantum-network node, L1+L4) and H2 (field quantum sensors, L3+QEPS-3) prototypes; H3 (continuous-variable processing primitives, L2) as the third horizon; Year 11 with the three systems demonstrated with external partners and the process modules self-sustaining at CCSNano."}],"refs":{}},{"id":"management_plan","group":"documents","title":"Management Plan and Organisational Structure","pages":3,"file":"documents/management_plan.pdf","blocks":[{"t":"h2","x":"a) Management plan, structure and governance","id":"s1"},{"t":"p","x":"Principle. PHOQUS is managed around its four lighthouse experiments rather than around its institutions. Every work package (WP), fellowship and partnership reports to a lighthouse, every lighthouse has a threshold and a goal with a date, and the governance bodies exist to keep the program converging on those dates. The structure (Fig. 1) has three layers: the Executive Committee (EC) and its managers, which run the center; the three research branches and the cross-cutting platform, which execute the work packages; and the advisory bodies, which review the program."},{"t":"fig","x":["FAPESP","Host institution: Unicamp (IFGW)","partners: USP, Mackenzie, UFSCar, UFABC, CNPEM","Executive Committee (weekly)","Director, Vice-Director,","Innovation Coord., Diffusion Coord.","Executive Manager","Innovation Manager","Diffusion Manager","(host-institution staff)","International Advisory","Committee (annual)","Industry Advisory","Board (annual)","Branch A, NIP","NIP-1 to NIP-4","lead: Wiederhecker","Branch B, QPC","QPC-1 to QPC-3","lead: Martinelli","Branch C, QEPS","QEPS-1 to QEPS-3","lead: Alegre"]},{"t":"p","x":"XC-1 cross-cutting platform (acoustics, cryogenics, packaging metrology): Couto Lighthouses L1–L4: owners NIP-1/QPC-1 (L1), QPC-2 (L2), QEPS-1 (L3), QEPS-2 (L4)"},{"t":"p","x":"Shared infrastructure: CCSNano, Photonicamp, MBE, MackGraphe, IFGW Cryogenics, USP CV bench; technical staff (TT fellowships) Figure 1: Organogram of PHOQUS. Branch and WP leads are provisional."},{"t":"p","x":"Position in the host institution. The center is hosted by the Instituto de Física Gleb Wataghin (IFGW) of Unicamp, in the Department of Quantum Electronics, and operates the CCSNano and Photonicamp cleanrooms and the IFGW Cryogenics Facility as its fabrication and cryogenic base. The Director reports to the IFGW Direction and the center is represented in the Unicamp research-center governance through the Pró-Reitoria de Pesquisa. The USP (Instituto de Física), Mackenzie (MackGraphe), UFSCar, UFABC and CNPEM groups participate through their institutions’ consent letters, with their laboratories as nodes of the center’s shared infrastructure; the five international associates participate through the cooperation instruments of the Research Plan (Section 2.3)."},{"t":"p","x":"Management model. Each WP has a lead and a deputy at different institutions wherever possible, so that every interface of the program is owned by two groups. Each lighthouse has an owner WP and a written loss and noise budget; the budgets are the center’s internal metric and are reviewed quarterly by the EC. Parallel technical routes are kept until dated decision points (D1 at month 24 for the L1 source, D2 at month 30 for the L2 track), at which the EC, advised by the International Advisory Committee, down-selects and reallocates fellowships (the branch reserves) and operating funds. Shared infrastructure is run as user facilities with published schedules and process documentation; technical-training (TT) fellows and host-institution technicians keep the processes open to all groups. Data and process records follow the Data Management Plan."},{"t":"p","x":"Meetings. Weekly EC meeting; monthly branch meetings (hybrid, Campinas/São Paulo); a quarterly lighthouse review in which the four owners present their budgets and milestones to the EC; the annual PHOQUS meeting (two days, all members, all fellows presenting), at which the results of the year and the plan for the next are discussed and the International Advisory Committee holds its session; and the annual school in quantum optics and photonics, open to external students. The annual Scientific Report and the IAC Recommendations Report are prepared after the annual meeting."},{"t":"p","x":"Collaboration mechanisms. Joint supervision of fellows across institutions (each DD/DR has a supervisor and a co-supervisor from different WPs where the plan requires it); a standing BEPE and postdoc exchange with the associates; reciprocal process access (TFLN poling, sputtered SiN, nanoprinted couplers) during Years 1–3 with transfer to CCSNano by Year 5; a center-wide seminar; and a common electronic laboratory notebook and data repository. Conflicts of allocation are resolved by the EC; scientific disputes between routes are resolved at the decision points on the basis of the written metrics."},{"t":"h2","x":"b) Executive Committee","id":"s2"},{"t":"p","x":"The Executive Committee is composed of the Director, Gustavo S. Wiederhecker (Unicamp), the Vice-Director, Thiago P. M. Alegre (Unicamp), the Innovation Coordinator, Newton C. Frateschi (Unicamp), and the Knowledge Diffusion Coordinator, Paulo A. Nussenzveig (USP). It meets weekly (in person or online) and supervises the daily operation of the center: budget execution and procurement, fellowship calls and selection, allocation of shared infrastructure, the quarterly lighthouse reviews, the preparation of the FAPESP reports and the relations with the host and partner institutions. The Director chairs the EC and is the center’s representative before FAPESP; the Vice-Director replaces the Director and is responsible for the research branches’ coordination and the shared infrastructure schedule; the Innovation and Diffusion Coordinators are responsible for their Action Plans and report on them at every EC meeting. The EC is assisted by three managers allocated by the host institution and approved by FAPESP: an Executive Manager (administration, finance, reporting, procurement and import), an Innovation Manager (partnerships, intellectual property, interface with Inova Unicamp) and a Knowledge Diffusion Manager (school, visits, exhibition, communication), together with the administrative support of IFGW. Branch leads and the XC-1 lead attend the EC monthly; the EC may invite any WP lead. Decisions are by consensus; in its absence, by majority with the Director’s casting vote, recorded in minutes available to all members."},{"t":"h2","x":"c) International Advisory Committee","id":"s3"},{"t":"p","x":"Composition. The IAC has five to seven members, at least two of them foreign scientists active at the frontier of the center’s fields, chosen for international standing, complementarity with the four lighthouses and accessibility to the Director and Coordinators, and none of them from the groups of the international associates, so that the IAC reviews the collaborations as well as the science. Suggested profiles and names (to be invited after approval of the center): integrated quantum photonics and quantum networks (e.g. a PI of the NSF Center for Quantum Networks or of the Quantum Internet Alliance); continuous-variable quantum optics and squeezing (e.g. a leader of the Hannover or Copenhagen CV groups); quantum transduction and superconducting circuits (e.g. a PI of the Stanford, Caltech or ETH transduction efforts); semiconductor quantum emitters (e.g. A. Rastelli, JKU Linz, who visited the team in 2026); comb spectroscopy and sensing (e.g. a NIST or MPQ comb group leader); and one member with experience in directing a large center and in technology transfer, preferably from a photonics company. One Brazilian member from outside São Paulo with experience in INCT or CEPID evaluation completes the committee."},{"t":"p","x":"Modus operandi. The IAC meets once a year, in person at the annual PHOQUS meeting (with online participation allowed for at most two members), receives the annual Scientific Report draft and the lighthouse budgets in advance, hears the four lighthouse owners and a sample of fellows, meets the fellows without the PIs, and produces the Recommendations Report sent to FAPESP with the Scientific Report. Between meetings the Director consults the IAC chair on the decision points D1 and D2 and on the Year-5 re-planning of Phase 2. The IAC also reviews the international cooperation strategy and the Innovation and Diffusion plans every two years. Members serve four years, renewable once, with staggered terms."},{"t":"h2","x":"d) Initiatives to attract young researchers","id":"s4"},{"t":"p","x":"The center will use the FAPESP Young Investigator (JP) instrument as its main route to bring researchers with at least two years of postdoctoral experience abroad to the partner institutions. Four Young Investigators of the QuTIa initiative are already Associate Researchers of the center and lead work packages (Barros, Benevides, Florez, Covre da Silva), which demonstrates the model. During Phase 1 the center will support at least three new JP applications on topics that extend the lighthouses (for example integrated photodetection for CV readout, deployed quantum-network engineering, cryogenic packaging), offering the applicants laboratory space, access to the shared infrastructure, a start-up budget from the center’s operating funds in the first year and a mentoring PI; the host institutions commit to open faculty positions aligned with the center’s lines (Institutional Support document). The ten postdoctoral fellowships of the center, each tied to a work package and co-supervising DD/MS fellows, form the pool from which JP candidates and future Principal Investigators are drawn; the Executive Committee reviews once a year, with the IAC, which postdocs should be encouraged to apply. The international associates host BEPE periods and co-supervise fellows, and the center’s school and annual meeting are the recruitment events at which foreign postdocs are invited to visit."}],"refs":{}},{"id":"pp_responsibilities","group":"documents","title":"Responsibilities of the Principal Investigators","pages":2,"file":"documents/pp_responsibilities.pdf","blocks":[{"t":"p","x":"Gustavo S. Wiederhecker (Unicamp, IFGW), Principal Investigator and Director, 30 h/week. Scientific and administrative direction of the Center; chair of the Executive Committee; representative before FAPESP; lead of Branch A (NIP) and of work package NIP-1 (Kerr and electro-optic combs, DOPO in coupled microresonators), co-lead of NIP-2 and QPC-3; owner, with QPC-1, of lighthouse L1; co-direction of CCSNano as the Center’s fabrication base; host of NIP-1 DD1, PD1 and MS1 and of the branch-reserve fellowships NIP-2 DD1 and QPC-3 DD1; coordination of the cooperation with Del’Haye (MPL) and the Corning collaboration."},{"t":"p","x":"Thiago P. M. Alegre (Unicamp, IFGW), Vice-Director, 20 h/week. Deputy of the Director; coordination of the three research branches and of the shared-infrastructure schedule; lead of Branch C (QEPS) and of QEPS-2 (piezo-optomechanical transduction), co-lead of NIP-2; owner of lighthouse L4; host of QEPS-2 DR1 (with Rouxinol), PD1 and MS1; coordination of the cooperation with Gröblacher (TU Delft); coordinator of the PHOQUS school (SPSAS 25/08613-9 as its first edition)."},{"t":"p","x":"Newton C. Frateschi (Unicamp, IFGW), Innovation Coordinator and PP, 20 h/week. Responsible for the Innovation Action Plan, the Industry Advisory Board, the module evaluation agreements and the intellectual-property procedure with Inova Unicamp; lead of QPC-1 (chip QKD transmitters and QRNG); delivery of the QRNG module (M1.2) and of the QKD evaluation testbed; host of QPC-1 DD1, PD1 and MS1; liaison with INCT-DQ (CNPEM) and with CCSNano’s industrial users."},{"t":"p","x":"Paulo A. Nussenzveig (USP, IF), Knowledge Diffusion Coordinator and PP, 20 h/week. Responsible for the Knowledge Diffusion Action Plan (school, visits, exhibition, teacher training, open material, communication) and its metrics; co-lead of QPC-2 (continuous-variable quantum photonics) with Martinelli; host of QPC-2 DR2 (SiN Kerr squeezing and tomography) and PD2 (multimode squeezing, H3); member of the Executive Committee."},{"t":"p","x":"Marcelo Martinelli (USP, IF), PP, 20 h/week. Lead of Branch B (QPC) and of QPC-2; owner of lighthouse L2 (integrated squeezing with on-chip readout); responsible for the USP continuous-variable bench as a shared facility of the Center and for the convergence milestone M1.0; host of QPC-2 DR1 (PPLN-TFLN OPO with on-chip readout), PD1 and MS1; co-lead of QEPS-1 for the squeezed-light injection of L3."},{"t":"p","x":"Flavio C. Cruz (Unicamp, IFGW), PP, 20 h/week. Lead of QEPS-1 (squeezed dual-comb spectroscopy); owner of lighthouse L3; responsible for the comb and spectroscopy instrumentation as a shared facility and for the comb-noise protocol with NIP-1; host of QEPS-1 DD1, PD1 and MS1; liaison with sensing partners (agri-environmental) for the Innovation plan; co-lead of NIP-1 for electro-optic combs."},{"t":"p","x":"Christiano J. S. de Matos (Mackenzie, MackGraphe), PP, 20 h/week. Lead of NIP-3 (2D materials as χ(2) media and hybrid nonlinear devices); responsible for the MackGraphe growth and transfer facility as a node of the shared fabrication pathway and for the Mackenzie SNSPD-based source characterization; host of NIP-3 DR1 and PD1; coordination of the cooperation with Soavi (FSU Jena)."},{"t":"p","x":"Christoph F. Deneke (Unicamp, IFGW), PP, 20 h/week. Co-lead of NIP-4 (quantum emitters) for epitaxial quantum dots; responsible, with Covre da Silva, for the MBE system as a shared facility and for the droplet-etched QD growth and processing; host of NIP-4 DD1 and PD1 and co-host of NIP-4 MS1; the deterministic QD track of lighthouse L1."},{"t":"p","x":"Lázaro A. Padilha Jr. (Unicamp, IFGW), PP, 20 h/week. Co-lead of NIP-4 for colloidal and 2D emitters and for the integrability–coherence benchmark; responsible for the ultrafast and coherent spectroscopy facility; host of NIP-4 DR1 and PD2 and co-host of NIP-4 MS1; link to UFSCar (Gobato) for 2D emitters."},{"t":"p","x":"Odilon D. D. Couto Jr. (Unicamp, IFGW), PP, 20 h/week. Lead of the cross-cutting platform XC-1 (acoustic control and cryogenic operation); coordinator of the IFGW Cryogenics Facility and of the shared cryogenic schedule used by NIP-4, QPC-3 and QEPS-2; responsible for SAW devices on LN and GaAs and for strain engineering of emitters; host of XC-1 DD1 and PD1; co-lead of NIP-4 for acoustically tuned emitters. Branch leads, WP leads and fellowship hosts are those of the Research Plan (Sections 5 and 5.5) as of October 2026 and may be adjusted by the Executive Committee at the decision points D1 and D2."}],"refs":{}},{"id":"team_activities","group":"documents","title":"Activities of the Team","pages":4,"file":"documents/team_activities.pdf","blocks":[{"t":"p","x":"Associate Researchers"},{"t":"p","x":"Alisson R. Cadore (CNPEM, LNNano), 5 h/week. 2D-material growth and heterostructure fabrication for NIP-3 and NIP-4; LNNano open-facility access for lithography and microscopy; acoustic modulation of excitonic complexes with XC-1."},{"t":"p","x":"Breno Marques G. Teixeira (UFABC), 10 h/week. Quantum-information protocols, device-independent randomness and the entropy certification of the QRNG module (QPC-1); photonic-chip protocol design with the JP 21/14303-1 group."},{"t":"p","x":"Diogo B. Almeida (Unicamp, IFGW), 10 h/week. Ultrafast and NV-center spectroscopy for NIP-4 and QEPS-3; coherent spectroscopy protocols of the colloidal emitters."},{"t":"p","x":"Felippe A. S. Barbosa (Unicamp, IFGW), 10 h/week. Continuous-variable measurement methods for QPC-2 (assumption-free sideband measurements, hidden entanglement); chemical-mechanical polishing support for wafer preparation."},{"t":"p","x":"Francisco P. M. Rouxinol (Unicamp, IFGW), 10 h/week. Superconducting-circuit design and Josephson-junction fabrication for the L4 transducer (QEPS-2); co-supervisor of QEPS-2 DR1."},{"t":"p","x":"Giancarlo Soavi (FSU Jena), 3 h/week, international associate. Ultrafast nonlinear optics of 2D materials for NIP-3; host of BEPE stays; joint publications on 2D nonlinear devices."},{"t":"p","x":"Hans M. Florez (Unicamp, IFGW), 10 h/week. Optically pumped magnetometers and squeezed-light readout for QEPS-3; lead of QEPS-3 and co-host of QEPS-3 DD1 and MS1."},{"t":"p","x":"Henrique G. Rosa (Mackenzie), 10 h/week. Integrated 2D-material devices and saturable absorbers for NIP-3; MackGraphe fabrication support."},{"t":"p","x":"Jonathas de P. Siqueira (Unicamp, IFGW), 10 h/week. VUV and THz sources and spectroscopy for the spectral extension of QEPS-1."},{"t":"p","x":"Luis A. M. Barea (UFSCar), 10 h/week. Integrated photonic modeling (multiport couplers, photonic molecules) for NIP-1 and QPC-1; hollow-core gas sensing for QEPS-1."},{"t":"p","x":"Marko Lončar (Harvard), 3 h/week, international associate. TFLN design and periodic poling for QPC-2, NIP-2 and QEPS-2; host of BEPE stays; process transfer to CCSNano by Year 5; industrial insight through HyperLight."},{"t":"p","x":"Markus Schmidt (Leibniz IPHT Jena), 3 h/week, international associate. 3D nanoprinted fiber–chip couplers for QPC-3; host of BEPE stays and of N. Tomázio’s fellowship; transfer of the printing process."},{"t":"p","x":"Nathália B. Tomázio (USP), 10 h/week. Fiber–chip interfaces and two-photon-polymerised micro-optics for QPC-3; co-lead of QPC-3 and co-host of QPC-3 DD1 and MS1."},{"t":"p","x":"Pascal Del’Haye (MPL Erlangen), 3 h/week, international associate. Ultralow-loss sputtered SiN and microcomb physics for NIP-1; host of BEPE stays; process transfer to CCSNano."},{"t":"p","x":"Pierre L. de Assis (Unicamp, IFGW), 10 h/week. Quantum-dot optomechanics and color-center photonics for QEPS-3 and XC-1; co-host of QEPS-3 DD1."},{"t":"p","x":"Rafael F. P. do R. Barros (USP), 10 h/week. Structured quantum light and spatial-mode engineering for QPC-2; SNSPD facility at USP (EMU 25/03500-1) for the source metrics of the Center."},{"t":"p","x":"Rodrigo da S. Benevides (USP, IF), 10 h/week. Modular microwave–optical transduction in his new USP laboratory with a dilution refrigerator (EMU 25/08511-1) for QEPS-2 and L4; quasiparticle and loss physics of superconducting circuits."},{"t":"p","x":"Saimon F. Covre da Silva (Unicamp, IFGW), 10 h/week. Telecom single-photon sources and the MBE system (EMU 25/06758-0) for NIP-4; QD-based QKD expertise for QPC-1."},{"t":"p","x":"Simon Gröblacher (TU Delft), 3 h/week, international associate. Quantum optomechanics and transducer design transfer for QEPS-2; host of BEPE stays; industrial insight through QPhox."},{"t":"p","x":"Yara G. Gobato (UFSCar), 5 h/week."},{"t":"p","x":"2D-material emitters and low-temperature magneto-optical spectroscopy (EMU 23/17080-9) for NIP-4."},{"t":"p","x":"Fellows (one per fellowship of Table 2 of the Research Plan; activity plans attached separately)"},{"t":"p","x":"NIP-1 DD1 (Direct-PhD fellow, 60 months, host: Wiederhecker, WP NIP-1). Dispersion-engineered coupled SiN microresonators as photon-pair and squeezed-light sources for L1 and L2. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-1 PD1 (Postdoctoral fellow, 36 months, host: Wiederhecker, WP NIP-1). High-Q SiN process baseline and Kerr/EO comb sources for the L3 dual-comb spectrometer. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-1 MS1 (MSc fellow, 24 months, host: Wiederhecker, WP NIP-1). Characterization of pair generation and coincidence statistics in SiN microrings. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-2 DD1 (Direct-PhD fellow, 60 months, host: Alegre (co-lead); Wiederhecker, WP NIP-2). GHz phononic resonators and Brillouin interactions in TFLN for the L4 transducer. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-2 MS1 (MSc fellow, 24 months, host: Wiederhecker/Alegre, WP NIP-2). Brillouin gain and phonon lifetime measurements in TFLN waveguides at 300 K and 4 K. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-3 DR1 (PhD fellow, 48 months, host: de Matos, WP NIP-3). Quasi-phase-matched SHG and SPDC with patterned 2D materials on SiN waveguides. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-3 PD1 (Postdoctoral fellow, 36 months, host: de Matos, WP NIP-3). Hybrid 2D-material pump-control elements (saturable absorbers and isolators) for quantum-light chips. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-4 DD1 (Direct-PhD fellow, 60 months, host: Deneke, WP NIP-4). Waveguide-integrated droplet-etched quantum dots as deterministic sources for the L1 QD track. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-4 DR1 (PhD fellow, 48 months, host: Padilha, WP NIP-4). Colloidal and 2D emitters coupled to integrated resonators along the integrability-coherence axis. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-4 PD1 (Postdoctoral fellow, 36 months, host: Deneke, WP NIP-4). MBE growth and processing of telecom-converted epitaxial QD sources on photonic chips. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-4 PD2 (Postdoctoral fellow, 36 months, host: Padilha, WP NIP-4). Linewidth engineering and coherent spectroscopy of resonator-coupled nanocrystal emitters. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"NIP-4 MS1 (MSc fellow, 24 months, host: Deneke/Padilha, WP NIP-4). Comparative g2 and linewidth protocol for epitaxial colloidal and 2D emitters on the same resonator designs. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-1 DD1 (Direct-PhD fellow, 60 months, host: Frateschi, WP QPC-1). Chip QKD transmitter and BBM92 receiver chain for the L1 deployed-fiber field test. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-1 PD1 (Postdoctoral fellow, 36 months, host: Frateschi, WP QPC-1). DOPO-based quantum random-number generator chip and its NIST validation (M1.2). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-1 MS1 (MSc fellow, 24 months, host: Frateschi, WP QPC-1). Pump rejection and WDM demultiplexing module for fiber-coupled photon pairs. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-2 DR1 (PhD fellow, 48 months, host: Martinelli, WP QPC-2). PPLN-TFLN degenerate OPO with on-chip SHG pump and balanced-homodyne readout (L2). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-2 DR2 (PhD fellow, 48 months, host: Nussenzveig, WP QPC-2). Kerr squeezing in coupled SiN microresonators and full state tomography (L2 parallel track). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-2 PD1 (Postdoctoral fellow, 36 months, host: Martinelli, WP QPC-2). Integrated balanced homodyne detection and loss-budget metrology for on-chip squeezing. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-2 PD2 (Postdoctoral fellow, 36 months, host: Nussenzveig, WP QPC-2). Multimode squeezing and cluster-state resources on chip (toward H3). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-2 MS1 (MSc fellow, 24 months, host: Martinelli/Nussenzveig, WP QPC-2). Measurement of CCSNano-fabricated SiN oscillators on the USP tomography bench (M1.0). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-3 DD1 (Direct-PhD fellow, 60 months, host: Wiederhecker (co-lead); Tomazio, WP QPC-3). 3D nanoprinted fiber-chip couplers and cryogenic fiber attach for L1 to L4. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QPC-3 MS1 (MSc fellow, 24 months, host: Wiederhecker/Tomazio, WP QPC-3). Facet-loss metrology at 300 K and 4 K and packaging of lighthouse chips. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-1 DD1 (Direct-PhD fellow, 60 months, host: Cruz, WP QEPS-1). Squeezed dual-comb spectroscopy of CO2 and CH4 with chip-generated squeezed light (L3). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-1 PD1 (Postdoctoral fellow, 36 months, host: Cruz, WP QEPS-1). Mid-infrared extension of the dual-comb spectrometer by difference-frequency generation. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-1 MS1 (MSc fellow, 24 months, host: Cruz, WP QEPS-1). Classical chip-based dual-comb spectroscopy of CO2/CH4 and shot-noise-limited detection. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-2 DR1 (PhD fellow, 48 months, host: Alegre (with Rouxinol), WP QEPS-2). LN-on-Si piezo-optomechanical transducer at millikelvin temperatures (L4). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-2 PD1 (Postdoctoral fellow, 36 months, host: Alegre, WP QEPS-2). Superconducting-circuit interface and added-noise characterization of the L4 transducer. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-2 MS1 (MSc fellow, 24 months, host: Alegre, WP QEPS-2). Optomechanical crystal design and 4 K characterization of mechanical Q and g0. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-3 DD1 (Direct-PhD fellow, 60 months, host: Florez (lead); de Assis, WP QEPS-3). Chip-integrated magnetometry with color centers and atomic vapours (H2). Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"QEPS-3 MS1 (MSc fellow, 24 months, host: Florez/de Assis, WP QEPS-3). Benchmark vapour-cell magnetometer coupled to a photonic chip. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"XC-1 DD1 (Direct-PhD fellow, 60 months, host: Couto, WP XC-1). Surface-acoustic-wave control of quantum emitters and phononic devices on LN and GaAs. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"XC-1 PD1 (Postdoctoral fellow, 36 months, host: Couto, WP XC-1). Cryogenic operation platform and SAW-driven interfaces shared across the three branches. Activities, schedule and milestones are in the activity plan of this fellowship."},{"t":"p","x":"Technical training, undergraduate and science journalism fellows Technical training fellows (7 positions: four TT-5, one TT-4A, two TT-4; activity plans attached separately). Each TT fellowship is a supervised training and qualification program for one shared capability of the center, formally supervised by a PP with technical co-responsibility of the associate researchers named in its plan, and ends with the hand-over of documented procedures to the permanent facility staff: TT5-01 (TT-5, 24 months, Couto); TT5-02 (TT-5, 24 months, Martinelli); TT5-03 (TT-5, 24 months, Cruz); TT5-04 (TT-5, 24 months, Frateschi); TT4A-01 (TT-4A, 24 months, Alegre); TT4-01 (TT-4, 12 months, de Matos); TT4-02 (TT-4, 12 months, Deneke). Undergraduate fellows (IC; 10 positions, 12 months each; activity plans attached separately). Entry-level research projects with a defined deliverable for a work package (simulation, device characterization, data analysis), supervised by the PR or a PP and mentored by a postdoctoral or PhD fellow of the same work package, selected with priority to public-school students as the first step of the training pipeline of the Diffusion plan (A7): IC-01 (NIP-1, Wiederhecker); IC-02 (NIP-2, Alegre); IC-03 (NIP-3, de Matos); IC-04 (NIP-4, Deneke); IC-05 (QPC-1, Frateschi); IC-06 (QPC-2, Martinelli); IC-07 (QPC-3, Wiederhecker); IC-08 (QEPS-1, Cruz); IC-09 (QEPS-2, Alegre); IC-10 (XC-1, Couto). Science journalism fellows (JC-1 to JC-3; 16 positions: six JC-1, five JC-2, five JC-3, 12 months each; activity plans attached separately). Each plan implements one action of the Knowledge Diffusion Action Plan (A1–A7), supervised by the Knowledge Diffusion Coordinator (Nussenzveig, USP) or by the Director (Unicamp): JC1-01 (Center website and monthly result pieces); JC1-02 (Social media and short videos from the laboratories); JC1-03 (Scripts and support material of the quantum-light laboratory-visit circuit); JC1-04 (Coverage and open publication of the annual PHOQUS School); JC1-05 (Texts and videos for the quantum-optics applet series); JC1-06 (Classroom material of the teacher course on light); JC2-01 (Press relations and press releases on the center’s results); JC2-02 (Content of the itinerant exhibition on quantum light); JC2-03 (Audio and video series on the people and results of the center); JC2-04 (Communication of the annual meeting and public event; Diffusion metrics); JC2-05 (Documentary on the quantum-light circuit and the school); JC3-01 (Editor of the center’s communication plan); JC3-02 (Narrative and curatorial coordination of the itinerant exhibition); JC3-03 (Long-form science journalism on quantum technologies); JC3-04 (Editor of the open educational material); JC3-05 (Evaluation of the Diffusion plan and of the training pipeline)."}],"refs":{}},{"id":"innovation_plan","group":"documents","title":"Innovation Action Plan","pages":3,"file":"documents/innovation_plan.pdf","blocks":[{"t":"h1","x":"1. Principle: innovation alongside research, lighthouses as module sources","id":"s1"},{"t":"p","x":"The mission of the center (Research Plan, Section 1) names two outputs, new physics of integrated quantum light and chips that generate, manipulate, transmit and detect quantum states and survive every interface of a deployed system; innovation is the path of the second output and is not a downstream activity. Innovation develops alongside the research without making discovery contingent on product development: where technically appropriate, each lighthouse experiment yields a module that an external party can evaluate while the discovery track of the Research Plan advances from Year 1, and the lighthouses run on partially independent paths, so that a delay in one does not hold back the modules of the others. The sequence is fixed in the schedule of the Research Plan (Section 8): a packaged quantum random-number generator (QRNG) at month 24 (milestone M1.2); a quantum key distribution (QKD) evaluation testbed on deployed metropolitan fiber at the Year-3 threshold of L1; chip spectrometer modules for greenhouse-gas sensing between Years 4 and 6 (L3); and, in Phase 2, transducer and quantum-network-node prototypes (L4, H1). In parallel, the process modules developed at CCSNano (ultralow-loss silicon nitride (SiN), periodically poled thin-film lithium niobate (TFLN), waveguide-coupled quantum dots, cryogenic packaging) are documented and offered through the multi-user access model of CCSNano, an academic nanofabrication facility. The Innovation Coordinator reviews every lighthouse milestone with one question: which element of the chain is closest to a product and what is missing for a partner to try it."},{"t":"fig","x":["Research program (lighthouses)","Externally testable module (year)","External evaluation partner","L1 chip entangled-pair","source on deployed fiber","L2 integrated squeez-","ing, on-chip read-","out","QPC-1 QRNG","L3 squeezed dual-","comb spectrometer","L4 MW↔optical","transducer","CCSNano process","modules SiN, poled","TFLN, QDs, cryo-","genic packaging","QKD evaluation","testbed on metropoli-","tan fiber (Year 3)","Packaged QRNG,","NIST SP 800-22/90B","(Year 2, M1.2)","Chip spectrometer","modules for CO2/CH4","sensing (Years 4–6)","Transducer and","network-node proto-","types (Phase 2, H1)","MPW-style runs, process","design kits, published","schedule (Years 3–5)","Link owner (CPqD /","RNP / campus network);","telecom operator","Telecom / se-","curity partner","Agri-environmental","monitoring partner","Quantum-network pro-","grams of the associates","Companies and re-","search groups as","CCSNano users"]},{"t":"p","x":"field data and requirements for the next device generation; IAB opinion on priorities Instruments Industry Advisory Board 5–7 members; annual written opinion on the module pipeline Evaluation agreements module + test protocol out; field data back (Innovation Manager)"},{"t":"fig","x":["IP fast track","Inova Unicamp, two-week","decision before publica-","tion; SP-first licensing","Entrepreneurship","LIF Empreende, In-","camp; annual workshop","and pitches to the IAB","Workforce for industry","yearly short course,","internships, TT process","and cryogenics engineers","Phase-1 outcome","≥1 license or spin-","off (QRNG/QKD);","modules reproduced","outside the center"]},{"t":"cap","x":"Figure 1: The innovation pipeline: each lighthouse (and the CCSNano process modules) yields a module that an external partner evaluates on a dated schedule; field data and the Industry Advisory Board opinion feed the next device generation. The instruments of Section 3 run the loop."},{"t":"h1","x":"2. Documented experience of the team","id":"s2"},{"t":"p","x":"The Innovation Coordinator, Newton C. Frateschi, was Executive Director of the Unicamp Innovation Agency (Inova Unicamp, the university’s technology-transfer office) from 2017 to 2021, when he left to become Vice-Secretary of Development, Technology and Innovation of the Campinas Municipality; in 2022 he returned to Unicamp while chairing the Campinas Municipal Council for Science, Technology and Innovation, the governance body of the Campinas ecosystem . Between 2017 and 2021 Inova established the university’s innovation policy, managed a portfolio of more than 1,200 patent families with tens of new filings per year (47 in 2021), signed landmark licensing agreements, ran dozens of industry partnership projects, expanded the network of alumni companies (empresas-filhas) beyond 1,000 active businesses, supported the growth of the Unicamp Science and Technology Park and built innovation culture through the Inova Jovem and Desafio Unicamp programs [1]. He coordinates the innovation axis of the INCT on quantum devices (INCT-DQ, CNPEM), which runs a one-stop-shop portal (IP, technology transfer, entrepreneurship) and the Spin-Off Quântico mentored program [2], and the FAPESP Thematic (2018/25339-4) and multi-user (2022/11526-2) grants on photonic devices at Unicamp. Flavio C. Cruz founded BR Labs Ltda., a photonics instrumentation company, after a research appointment at NIST Boulder, and holds an AFOSR grant. CCSNano, co-directed by the Director, operates as an open multi-user facility serving academic and industrial users, and the Director’s group holds an industrial collaboration with Corning Inc. on fiber–chip coupling. The international associates bring direct industrial experience: Lončar co-founded HyperLight (TFLN foundry) and Gröblacher co-founded QPhox (microwave–optical transducers), both at the technology frontier of two lighthouses. Members of the team have patents and licensed technologies in photonics and semiconductor processing, and former students of the groups work in the São Paulo photonics and telecom industry (CPqD, Padtec, Eldorado Institute) and in quantum start-ups abroad."},{"t":"h1","x":"3. Instruments","id":"s3"},{"t":"p","x":"Industry Advisory Board (IAB). Five to seven members from companies and public bodies with a stake in quantum communication, sensing and photonic manufacturing (telecom operators and equipment makers, the national research and education network, agri-environmental monitoring agencies, a semiconductor or photonics foundry, a quantum start-up, the Campinas quantum-technologies hub and the ICTs of the region such as CPqD, Eldorado and Venturus). The IAB meets once a year with the Executive Committee, receives the lighthouse roadmap and the module pipeline,
