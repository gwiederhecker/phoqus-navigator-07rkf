tional communication offices through the periodic coordination meetings of A6; coverage monitoring tools of the institutions."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Press kit, image bank and contact list; first releases","A6","Media-training session; coverage report","annual Scientific Report metrics","Coverage of the annual meeting and public event","A6","Twelve releases; annual coverage report","A6"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"Press releases, press kit and coverage reports; a media-relations routine documented for the center; final report and assessment."}],"refs":{}},{"id":"f-JC2-02","group":"JC2","title":"JC2-02: Content of the itinerant exhibition on quantum light","pages":2,"file":"JC2/JC2-02_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship on the content of the itinerant exhibition: texts, labels and multimedia of the ten interactive stations, written with the researchers and the science-museum partner, including the second half of the exhibition on the photonics industry (from optical fibers and telecom to quantum chips)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A3 builds a modular exhibition shown in science centers, schools and public events from Year 3. The fellowship, based in Campinas and supervised by the Director, provides the journalistic writing of the exhibition in coordination with the museum partner’s design team. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-II, for holders of a higher-education degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Write the texts and labels of the ten stations at three reading levels (child, general public, teacher), reviewed by the researchers."},{"t":"p","x":"2. Produce the multimedia content (short videos, interviews, timeline of photonics in Brazil) of the industry half."},{"t":"p","x":"3. Test the texts with visitors during the prototype phase and revise them."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Content workshops with the station owners; interviews with industry partners of the Innovation plan; prototype testing with the museum partner; accessibility review (Portuguese, English, audio description)."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Content map and reading-level guide","A3","Texts of ten stations drafted and reviewed","A3 (prototype)","Multimedia produced; visitor test","A3","Final texts delivered to production","A3 (Year-3 opening)"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"The exhibition’s content package (texts, labels, multimedia); training in museum writing; final report and assessment."}],"refs":{}},{"id":"f-JC2-03","group":"JC2","title":"JC2-03: Audio and video series on the people and results of the center","pages":1,"file":"JC2/JC2-03_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship producing a monthly audio or video series on the people and results of the center (fellows, technicians, PIs, international associates), aimed at a general audience and at students considering a career in quantum technologies."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A6 covers the center’s channels and social-media presence; this fellowship, supervised by the Knowledge Diffusion Coordinator at USP, adds a long-form, interview-based format that documents the center’s training pipeline (A7) from the inside. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-II, for holders of a higher-education degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Produce twelve episodes (20–30 minutes) with script, interviews, editing and show notes."},{"t":"p","x":"2. Give voice to the diversity of the center’s fellows and technicians (gender, origin, institution)."},{"t":"p","x":"3. Report audience metrics and feedback."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Editorial planning with the Diffusion Manager; recording in the laboratories of USP and Campinas; editing on institutional equipment; distribution on the center’s channels and the institutions’ platforms; captions and transcripts."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Format, identity and first two episodes","A6","Six episodes; audience report","annual Scientific Report metrics","Episodes with the international associates and the school","A1, A6","Twelve episodes; archive and format guide","A6, A7"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"A twelve-episode series with transcripts; audience metrics; training in audio and video journalism; final report and assessment."}],"refs":{}},{"id":"f-JC2-04","group":"JC2","title":"JC2-04: Communication of the annual meeting and public event; Diffusion metrics","pages":2,"file":"JC2/JC2-04_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship on the communication of the center’s events and on the consolidatio finitions and collection forms agreed","Diffusion metrics","Dashboard operating; first semester report","annual Scientific Report","Annual meeting and public event communicated","A6","Diffusion section of the annual report drafted","annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"Event communication archive, the metrics dashboard and the draft report section; training in event communication and in evidence-based diffusion reporting; final report and assessment."}],"refs":{}},{"id":"f-JC2-05","group":"JC2","title":"JC2-05: Documentary on the quantum-light circuit and the school","pages":1,"file":"JC2/JC2-05_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship producing a documentary (25–40 minutes) and derived short pieces on the center’s three demonstrations and on the students and teachers who visit them, filmed along the laboratory-visit circuit and at the annual school, for broadcast on the institutions’ channels and use in the exhibition (A3)."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A2 and A1 are the actions in which the public meets the center’s experiments; a documentary record is a product of these actions and material for A3 and A6. The fellowship is supervised by the Knowledge Diffusion Coordinator at USP. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-II, for holders of a higher-education degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Research, script and film the documentary with the Diffusion Manager and the researchers responsible for the demonstrations."},{"t":"p","x":"2. Produce six short derived pieces for social media and the exhibition."},{"t":"p","x":"3. Distribute the film through the institutions’ channels and report its reach."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Pre-production with the visit circuit team; filming during visits (image rights of minors handled through the schools) and the school; editing with the institutional audiovisual service; subtitles in Portuguese and English."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Research and script approved; filming plan","A2, A1","Filming of the circuit and of the school","A2, A1","Rough cut reviewed by the researchers","A3 (content)","Film and short pieces released; reach reported","A6, annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"A documentary and six short pieces; training in documentary science journalism; final report and assessment."}],"refs":{}},{"id":"f-JC3-01","group":"JC3","title":"JC3-01: Editor of the center’s communication plan","pages":2,"file":"JC3/JC3-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship for an experienced science journalist who acts as editor of the center’s communication plan: editorial line, quality control of the material produced by the JC-1 and JC-2 fellows, relations with the science desks of the national press and with the FAPESP Mídia Ciência program, and the training of the center’s researchers and fellows in public communication."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A6 sets a communication plan run by the Diffusion Manager under the Knowledge Diffusion Coordinator; in the first years an experienced editor is needed to establish standards and the newsroom routine. The fellowship is supervised by the Coordinator at USP. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-III, for holders of a master’s degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Define and apply the editorial guide (accuracy, uncertainty, attribution, AI-use disclosure) of all center material."},{"t":"p","x":"2. Edit the monthly pieces, releases and series produced by the other JC fellows; run the weekly editorial meeting."},{"t":"p","x":"3. Teach the science-journalism short course for the JC fellows and the public-communication session of the annual school (A1)."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Editorial meetings; review workflow with the researchers; mentoring of the JC-1/JC-2 fellows; coordination with the institutional communication offices; a yearly review of the editorial line with the Coordinator and the Executive Committee."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Editorial guide and review workflow in force; short course given","A6, A1","Semester quality review of the published material","annual Scientific Report"]},{"t":"p","x":"Public-communication session at the school; national-press pieces placed A1, A6 Annual editorial report and recommendations A6 6. Integration and reporting The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s6"},{"t":"p","x":"The editorial guide, the review workflow, the trained cohort of JC fellows and an annual editorial report; assessment by the Coordinator and the Executive Committee."}],"refs":{}},{"id":"f-JC3-02","group":"JC3","title":"JC3-02: Narrative and curatorial coordination of the itinerant exhibition","pages":2,"file":"JC3/JC3-02_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship for an experienced science journalist who coordinates the narrative of the itinerant exhibition on quantum light with the science-museum partner: storyline of the ten stations, the industry half, the visitor journey, the editorial integration of the content produced by the JC-2 fellow and the evaluation of the exhibition at its first venues."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A3 is the largest single diffusion product of Phase 1 (four venues per year from Year 3). The fellowship, based in Campinas and supervised by the Director, provides the curatorial and editorial coordination between the researchers, the museum partner and the designers. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-III, for holders of a master’s degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Write the exhibition’s narrative concept and the brief for the museum partner’s design team."},{"t":"p","x":"2. Coordinate content production and review (JC2-02, researchers, industry partners)."},{"t":"p","x":"3. Design and run the visitor evaluation at the first two venues and report it."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Curatorial workshops with the researchers and the museum partner; prototype review cycles; visitor studies (observation, surveys) with the Diffusion Manager; coordination with the Innovation plan for the industry content."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Narrative concept and design brief approved","A3","Content production coordinated; prototype review","A3","Exhibition opened at the first venue; evaluation started","A3 (Year-3 opening)","Evaluation report and revision plan","annual Scientific Report, IAC review"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"The exhibition narrative, the production coordination record and the visitor-evaluation report; assessment by the Director and the museum partner."}],"refs":{}},{"id":"f-JC3-03","group":"JC3","title":"JC3-03: Long-form science journalism on quantum technologies","pages":2,"file":"JC3/JC3-03_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship for an experienced journalist producing a series of long-form, independently reported pieces on quantum technologies and their implications (security of communications, metrology, the photonics industry in Brazil, workforce and public policy), placed in national media and republished on the center’s website, in line with the FAPESP Mídia Ciência program."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A6 includes participation in the Mídia Ciência program and press relations; this fellowship, supervised by the Knowledge Diffusion Coordinator at USP, adds independent in-depth reporting that puts the center’s lighthouses in the national and international context, including critical views. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-III, for holders of a master’s degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Produce six long-form pieces (3000–5000 words or equivalent multimedia), reported with sources inside and outside the center."},{"t":"p","x":"2. Place at least three of them in national media outlets."},{"t":"p","x":"3. Document the reporting method as a case study for the science-journalism short course."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Independent reporting with editorial freedom guaranteed by the Coordinator; access to the center’s researchers, the international associates and the industry partners; fact-checking workflow; coordination of publication with the institutional offices."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Series plan; first piece","A6","Three pieces; first national placement","A6 metrics","Pieces on the school and the international associates","A1, A6","Six pieces; case study for the short course","A6, annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"Six long-form pieces, their placements and the reporting case study; assessment by the Coordinator."}],"refs":{}},{"id":"f-JC3-04","group":"JC3","title":"JC3-04: Editor of the open educational material","pages":2,"file":"JC3/JC3-04_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship for an experienced science journalist or science-education communicator who edits the center’s open educational material: the applet series, its texts and videos, the teacher-course material, the visit scripts and the lecture notes of the school, so that they form one consistent, accessible and openly licensed collection in Portuguese and English."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"A5 and A4 produce material used across the Diffusion plan and in the undergraduate courses of the partner institutions; consistency of level, terminology and license requires an editor. The fellowship is based in Campinas and supervised by the Director. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-III, for holders of a master’s degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Define the material standard (levels, terminology, accessibility, license, AI-use disclosure) and apply it to all open material."},{"t":"p","x":"2. Edit the texts and videos produced by JC1-05 and JC1-06 and the lecture notes of the school (JC1-04)."},{"t":"p","x":"3. Organize the public repository of the collection and report its use (downloads, adoptions by schools)."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Editorial workflow with the researchers who own each concept; review by secondary-school teachers from the A4 course; repository with version control and metadata; accessibility checks."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Material standard published; repository structure","A5","First edited release of the applet series and course material","A4, A5","Lecture notes of the school edited and released","A1, A5","Collection report (use, adoptions); plan for Year-2 editions","annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"The open-material standard, the edited collection in a public repository and its usage report; assessment by the Director and the Coordinator."}],"refs":{}},{"id":"f-JC3-05","group":"JC3","title":"JC3-05: Evaluation of the Diffusion plan and of the training pipeline","pages":2,"file":"JC3/JC3-05_final.pdf","blocks":[{"t":"h1","x":"1. Summary","id":"s1"},{"t":"p","x":"Twelve-month fellowship for an experienced journalist or evaluator who documents and evaluates the Diffusion plan: the training pipeline (A7, including the destination of alumni and the inclusion calls), the audience studies of A2–A4 and the external evaluation of the plan prepared for the International Advisory Committee, with a public report on what the center has learned about communicating quantum science."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"The Diffusion plan foresees an external evaluation by the International Advisory Committee in Years 4–5 and reports metrics annually; a rigorous evaluation needs to be designed early. The fellowship is supervised by the Knowledge Diffusion Coordinator at USP. The science journalism fellowships implement the Knowledge Diffusion Action Plan of the center (actions A1–A7) under its Knowledge Diffusion Coordinator; the level requested is JC-III, for holders of a master’s degree (any field). As required by the FAPESP norm for science journalism fellowships, the fellow must have completed, or be attending, an introductory course in science journalism of at least 90 hours, must hold no employment and must have oral and written proficiency in English; the fellowship is requested for 12 months, with a start on the first day of a month."},{"t":"h1","x":"3. Objectives","id":"s3"},{"t":"p","x":"1. Design the evaluation framework of the Diffusion plan (indicators, instruments, baselines) with the Coordinator and the Diffusion Manager."},{"t":"p","x":"2. Run the first audience and alumni studies and report them."},{"t":"p","x":"3. Write a public, journalistic report on the results and lessons of the plan."},{"t":"h1","x":"4. Methods and activities","id":"s4"},{"t":"p","x":"Mixed-methods evaluation (surveys, interviews, usage data) designed with specialists of the partner institutions’ science-communication groups; data handling under the Data Management Plan; writing for both the IAC and the public."},{"t":"h1","x":"5. Schedule","id":"s5"},{"t":"fig","x":["Month","Milestone of this plan","Diffusion action / metric it feeds","Evaluation framework and instruments approved","Diffusion metrics","Baseline studies (visits, school, teacher course) collected","A2, A1, A4","Alumni and inclusion study of the fellowship calls","A7","Evaluation report for the IAC and public report published","IAC review, annual Scientific Report"]},{"t":"h1","x":"6. Integration and reporting","id":"s6"},{"t":"p","x":"The fellow works with the Diffusion Manager allocated by the host institution and with the communication offices of the partner institutions, reports to the Knowledge Diffusion Coordinator, and contributes to the metrics of the Diffusion plan reported in the annual Scientific Report (media coverage, views and downloads, visitors and students reached). All material is published under an open license on the center’s website, with the sources and the role of AI tools, where used, stated openly."},{"t":"h1","x":"7. Expected products and assessment","id":"s7"},{"t":"p","x":"The evaluation framework, the baseline and alumni studies and two reports (IAC and public); assessment by the Coordinator and the IAC."}],"refs":{}},{"id":"f-TT5-01","group":"TT5","title":"TT5-01: Cryogenic optical and microwave integration for dilution-refrigerator experiments","pages":2,"file":"TT5/TT5-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Advanced technical training in instrumenting cryostats for simultaneous low-loss optical access, calibrated microwave lines and synchronized measurements on integrated quantum devices. The fellow prepares, integrates and qualifies the room-temperature-to-mK measurement chains used by L4 and by the cryogenic detectors of L1, and hands over documented procedures to the IFGW Cryogenics Facility; the scientific experiments remain with the work-package leads."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"XC-1 schedules the shared cryogenic and acoustic infrastructure of the center (Section 6 of the Research Plan) and trains the Cryogenics Facility technicians in closed-cycle and dilution-refrigerator operation, which the facility does not yet run. This fellowship is that training made explicit: the fellow trains together with the facility technicians, first on the 4 K closed-cycle systems at IFGW and on the dilution refrigerator under commissioning at USP (Benevides), and, in the second year, on the dilution refrigerator with optical access requested in this proposal for L4. Couto is the formal supervisor; scientific device design remains with QEPS-2, NIP-2 and QPC-3."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Train in cryostat safety, thermal anchoring and cooldown procedures; document the optical and microwave heat loads of each line."},{"t":"p","x":"2. Integrate fiber feedthroughs, microwave input/output lines, attenuators and filters with a traceable room-temperature-to-mK loss budget for 4 K and mK systems."},{"t":"p","x":"3. Automate temperature, RF/optical transmission and system-state logging; validate baseline drift over repeated cooldowns."},{"t":"p","x":"4. Issue the qualified cryogenic-interface procedure of the center and train users together with the facility staff."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"The fellow shadows the facility operators, produces interface drawings, calibrates reference cables and fibers, and integrates readout with the VNA, optical sources and temperature logs. Months 1–3: safety, access rules and interface baseline on the 4 K systems; months 4–9: instrument-chain assembly and insertion-loss references; months 10–15: thermal-load and repeatability tests on the USP dilution refrigerator; months 16–24: transfer to the IFGW dilution refrigerator, qualification cycles and hand-over."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"p","x":"Month Milestone and verification evidence Center milestone it feeds Safety and interface baseline approved; heat-load and calibration register XC-1 Optical/RF lines installed on a 4 K system; reference insertion losses measured SNSPD/cryogenic interfaces of L1 Two qualified mK measurement cycles at USP; scripts and drift report L4 (first conversion at mK)"},{"t":"p","x":"Interface procedure, validation dataset and user-training records released at IFGW QEPS-2, L4-T 6. Integration, facilities and data management Primary host: IFGW Cryogenics Facility at Unicamp; mK training at the Benevides laboratory at USP under that facility’s permissions. Wiederhecker provides the optical-interface expertise and Alegre and Benevides the microwave and device interfaces; QPC-3 uses the qualified fiber feedthrough for the cryogenic attach of L4. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id":"s6"},{"t":"p","x":"A qualified optical/RF cryogenic access module; thermalization and loss budgets; logged scripts and metadata; two acceptance reports; supervised hand-over to at least three users and to the facility technicians. Evaluation is based on demonstrated technical competencies, documented reproducibility and acceptance tests; publications are not required."}],"refs":{}},{"id":"f-TT5-02","group":"TT5","title":"TT5-02: Quantum-noise metrology and automated balanced-homodyne characterization","pages":1,"file":"TT5/TT5-02_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Advanced technical training in the shared quantum-optical measurement stack of the center: balanced homodyne detection, shot-noise calibration, phase control, digitization and state-reconstruction data formats, so that squeezing measured on chips from different groups is compared with the same calibrated numbers."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"The USP continuous-variable bench is the measurement anchor of the on-chip squeezer (L2) and of the squeezed light injected into the dual-comb spectrometer (L3). The fellow qualifies the instruments and their comparability across chips; the QPC-2 research fellows keep responsibility for the squeezing physics and tomography. Martinelli is the formal supervisor, with Nussenzveig, Barbosa, Barros and Cruz as technical co-responsibles."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Calibrate detector balance, electronic-noise clearance and effective detection efficiency, with uncertainties."},{"t":"p","x":"2. Implement versioned automated sweeps of local-oscillator phase, optical power and detector gain."},{"t":"p","x":"3. Cross-check variance normalization and spectral-density estimates on reference and chip sources."},{"t":"p","x":"4. Train users and release the shared quadrature-metrology protocol of L2 and L3."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"Training combines detector electronics, RF spectrum analysis, instrument APIs, reference-source calibration and data-quality tests. Months 1–3: baseline and safety; months 4–9: automated phase/noise acquisition; months 10–18: two-device cross-laboratory comparison (USP and Unicamp sources); months 19–24: reference data and user transfer."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone and verification evidence","Center milestone it feeds","Shot-noise reference and detector checklist adopted","QPC-2","Automated homodyne acquisition with uncertainty logs","M1.0 (first joint chip–tomography measurement)","Cross-device quantum-noise acceptance report","L2-T","Shared scripts, protocol and training sign-off","L3"]},{"t":"h1","x":"6. Integration, facilities and data management","id":"s6"},{"t":"p","x":"Host: Institute of Physics, USP. Technical consultation with NIP-1 and QEPS-1 fixes common definitions of measured noise, calibration and optical losses; the protocol is the one used in the L2 and L3 threshold measurements. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id":"s7"},{"t":"p","x":"One qualified homodyne measurement stack; calibration budget; versioned acquisition software; two comparison reports; three trained instrument users. Evaluation is based on demonstrated technical competencies, documented reproducibility and acceptance tests; publications are not required."}],"refs":{}},{"id":"f-TT5-03","group":"TT5","title":"TT5-03: Squeezed-comb instrumentation and quantum-enhanced dual-comb metrology","pages":2,"file":"TT5/TT5-03_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Advanced technical training in interfacing squeezed-light sources with dual-comb spectroscopy: stabilized optical/RF synchronization, calibrated balanced detection, coherent mode matching, digitized interferograms and reproducible estimation benchmarks for the L3 quantum-enhanced spectrometer."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"L3 measures whether a quantum advantage survives a complete spectroscopy chain. Cruz leads dual-comb spectroscopy; Martinelli and Nussenzveig contribute squeezed-light generation and calibration; NIP-1 supplies the integrated comb sources. The fellow qualifies a common metrology and automation platform; the quantum-advantage analysis itself is owned by the QEPS-1 research fellows. Cruz is the formal supervisor, with Martinelli, Nussenzveig, Siqueira and Barea as technical co-responsibles."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Develop and calibrate synchronized comb repetition-rate and carrier-offset diagnostics, RF clocks, triggers and digitizer timing."},{"t":"p","x":"2. Integrate squeezed-light injection with local-oscillator alignment, balanced detection and shot-noise-referenced noise measurements, documenting the full optical loss budget."},{"t":"p","x":"3. Automate interferogram acquisition and reproducible classical-versus-squeezed reference measurements at matched optical resources, with pressure, temperature and path-length metadata."},{"t":"p","x":"4. Deliver stable technical protocols and traceable calibration records for the L3 threshold measurement and for user training."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"Months 1–3: training on comb, squeezed-light and laser-safety instrumentation; calibration of reference channels. Months 4–9: comb and digitizer synchronization, shot-noise and optical-loss baselines. Months 10–18: supervised squeezed-light injection, interferogram processing and repeated matched-resource tests. Months 19–24: acceptance protocols, software and training documentation."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone and verification evidence","Center milestone it feeds","Comb/shot-noise metrology plan and safety checklist","QEPS-1","Synchronized comb dataset and calibrated detection chain","S2 (proof-of-principle injection)"]},{"t":"p","x":"Repeatable classical/squeezed acquisition with loss and drift logs L3-T Reference pipeline, procedure and cross-team hand-over L3 6. Integration, facilities and data management Hosted in the IFGW comb laboratory, with technical activities on the USP continuous-variable benches under the responsible laboratory personnel. QEPS-1 research fellows own the quantum-enhancement analysis; the TT fellow provides calibration, stabilization, instrumentation and reproducible data workflows. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id":"s6"},{"t":"p","x":"One qualified squeezed-comb instrument interface, a versioned acquisition pipeline, auditable shot-noise and loss calibration records, at least two repeatability runs, and user-facing operating procedures. Evaluation is based on demonstrated technical competencies, documented reproducibility and acceptance tests; publications are not required."}],"refs":{}},{"id":"f-TT5-04","group":"TT5","title":"TT5-04: Fiber–chip facet-loss metrology and photonic packaging qualification","pages":2,"file":"TT5/TT5-04_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Advanced technical training in fiber–chip coupling metrology, fiber-array attach and photonic packaging for the shared platforms of the center. The per-facet loss of the packaged chips is the quantity on which the L2 budget (1.5 dB per facet) and the delivered pair rate of L1 depend; this fellowship makes its measurement and the attach process repeatable and documented."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"The same packaging and loss-assessment procedures serve Frateschi’s QRNG and QKD modules, the SiN and TFLN sources of NIP-1 and QPC-2 and the cryogenic attach of L4. The fellow develops standardized alignment, fiber handling, attach and acceptance measurement under QPC-3 coordination; coupler design remains with the QPC-3 research fellows. Frateschi is the formal supervisor, with Wiederhecker and Tomázio (printed micro-optics and TFLN facets) as technical co-responsibles."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Prepare optical test chips, fibers and alignment stages under the laser-safety procedures of the laboratories."},{"t":"p","x":"2. Measure repeated per-facet transmission references on SiN and TFLN chips and record device and connector metadata."},{"t":"p","x":"3. Qualify the fiber-array attach process (alignment, adhesive, curing, strain relief) and the non-destructive inspection of packaged assemblies, including a cryogenic-compatible variant with TT5-01."},{"t":"p","x":"4. Issue the standard coupling-test and packaging acceptance procedure used by the work packages of all three branches."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"The fellow trains in optical alignment, connector cleaning, power-meter calibration, packaging fixturing and adhesive processes. Months 1–3: training and safety; months 4–9: reference SiN chips; months 10–15: TFLN facets and two-platform attach tests; months 16–20: cryogenic-compatible attach qualification; months 21–24: procedure release and user training."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone and verification evidence","Center milestone it feeds","Safety and fiber-handling checklist","QPC-3","Reference SiN coupling-loss report against the L2 facet budget","L1, L2","Two-platform (SiN, TFLN) packaging acceptance logs","L2-T","Cryogenic attach survives three cooldowns with logged loss","L4","Versioned facet-loss and packaging procedure; training session","QPC-3, Innovation plan (packaging module)"]},{"t":"h1","x":"6. Integration, facilities and data management","id":"s6"},{"t":"p","x":"Primary activities on the Unicamp chip-packaging and QPC-1 acceptance benches, with Tomázio’s printed micro-optics supporting the reference techniques; the cryogenic variant is tested with TT5-01 at the IFGW Cryogenics Facility. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id":"s7"},{"t":"p","x":"At least ten calibrated coupling measurements per platform; two chip-platform reports; one qualified attach process with its acceptance procedure; a training session for users. Evaluation is based on demonstrated technical competencies, documented reproducibility and acceptance tests; publications are not required."}],"refs":{}},{"id":"f-TT4A-01","group":"TT4A","title":"TT4A-01: SiN and TFLN process modules at CCSNano: waveguide processing and poling metrology","pages":2,"file":"TT4A/TT4A-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Specialized training in the SiN and TFLN process modules of CCSNano that support the lighthouse chips: low-loss waveguides, electrode patterning, periodic-poling test structures and piezo-optomechanical components, with the metrology and documentation (travelers, QC records) that make the process reproducible for other users."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"The SiN baseline (M1.1, NIP-1) is the first element on which L1, L2 and L3 depend, and TFLN connects the PPLN squeezing track of L2 to the electro-optic, Brillouin and piezo-optomechanical devices of NIP-2 and QEPS-2. This fellowship qualifies the shared lithography, etch, electrode and surface-preparation procedures of both platforms; the NIP-1 postdoc owns the SiN baseline and the research fellows own the devices. Alegre is the formal supervisor, with Wiederhecker (SiN baseline), Tomázio (TFLN processing) and Barbosa (CMP and wafer-surface preparation) as technical co-responsibles."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Qualify the authorized SiN and TFLN lithography, etching, metallization and wafer-surface preparation steps on shared reference devices."},{"t":"p","x":"2. Measure feature dimensions, alignment, roughness, waveguide loss and electrode continuity for every reference lot."},{"t":"p","x":"3. Prepare poling test structures and the domain-metrology methods ahead of the PPLN-TFLN transfer scheduled for Year 3."},{"t":"p","x":"4. Deliver traceable SiN and TFLN process travelers and reproducibility metrics for NIP-1, NIP-2, QPC-2 and QEPS-2."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"The fellow trains in cleanroom safety, EBL and etch tools, microscopy, electrical probing and optical transmission metrology. Months 1–3: tool qualification and SiN reference lot; months 4–9: TFLN waveguide/electrode test run; months 10–18: repeated lots on both platforms and poling test structures; months 19–24: QC release and user training."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone and verification evidence","Center milestone it feeds","Authorized SiN and TFLN process travelers","M1.1, NIP-2","TFLN waveguide/electrode reference lot characterized","QPC-2"]},{"t":"p","x":"Three-lot acceptance on each platform; poling test-structure report L2, L4 Versioned SiN/TFLN QC documentation and user training CCSNano process modules (Innovation plan)"},{"t":"h1","x":"6. Integration, facilities and data management","id":"s6"},{"t":"p","x":"Hosted at CCSNano (Unicamp); interfaces with the QPC-2 PPLN transfer and the QEPS-2 electromechanical structures. Poling-transfer dates are dependencies of the schedule (Section 8 of the Research Plan), and until the transfer the fellow qualifies non-poled reference lots. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id":"s7"},{"t":"p","x":"Three logged test lots per platform, QC metrics, witness devices, updated travelers and facility user-training materials. Evaluation is based on demonstrated technical competencies, documented reproducibility and acceptance tests; publications are not required."}],"refs":{}},{"id":"f-TT4-01","group":"TT4","title":"TT4-01: 2D-material transfer and characterization and hybrid photonic chip preparation","pages":2,"file":"TT4/TT4-01_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Technical training in transferring and inspecting 2D materials on photonic substrates for NIP-3 and NIP-4, using shared MackGraphe/CCSNano sample standards and optical-insertion-loss checks."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"MackGraphe provides the 2D-material node of the center with qualified characterization instruments. The fellow supports sample handling, transfer logs, alignment and inspection for NIP-3 and for the integrated-emitter studies of NIP-4; the doctoral and postdoctoral researchers investigate the nonlinear conversion and device physics. De Matos is the formal supervisor, with Rosa, Cadore and Wiederhecker as technical co-responsibles."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Prepare and identify 2D-material samples and SiN witness chips using the cleaning and safety procedures of the laboratory."},{"t":"p","x":"2. Assist supervised growth, transfer and pattern-registration operations, recording sample coverage and contamination."},{"t":"p","x":"3. Carry out optical microscopy, Raman and photonic transmission checks with the laboratory staff, before and after integration."},{"t":"p","x":"4. Organize transfer-condition metadata, sample-tracking documents and a repeatability checklist for group users."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"Months 1–2: safety and supervised sample preparation at MackGraphe; months 3–6: transfer and registration support for reference structures; months 7–10: optical, Raman and insertion-loss checks on repeated samples; months 11–12: procedure, traceability and user hand-over."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone and verification evidence","Center milestone it feeds","Safety induction and sample registry","NIP-3","First two integrated witness-chip records","NIP-3","Comparison of three 2D transfer batches","L1, L2 (hybrid nonlinear elements)","Sample-handling, inspection and QC procedure","MackGraphe node"]},{"t":"h1","x":"6. Integration, facilities and data management","id":"s6"},{"t":"p","x":"Hosted at MackGraphe (Mackenzie) under de Matos, using optical microscopy, Raman and material-processing facilities; Cadore contributes the CNPEM material-preparation expertise and Wiederhecker the transfer onto reference SiN chips. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id":"s7"},{"t":"p","x":"Three logged transfer batches, inspection and optical-loss records, sample traceability and a documented procedure for repeatable 2D-photonic sample preparation. Evaluation is based on demonstrated technical competencies, documented reproducibility and acceptance tests; publications are not required."}],"refs":{}},{"id":"f-TT4-02","group":"TT4","title":"TT4-02: Quantum-emitter sample preparation and reference optical characterization","pages":1,"file":"TT4/TT4-02_final.pdf","blocks":[{"t":"h1","x":"1. Summary and purpose of the technical training","id":"s1"},{"t":"p","x":"Technical training in the safe handling and traceable optical reference characterization of epitaxial, colloidal and 2D quantum-emitter samples, linking the NIP-4 material groups through a common preparation and measurement record."},{"t":"h1","x":"2. Context in the PHOQUS Center","id":"s2"},{"t":"p","x":"NIP-4 benchmarks semiconductor emitters along an integrability–coherence axis. Deneke provides the formal supervision and the link to the MBE-grown quantum dots; Padilha and the associate researchers share the measurement protocols for the other materials. The fellow handles standardized sample and instrument preparation while the coherence studies remain with the NIP-4 research fellows. Deneke is the formal supervisor, with Padilha, Covre da Silva, Almeida and Gobato as technical co-responsibles."},{"t":"h1","x":"3. Objectives and competencies to be developed","id":"s3"},{"t":"p","x":"1. Build a common wafer/sample identity and optical alignment/calibration checklist for epitaxial, colloidal and 2D-emitter test pieces."},{"t":"p","x":"2. Prepare mounts, optical fixtures and measurement records under clean-handling and laser-safety rules."},{"t":"p","x":"3. Collect supervised reference photoluminescence and detector-response files with consistent excitation-power and spectral metadata."},{"t":"p","x":"4. Release a cross-group measurement procedure and reference dataset under the Data Management Plan."},{"t":"h1","x":"4. Methods, training activities and supervision","id":"s4"},{"t":"p","x":"Under guidance, the fellow trains in microscope alignment, optical safety, spectrometer calibration and sample registers. Months 1–2: safety; months 3–6: reference collection; months 7–10: cross-sample metrology; months 11–12: procedure release."},{"t":"h1","x":"5. Schedule and milestones","id":"s5"},{"t":"fig","x":["Month","Milestone and verification evidence","Center milestone it feeds","Alignment/calibration checklist","NIP-4","Spectral-response reference dataset","NIP-4","Metadata-complete sample logs for the three emitter classes","L1 (QD track down-select, D1)","Standard optical-setup procedure","NIP-4"]},{"t":"h1","x":"6. Integration, facilities and data management","id":"s6"},{"t":"p","x":"Uses the Unicamp optical and ultrafast spectroscopy facilities, coordinating with the NIP-4 epitaxial and 2D measurement groups and with the UFSCar low-vibration cryostat. All raw and processed data, calibration records, sample IDs and controlled software versions follow the Data Management Plan."},{"t":"h1","x":"7. Expected technical deliverables and assessment","id" ":"Principal Investigator and Director","hours":30,"desc":"Scientific and administrative direction of the Center; chair of the Executive Committee; representative before FAPESP; lead of Branch A (NIP) and of work package NIP-1 (Kerr and electro-optic combs, DOPO in coupled microresonators), co-lead of NIP-2 and QPC-3; owner, with QPC-1, of lighthouse L1; co-direction of CCSNano as the Center’s fabrication base; host of NIP-1 DD1, PD1 and MS1 and of the branch-reserve fellowships NIP-2 DD1 and QPC-3 DD1; coordination of the cooperation with Del’Haye (MPL) and the Corning collaboration.","kind":"pp"},{"name":"Thiago P. M. Alegre","aff":"Unicamp, IFGW","role":"Vice-Director","hours":20,"desc":"Deputy of the Director; coordination of the three research branches and of the shared-infrastructure schedule; lead of Branch C (QEPS) and of QEPS-2 (piezo-optomechanical transduction), co-lead of NIP-2; owner of lighthouse L4; host of QEPS-2 DR1 (with Rouxinol), PD1 and MS1; coordination of the cooperation with Gröblacher (TU Delft); coordinator of the PHOQUS school (SPSAS 25/08613-9 as its first edition).","kind":"pp"},{"name":"Newton C. Frateschi","aff":"Unicamp, IFGW","role":"Innovation Coordinator and PP","hours":20,"desc":"Responsible for the Innovation Action Plan, the Industry Advisory Board, the module evaluation agreements and the intellectual-property procedure with Inova Unicamp; lead of QPC-1 (chip QKD transmitters and QRNG); delivery of the QRNG module (M1.2) and of the QKD evaluation testbed; host of QPC-1 DD1, PD1 and MS1; liaison with INCT-DQ (CNPEM) and with CCSNano’s industrial users.","kind":"pp"},{"name":"Paulo A. Nussenzveig","aff":"USP, IF","role":"Knowledge Diffusion Coordinator and PP","hours":20,"desc":"Responsible for the Knowledge Diffusion Action Plan (school, visits, exhibition, teacher training, open material, communication) and its metrics; co-lead of QPC-2 (continuous-variable quantum photonics) with Martinelli; host of QPC-2 DR2 (SiN Kerr squeezing and tomography) and PD2 (multimode squeezing, H3); member of the Executive Committee.","kind":"pp"},{"name":"Marcelo Martinelli","aff":"USP, IF","role":"PP","hours":20,"desc":"Lead of Branch B (QPC) and of QPC-2; owner of lighthouse L2 (integrated squeezing with on-chip readout); responsible for the USP continuous-variable bench as a shared facility of the Center and for the convergence milestone M1.0; host of QPC-2 DR1 (PPLN-TFLN OPO with on-chip readout), PD1 and MS1; co-lead of QEPS-1 for the squeezed-light injection of L3.","kind":"pp"},{"name":"Flavio C. Cruz","aff":"Unicamp, IFGW","role":"PP","hours":20,"desc":"Lead of QEPS-1 (squeezed dual-comb spectroscopy); owner of lighthouse L3; responsible for the comb and spectroscopy instrumentation as a shared facility and for the comb-noise protocol with NIP-1; host of QEPS-1 DD1, PD1 and MS1; liaison with sensing partners (agri-environmental) for the Innovation plan; co-lead of NIP-1 for electro-optic combs.","kind":"pp"},{"name":"Christiano J. S. de Matos","aff":"Mackenzie, MackGraphe","role":"PP","hours":20,"desc":"Lead of NIP-3 (2D materials as χ(2) media and hybrid nonlinear devices); responsible for the MackGraphe growth and transfer facility as a node of the shared fabrication pathway and for the Mackenzie SNSPD-based source characterization; host of NIP-3 DR1 and PD1; coordination of the cooperation with Soavi (FSU Jena).","kind":"pp"},{"name":"Christoph F. Deneke","aff":"Unicamp, IFGW","role":"PP","hours":20,"desc":"Co-lead of NIP-4 (quantum emitters) for epitaxial quantum dots; responsible, with Covre da Silva, for the MBE system as a shared facility and for the droplet-etched QD growth and processing; host of NIP-4 DD1 and PD1 and co-host of NIP-4 MS1; the deterministic QD track of lighthouse L1.","kind":"pp"},{"name":"Lázaro A. Padilha Jr.","aff":"Unicamp, IFGW","role":"PP","hours":20,"desc":"Co-lead of NIP-4 for colloidal and 2D emitters and for the integrability–coherence benchmark; responsible for the ultrafast and coherent spectroscopy facility; host of NIP-4 DR1 and PD2 and co-host of NIP-4 MS1; link to UFSCar (Gobato) for 2D emitters.","kind":"pp"},{"name":"Odilon D. D. Couto Jr.","aff":"Unicamp, IFGW","role":"PP","hours":20,"desc":"Lead of the cross-cutting platform XC-1 (acoustic control and cryogenic operation); coordinator of the IFGW Cryogenics Facility and of the shared cryogenic schedule used by NIP-4, QPC-3 and QEPS-2; responsible for SAW devices on LN and GaAs and for strain engineering of emitters; host of XC-1 DD1 and PD1; co-lead of NIP-4 for acoustically tuned emitters. Branch leads, WP leads and fellowship hosts are those of the Research Plan (Sections 5 and 5.5) as of October 2026 and may be adjusted by the Executive Committee at the decision points D1 and D2.","kind":"pp"},{"name":"Alisson R. Cadore","aff":"CNPEM, LNNano","role":"","hours":5,"desc":"2D-material growth and heterostructure fabrication for NIP-3 and NIP-4; LNNano open-facility access for lithography and microscopy; acoustic modulation of excitonic complexes with XC-1.","kind":"associate"},{"name":"Breno Marques G. Teixeira","aff":"UFABC","role":"","hours":10,"desc":"Quantum-information protocols, device-independent randomness and the entropy certification of the QRNG module (QPC-1); photonic-chip protocol design with the JP 21/14303-1 group.","kind":"associate"},{"name":"Diogo B. Almeida","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"Ultrafast and NV-center spectroscopy for NIP-4 and QEPS-3; coherent spectroscopy protocols of the colloidal emitters.","kind":"associate"},{"name":"Felippe A. S. Barbosa","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"Continuous-variable measurement methods for QPC-2 (assumption-free sideband measurements, hidden entanglement); chemical-mechanical polishing support for wafer preparation.","kind":"associate"},{"name":"Francisco P. M. Rouxinol","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"Superconducting-circuit design and Josephson-junction fabrication for the L4 transducer (QEPS-2); co-supervisor of QEPS-2 DR1.","kind":"associate"},{"name":"Giancarlo Soavi","aff":"FSU Jena","role":"international associate","hours":3,"desc":"Ultrafast nonlinear optics of 2D materials for NIP-3; host of BEPE stays; joint publications on 2D nonlinear devices.","kind":"associate"},{"name":"Hans M. Florez","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"Optically pumped magnetometers and squeezed-light readout for QEPS-3; lead of QEPS-3 and co-host of QEPS-3 DD1 and MS1.","kind":"associate"},{"name":"Henrique G. Rosa","aff":"Mackenzie","role":"","hours":10,"desc":"Integrated 2D-material devices and saturable absorbers for NIP-3; MackGraphe fabrication support.","kind":"associate"},{"name":"Jonathas de P. Siqueira","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"VUV and THz sources and spectroscopy for the spectral extension of QEPS-1.","kind":"associate"},{"name":"Luis A. M. Barea","aff":"UFSCar","role":"","hours":10,"desc":"Integrated photonic modeling (multiport couplers, photonic molecules) for NIP-1 and QPC-1; hollow-core gas sensing for QEPS-1.","kind":"associate"},{"name":"Marko Lončar","aff":"Harvard","role":"international associate","hours":3,"desc":"TFLN design and periodic poling for QPC-2, NIP-2 and QEPS-2; host of BEPE stays; process transfer to CCSNano by Year 5; industrial insight through HyperLight.","kind":"associate"},{"name":"Markus Schmidt","aff":"Leibniz IPHT Jena","role":"international associate","hours":3,"desc":"3D nanoprinted fiber–chip couplers for QPC-3; host of BEPE stays and of N. Tomázio’s fellowship; transfer of the printing process.","kind":"associate"},{"name":"Nathália B. Tomázio","aff":"USP","role":"","hours":10,"desc":"Fiber–chip interfaces and two-photon-polymerised micro-optics for QPC-3; co-lead of QPC-3 and co-host of QPC-3 DD1 and MS1.","kind":"associate"},{"name":"Pascal Del’Haye","aff":"MPL Erlangen","role":"international associate","hours":3,"desc":"Ultralow-loss sputtered SiN and microcomb physics for NIP-1; host of BEPE stays; process transfer to CCSNano.","kind":"associate"},{"name":"Pierre L. de Assis","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"Quantum-dot optomechanics and color-center photonics for QEPS-3 and XC-1; co-host of QEPS-3 DD1.","kind":"associate"},{"name":"Rafael F. P. do R. Barros","aff":"USP","role":"","hours":10,"desc":"Structured quantum light and spatial-mode engineering for QPC-2; SNSPD facility at USP (EMU 25/03500-1) for the source metrics of the Center.","kind":"associate"},{"name":"Rodrigo da S. Benevides","aff":"USP, IF","role":"","hours":10,"desc":"Modular microwave–optical transduction in his new USP laboratory with a dilution refrigerator (EMU 25/08511-1) for QEPS-2 and L4; quasiparticle and loss physics of superconducting circuits.","kind":"associate"},{"name":"Saimon F. Covre da Silva","aff":"Unicamp, IFGW","role":"","hours":10,"desc":"Telecom single-photon sources and the MBE system (EMU 25/06758-0) for NIP-4; QD-based QKD expertise for QPC-1.","kind":"associate"},{"name":"Simon Gröblacher","aff":"TU Delft","role":"international associate","hours":3,"desc":"Quantum optomechanics and transducer design transfer for QEPS-2; host of BEPE stays; industrial insight through QPhox.","kind":"associate"},{"name":"Yara G. Gobato","aff":"UFSCar","role":"","hours":5,"desc":"","kind":"associate"}]}</script>

/* =====================================================================================
   XLSX parser (no dependencies): ZIP central directory + DecompressionStream + XML
   ===================================================================================== */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), files = {};
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("Not a valid .xlsx (zip) file");
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  for (let k = 0; k < count; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true), name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    files[name] = {method, csize, off};
    p += 46 + nlen + xlen + clen;
  }
  return async function read(name){
    const f = files[name]; if (!f) return null;
    const ln = dv.getUint16(f.off + 26, true), lx = dv.getUint16(f.off + 28, true);
    const data = u8.subarray(f.off + 30 + ln + lx, f.off + 30 + ln + lx + f.csize);
    if (f.method === 0) return dec.decode(data);
    if (typeof DecompressionStream === "undefined") throw new Error("This browser cannot decompress .xlsx files (DecompressionStream unavailable)");
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(stream).text();
  };
}
async function parseXlsx(buf){
  const read = await unzip(buf), xml = s => new DOMParser().parseFromString(s, "application/xml");
  const byTag = (node, tag) => Array.from(node.getElementsByTagNameNS("*", tag));
  const ss = [], ssx = await read("xl/sharedStrings.xml");
  if (ssx) byTag(xml(ssx), "si").forEach(si => ss.push(byTag(si, "t").map(t => t.textContent).join("")));
  const wb = xml(await read("xl/workbook.xml")), rels = xml(await read("xl/_rels/workbook.xml.rels"));
  const target = {}; byTag(rels, "Relationship").forEach(r => target[r.getAttribute("Id")] = r.getAttribute("Target"));
  const sheets = {};
  for (const s of byTag(wb, "sheet")){
    const rid = s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    let path = target[rid] || ""; path = path.startsWith("/") ? path.slice(1) : "xl/" + path.replace(/^\.\//, "");
    const sx = await read(path); if (!sx) continue;
    const rows = [];
    for (const c of byTag(xml(sx), "c")){
      const ref = c.getAttribute("r"), m = /^([A-Z]+)(\d+)$/.exec(ref); if (!m) continue;
      let col = 0; for (const ch of m[1]) col = col * 26 + ch.charCodeAt(0) - 64; col -= 1;
      const row = +m[2] - 1, t = c.getAttribute("t"), v = byTag(c, "v")[0];
      let val = null;
      if (t === "s") val = v ? ss[+v.textContent] : null;
      else if (t === "inlineStr") val = byTag(c, "t").map(x => x.textContent).join("");
      else if (t === "str") val = v ? v.textContent : null;
      else if (t === "b") val = v ? v.textContent === "1" : null;
      else if (t === "e") val = null;
      else val = v ? parseFloat(v.textContent) : null;
      if (val === null || val === "") continue;
      (rows[row] ||= [])[col] = val;
    }
    sheets[s.getAttribute("name")] = rows;
  }
  return sheets;
}

function itemTable(rows, rate){
  if (!rows) return [];
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 12); i++){ const r = rows[i] || []; if (r.includes("Item") && r.includes("Descrição")){ h = i; break; } }
  if (h < 0) return [];
  const idx = {}; rows[h].forEach((v, k) => { if (v) idx[norm(v)] = k; });
  const g = (r, name) => idx[name] !== undefined ? r[idx[name]] : undefined;
  const out = [];
  for (let i = h + 1; i < rows.length; i++){
    const r = rows[i]; if (!r) continue;
    const desc = g(r, "descricao"); if (!desc || norm(desc) === "total") continue;
    const qty = g(r, "qtd"); if (qty === 0) continue;
    const brl = +(g(r, "total r$") || 0), usd = +(g(r, "total us$") || 0);
    if (!brl && !usd && qty === undefined) continue;
    out.push({item:g(r, "item"), qty: qty ?? null, desc:String(desc).trim(), req:cleanRequester(g(r, "requisitante")),
      origin: norm(g(r, "origem")) === "importado" ? "Imported" : (norm(g(r, "origem")) === "nacional" ? "Domestic" : ""),
      cur:g(r, "moeda de origem") || "", unit:g(r, "valor unitario (moeda origem)") ?? g(r, "valor (moeda origem)"), fx:+(g(r, "taxa de cambio (us$ por unidade)") || 1),
      brl, usd, eq: brl + usd * rate, just:String(g(r, "justificativa") || "").trim(), sit:String(g(r, "situacao") || ""),
      place:[g(r, "cidade"), g(r, "estado")].filter(Boolean).join(", ")});
  }
  return out;
}
function interpretBudget(S){
  const B = {ok:false, warnings:[]};
  const res = S["Resumo"]; if (!res){ B.error = "Sheet 'Resumo' not found"; return B; }

  B.rate = param("Dólar FAPESP (R$/US$)") || 5.25;
  B.pct = {rtinfra:param("% Reserva Técnica – Custo de Infraestrutura Direta"), imp:param("% Provisão para Importação"), rti:param("% Reserva Técnica Institucional (RTI)")};
  const kv = r => res.find(x => x && norm(x[0]) === r);

    if (!r || typeof r[0] !== "string") continue;
    const key = RESUMO_ROWS[norm(r[0])]; if (!key) continue;
    B.sum[key] = {brl:+(r[1] || 0), usd:+(r[2] || 0), total:+(r[3] || 0)};
    const shv = typeof r[1] === "number" ? r[1] : r[3];
    if (typeof r[4] === "number" && typeof shv === "number" && Math.abs(shv - r[4]) > 1) B.warnings.push(`Resumo, ${r[0]}: sheet R$ ${Math.round(shv).toLocaleString("en-US")} vs SAGe column R$ ${Math.round(r[4]).toLocaleString("en-US")} — SAGe not yet updated (or vice versa).`);
  }

  B.total = tot("total") || Object.values(B.cat).reduce((a, b) => a + b, 0);
  B.auxilio = tot("auxilio");
  B.equipment = itemTable(S["Material Permanente"], B.rate).sort((a, b) => b.eq - a.eq);

    for (let i = h + 1; h >= 0 && i < q.length; i++){
      const r = q[i]; if (!r || !r[0] || norm(r[0]) === "total" || typeof r[3] !== "number") continue;
      B.quotas.push({mod:r[0], label:MODALITY[r[0]] || r[0], hours:r[1] || null, months:r[2], n:r[3], fm:r[4], monthly:r[5], total:+(r[6] || 0) + (+(r[7] || 0)) * B.rate});
      const conf = String(r[9] || "");
      if (/DIFEREN/i.test(conf)) B.warnings.push(`Fellowship quota ${r[0]}: sheet total R$ ${Math.round(r[6]).toLocaleString("en-US")} differs from the SAGe column (R$ ${Math.round(r[8] || 0).toLocaleString("en-US")}) — flagged "${conf}" in the workbook.`);

  [["Equipment", B.equipment], ["Consumables", B.consumables], ["Services", B.services]].forEach(([lab, arr]) => arr.forEach(x => {

    else if ((x.just.match(pt) || []).length >= 3) B.warnings.push(`${lab} #${x.item} "${x.desc.slice(0, 50)}": justification appears to be in Portuguese.`);
    if (x.unit && x.qty && x.cur !== "R$" && Math.abs(x.unit * x.qty * (x.fx || 1) - x.usd) > 1) B.warnings.push(`${lab} #${x.item} "${x.desc.slice(0, 50)}": unit price × quantity (${x.cur} ${(x.unit * x.qty).toLocaleString("en-US")}) does not match the total (US$ ${x.usd.toLocaleString("en-US")}).`);
    if (/[ãçõ]|\b(de|para|com|do|da)\b/i.test(x.desc)) B.warnings.push(`${lab} #${x.item} "${x.desc.slice(0, 50)}": description appears to be in Portuguese.`);
  }));
  [["Equipment", B.equipment], ["Consumables", B.consumables], ["Services", B.services]].forEach(([lab, arr]) => {
    const pend = arr.filter(x => /pendente/i.test(x.sit));
    if (pend.length) B.warnings.push(`${lab}: ${pend.length} item(s) still marked "Pendente" in the quote-tracking column (${pend.map(x => "#" + x.item).join(", ")}).`);
  });
  const catSum = Object.values(B.cat).reduce((a, b) => a + b, 0);
  if (Math.abs(catSum - B.total) > 1) B.warnings.push(`Category sum (${Math.round(catSum)}) differs from 'Custo total da proposta' (${Math.round(B.total)}).`);
  B.ok = true;
  return B;
}

const state = {budget:null, budgetName:"", budgetErr:null, cur:"BRL"};
function money(brl, opts = {}){
  if (brl === null || brl === undefined || isNaN(brl)) return "–";
  const usd = state.cur === "USD";
  const v = usd ? brl / state.budget.rate : brl;
  const pre = usd ? "US$ " : "R$ ";
  if (opts.short){
    const a = Math.abs(v);
    if (a >= 1e6) return pre + (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + " M";
    if (a >= 1e3) return pre + Math.round(v / 1e3).toLocaleString("en-US") + " k";
  }
  return pre + Math.round(v).toLocaleString("en-US");
}
function otherMoney(brl){
  const usd = state.cur !== "USD";
  const v = usd ? brl / state.budget.rate : brl;
  return (usd ? "US$ " : "R$ ") + (v / 1e6).toFixed(2) + " M";
}
function origMoney(x){
  if (x.unit === undefined || x.unit === null || x.unit === "") return "";
  const c = x.cur === "R$" ? "R$" : x.cur === "US$" ? "US$" : x.cur;
  return c + " " + (+x.unit).toLocaleString("en-US", {maximumFractionDigits:2});
}
async function loadBudgetFromBase64(){
  const node = document.getElementById("xlsx-data");
  const b64 = node.textContent.trim();
  state.budgetName = node.dataset.name || "budget.xlsx";
  if (!b64 || b64.startsWith("__")){ state.budgetErr = "No budget workbook embedded in this file."; return; }
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  await loadBudgetFromBuffer(u8.buffer);
}
async function loadBudgetFromBuffer(buf){
  try{
    const S = await parseXlsx(buf);
    const B = interpretBudget(S);
    if (!B.ok) throw new Error(B.error);
    state.budget = B; state.budgetErr = null; state.lastBuffer = buf;
  }catch(e){ state.budgetErr = "The budget workbook could not be read: " + e.message; console.error(e); }
  buildSearchIndex();
}

const LABELS = ["Physics question.","Starting point.","Observable:","Enables / metric:","Primary approach.","Parallel approaches.","Parallel approach.","Scientific result.","Decision point.","Question.","Approach.","Metric moved by this fellowship.","Composition.","Modus operandi.","Y1–3:","Phases."];
function expandRefs(s){
  const out = [];
  s.split(",").forEach(p => { const m = p.trim().split(/[–-]/).map(x => +x); if (m.length === 2 && m[1] > m[0] && m[1] - m[0] < 40){ for (let k = m[0]; k <= m[1]; k++) out.push(k); } else if (!isNaN(m[0])) out.push(m[0]); });
  return out;
}
function renderInline(text, doc, terms){
  let h = esc(text);
  const runin = /^([A-Z][A-Za-z0-9’'()\/\-–, ]{1,46}?[.:])\s(?=[A-Z0-9“(•])/.exec(text);
  if (runin && runin[1].split(/\s+/).length <= 4 && !/^\d/.test(runin[1])) h = "<strong>" + esc(runin[1]) + "</strong>" + h.slice(esc(runin[1]).length);
  for (const L of LABELS){ const e = esc(L); h = h.split(" " + e + " ").join(" <strong>" + e + "</strong> "); }
  if (doc && doc.refs && Object.keys(doc.refs).length){
    h = h.replace(/\[(\d+(?:\s*[–-]\s*\d+)?(?:\s*,\s*\d+(?:\s*[–-]\s*\d+)?)*)\]/g, (m, inner) => {
      const ks = expandRefs(inner).filter(k => doc.refs[k]);
      return ks.length ? `<span class="cite" tabindex="0" data-refs="${ks.join(",")}">${m}</span>` : m;
    });
  }
  if (terms && terms.length) h = highlight(h, terms);
  return h;
}
function highlight(html, terms){
  const parts = html.split(/(<[^>]+>)/);
  const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return parts.map(p => p.startsWith("<") ? p : p.replace(re, "<mark>$1</mark>")).join("");
}
const LIVE = {"Table 1":"#/roadmap","Figure 1":"#/roadmap","Figure 2":"#/roadmap","Table 2":"#/fellowships","Table 3":"#/roadmap/milestones","Figure 3":"#/roadmap/milestones"};
function renderBlocks(doc, terms, hiBlock){
  const out = [];
  doc.blocks.forEach((b, i) => {
    const hi = i === hiBlock ? " hl" : "";
    const id = `id="${b.id || "b" + i}"`;
    if (b.t === "h1") out.push(`<h2 ${id} class="${hi}">${renderInline(b.x, null, terms)}</h2>`);
    else if (b.t === "h2") out.push(`<h3 ${id} class="${hi}">${renderInline(b.x, null, terms)}</h3>`);
    else if (b.t === "h3") out.push(`<h4 ${id} class="${hi}">${renderInline(b.x, null, terms)}</h4>`);
    else if (b.t === "wp") out.push(`<h3 ${id} class="wp${hi}" style="--bc:var(--${branchOf(b.wp)})">${renderInline(b.x, null, terms)} <a class="chip ghost" href="#/wp/${b.wp}">Work package card</a></h3>`);
    else if (b.t === "cap"){
      out.push(`<p ${id} class="cap${hi}">${renderInline(b.x, doc, terms)}</p>`);
      const k = (b.x.match(/^(Figure|Table) \d+/) || [])[0];
      if (doc.id === "research_plan" && LIVE[k]) out.push(`<p class="tolive"><a href="${LIVE[k]}">Open the interactive version of ${k}</a></p>`);
    }
    else if (b.t === "fig") out.push(`<details ${id} class="fig${hi}"${terms && terms.length && b.x.join(" ").toLowerCase().includes(terms[0].toLowerCase()) ? " open" : ""}><summary>Figure or table text extracted from the PDF (${b.x.length} lines). The typeset version is in the submitted PDF.</summary><div class="figtext">${b.x.map(l => "<span>" + renderInline(l, null, terms) + "</span>").join("")}</div></details>`);
    else out.push(`<p ${id} class="${hi}">${renderInline(b.x, doc, terms)}</p>`);
  });
  return out.join("");
}

function wpBlocks(code){
  const rp = docById("research_plan"); if (!rp) return {head:null, blocks:[]};
  const i = rp.blocks.findIndex(b => b.t === "wp" && b.wp === code); if (i < 0) return {head:null, blocks:[]};
  const out = [];
  for (let k = i + 1; k < rp.blocks.length && !["wp", "h1", "h2"].includes(rp.blocks[k].t); k++) out.push(rp.blocks[k]);
  return {head:rp.blocks[i], blocks:out};
}

    const p = (rr, t) => (cx + rr * Math.cos(t)).toFixed(2) + " " + (cy + rr * Math.sin(t)).toFixed(2);
    d += `<path data-k="${c.key}" fill="${c.color}" d="M${p(R, a)} A${R} ${R} 0 ${large} 1 ${p(R, a2)} L${p(r, a2)} A${r} ${r} 0 ${large} 0 ${p(r, a)}Z"><title>${esc(c.label)}: ${money(c.v)} (${(100 * f).toFixed(1)}%)</title></path>`;
    a = a2;
  });
  return `<svg class="donut" viewBox="0 0 260 260" role="img" aria-label="Budget composition">${d}<text x="130" y="124" text-anchor="middle" style="font:600 20px var(--sans);fill:var(--ink)">${money(total, {short:true})}</text><text x="130" y="146" text-anchor="middle" style="font:400 12px var(--sans);fill:var(--muted)">total request</text></svg>`;
}

function wireAdmin(){

    const b64 = btoa(bin);
    const re = /(<script id="xlsx-data" type="application\/octet-stream" data-name=")[^"]*(">)[\s\S]*?(<\/script>)/;
