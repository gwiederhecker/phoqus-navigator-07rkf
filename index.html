function pDoc(m, rest){
  const doc = docById(rest[0]);
  if (!doc){ m.innerHTML = `<div class="page"><div class="panel">This document is not in the navigator. <a href="#/docs">See all documents</a>.</div></div>`; return; }
  let anchor = rest[1] || "", hiBlock = -1, terms = [];
  if (anchor.startsWith("b")){ hiBlock = +anchor.slice(1); terms = (rest[2] || "").split(/\s+/).filter(t => t.length > 1); }
  else if (anchor.startsWith("@")){
    const key = anchor.slice(1);
    hiBlock = doc.blocks.findIndex(b => ["h1", "h2", "h3", "wp"].includes(b.t) && b.x.startsWith(key));
    if (hiBlock < 0) hiBlock = doc.blocks.findIndex(b => typeof b.x === "string" && b.x.includes(key));
  }
  else if (anchor.startsWith("s")) hiBlock = doc.blocks.findIndex(b => b.id === anchor);
  const fel = DATA.fellows.find(f => f.id === doc.id);
  const list = doc.group === "documents" ? DATA.docs.filter(d => d.group === "documents") : DATA.docs.filter(d => d.group !== "documents");
  const ix = list.indexOf(doc), prev = list[ix - 1], next = list[ix + 1];
  const heads = doc.blocks.filter(b => b.id);
  const refs = Object.entries(doc.refs || {});
  m.innerHTML = `<div class="reader">
    <nav class="toc" aria-label="Contents of this document">${heads.length ? `<div class="tochead">Contents</div>` + heads.map(b => `<a class="${b.t}" href="#/doc/${doc.id}/${b.id}" data-id="${b.id}">${esc(b.t === "wp" ? b.x.replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/, "") : b.x)}</a>`).join("") : ""}${refs.length ? `<a class="h1" href="#/doc/${doc.id}/refs" data-id="refs">References</a>` : ""}</nav>
    <article class="doc">
      <div class="dmeta"><a href="${fel ? "#/fellowships" : "#/docs"}">${fel ? "Fellowships" : "Documents"}</a><span class="faint">/</span><span>${doc.pages} ${doc.pages === 1 ? "page" : "pages"} in the submitted PDF</span></div>
      <h1 class="dt">${esc(fel ? fel.code : doc.title)}</h1>
      ${fel ? `<p class="serif" style="font-size:19px;margin:-8px 0 18px;line-height:1.45">${esc(fel.title)}</p><div class="fmeta"><span>Fellowship</span><div>${esc(fel.type)}</div><span>Host</span><div>${esc(fel.host)}</div><span>Work package</span><div>${fel.wpcode ? wpChip(fel.wpcode) + " " : ""}${esc(fel.wp.replace(/^[A-Z]+-\d:\s*/, ""))}</div><span>Request</span><div>${esc(fel.wave)}</div></div>` : ""}
      <div class="body">${renderBlocks(doc, terms, hiBlock)}
      ${refs.length ? `<section class="refs" id="refs"><h3 style="font-size:14px;margin-bottom:10px">References</h3><ol>${refs.map(([k, v]) => `<li id="ref-${k}"><span>[${k}]</span><span>${esc(v)}</span></li>`).join("")}</ol></section>` : ""}
      </div>
      <nav class="docnav" aria-label="Adjacent documents"><span>${prev ? `<a href="#/doc/${prev.id}">Previous: ${esc(prev.title)}</a>` : ""}</span><span style="text-align:right">${next ? `<a href="#/doc/${next.id}">Next: ${esc(next.title)}</a>` : ""}</span></nav>
    </article></div>`;
  const target = anchor === "refs" ? $("#refs") : (hiBlock >= 0 ? $("#" + CSS.escape(doc.blocks[hiBlock].id || "b" + hiBlock)) : null);
  if (target) setTimeout(() => target.scrollIntoView({block: hiBlock >= 0 && !doc.blocks[hiBlock].id ? "center" : "start"}), 20);
  /* toc highlighting */
  const links = $$(".toc a", m), obs = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting){ links.forEach(a => a.classList.toggle("on", a.dataset.id === e.target.id)); } }); }, {rootMargin:"0px 0px -75% 0px"});
  heads.forEach(b => { const n = document.getElementById(b.id); n && obs.observe(n); });
  $$(".toc a", m).forEach(a => a.onclick = e => { e.preventDefault(); history.replaceState(null, "", a.getAttribute("href")); const n = document.getElementById(a.dataset.id); n && n.scrollIntoView({behavior:"smooth"}); });
  wireCites(m, doc);
}
function wireCites(root, doc){
  const tip = $("#tip");
  const show = e => { const c = e.currentTarget; tip.innerHTML = c.dataset.refs.split(",").map(k => `<div>[${k}] ${esc(doc.refs[k])}</div>`).join(""); tip.classList.add("on"); const r = c.getBoundingClientRect(); const w = Math.min(420, innerWidth - 20); tip.style.left = Math.max(10, Math.min(r.left, innerWidth - w - 10)) + "px"; tip.style.top = (r.bottom + 8 + tip.offsetHeight > innerHeight ? r.top - tip.offsetHeight - 8 : r.bottom + 8) + "px"; };
  const hide = () => tip.classList.remove("on");

}

/* =====================================================================================
   Global search
   ===================================================================================== */
let INDEX = [];
function buildSearchIndex(){
  INDEX = [];
  DATA.docs.forEach(d => d.blocks.forEach((b, i) => { const x = Array.isArray(b.x) ? b.x.join(" ") : b.x; INDEX.push({d, i, x, lx:x.toLowerCase()}); }));
  const B = state.budget;
  if (B) [["Equipment", B.equipment, "equipment"], ["Consumables", B.consumables, "consumables"], ["Services", B.services, "services"]].forEach(([lab, arr, a]) => arr.forEach(x => { const t = x.desc + ". " + x.just; INDEX.push({budget:lab, anchor:a, x:t, lx:t.toLowerCase(), item:x}); }));
}
function runSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(t => t.length > 1);
  if (!terms.length) return [];
  const hits = [];
  for (const e of INDEX){
    if (!terms.every(t => e.lx.includes(t))) continue;
    let score = terms.reduce((a, t) => a + e.lx.split(t).length - 1, 0);
    if (e.d && e.d.id === "research_plan") score += 3;
    if (e.d && ["h1", "h2", "h3", "wp"].includes(e.d.blocks[e.i].t)) score += 6;
    hits.push({e, score});
  }
  return hits.sort((a, b) => b.score - a.score).slice(0, 60).map(h => ({...h, terms}));
}
function snippet(x, terms){
  const lx = x.toLowerCase(), p = lx.indexOf(terms[0]); const s = Math.max(0, p - 80), e = Math.min(x.length, p + 180);
  return highlight(esc((s ? "…" : "") + x.slice(s, e) + (e < x.length ? "…" : "")), terms);
}
function openSearch(){ const s = $("#search"); s.classList.add("on"); const q = $("#q"); q.value = ""; $("#res").innerHTML = `<div class="empty">Type at least two letters. Results come from all documents, fellowship plans and budget items.</div>`; setTimeout(() => q.focus(), 10); }
function closeSearch(){ $("#search").classList.remove("on"); }
$("#searchbtn").onclick = openSearch;
$("#search").addEventListener("click", e => { if (e.target.id === "search") closeSearch(); });
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim(), res = $("#res");
  if (q.length < 2){ res.innerHTML = `<div class="empty">Type at least two letters.</div>`; return; }
  const hits = runSearch(q);
  if (!hits.length){ res.innerHTML = `<div class="empty">No passage contains all of: ${esc(q)}. Try fewer or shorter words.</div>`; return; }
  res.innerHTML = hits.map((h, k) => {
    const e = h.e;
    if (e.budget) return `<a href="#/budget/${e.anchor}" class="${k ? "" : "sel"}"><b>Budget, ${esc(e.budget)}: ${money(e.item.eq)}</b><span>${snippet(e.x, h.terms)}</span></a>`;
    return `<a href="#/doc/${e.d.id}/b${e.i}/${encodeURIComponent(h.terms.join(" "))}" class="${k ? "" : "sel"}"><b>${esc(e.d.title)}</b><span>${snippet(e.x, h.terms)}</span></a>`;
  }).join("");
  $$("#res a").forEach(a => a.onclick = closeSearch);
});
$("#q").addEventListener("keydown", e => {
  const items = $$("#res a"); let i = items.findIndex(a => a.classList.contains("sel"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if (!items.length) return; items[i] && items[i].classList.remove("sel"); i = (i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items[i].classList.add("sel"); items[i].scrollIntoView({block:"nearest"}); }
  if (e.key === "Enter" && items[i]){ location.hash = items[i].getAttribute("href"); closeSearch(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeSearch(); document.body.classList.remove("navopen"); }
  if ((e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")){ e.preventDefault(); openSearch(); }
});
$("#menubtn").onclick = () => document.body.classList.toggle("navopen");
document.addEventListener("click", e => { if (document.body.classList.contains("navopen") && !e.target.closest("#nav") && !e.target.closest("#menubtn")) document.body.classList.remove("navopen"); });

/* =====================================================================================
   Start
   ===================================================================================== */
buildSearchIndex();
route();
loadBudgetFromBase64().then(() => { const p = location.hash.replace(/^#\/?/, "").split("/")[0]; if (["", "budget", "fellowships", "admin"].includes(p)) route(); });
</script>
